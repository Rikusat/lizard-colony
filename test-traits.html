<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>特性(Trait)描画テスト — S1見た目/S4遺伝(開発用)</title>
<style>
  body { background: #4a352f; margin: 0; color: #e8dccb; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 10px 16px 0; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; padding: 14px 16px 0; margin: 0; font-weight: 600; color: #f0d9a8; }
  p.note { font-size: 12px; padding: 2px 16px 6px; margin: 0; color: #c9b8a2; }
  canvas { display: block; }
</style>
</head>
<body>
<h1>特性システム — ミミカクシ(S1 見た目 / S4 遺伝)開発用・付与なしゲームには無影響・セーブ非接触</h1>
<canvas id="game" width="760" height="1620"></canvas>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script>
// メモリ上だけで動作しセーブに触れない開発用ページ。
globalThis.UI = { toast: () => {} }; // ui.js非読込のためスタブ
Game.newGame();
Game.state.lizards = [];
Render.init();
Render.time = 1.3;
const ctx = Render.ctx;
ctx.fillStyle = "#5c4238"; ctx.fillRect(0, 0, 760, 1620);
ctx.textBaseline = "alphabetic";

// 1体を (x,y) に描く(traits任意)。noCache直接パスで特性の上乗せを確実に反映。
const draw1 = (sp, x, y, morph, traits) => {
  const lz = Game.makeLizard(sp.id, morph || "normal", { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: "stripe", traits: traits }, "adult");
  lz.x = x; lz.y = y; lz.tx = x; lz.ty = y; lz.angle = 0.12; lz.moving = false;
  Render.drawLizard(ctx, lz, true);
  return lz;
};
const label = (s, x, y, col) => { ctx.fillStyle = col || "#e8dccb"; ctx.font = "12px system-ui"; ctx.fillText(s, x, y); };

// ===== 上段: S1 見た目 — 全8種族「通常 vs ミミカクシ」 =====
label("■ S1 見た目: 左=通常 / 右=ミミカクシ(眼〜頬の仮面帯+藍の徴・眼は穴から覗く)。魂の骨格は不変。", 16, 62, "#f0d9a8");
SPECIES.forEach((sp, r) => {
  const y = 110 + r * 92;
  draw1(sp, 230, y, "normal", []);
  draw1(sp, 560, y, "normal", [{ key: "mimikakushi" }]);
  label(sp.name, 16, y + 4);
});

// ===== 下段: S4 遺伝 — 極小確率のガチャ(親2体ミミカクシを大量繁殖→継承した子だけ表示) =====
const demoY = 110 + 8 * 92 + 40;
label("■ S4 遺伝(極小確率ガチャ): 親2体ミミカクシ(tier3=約4%)を大量繁殖。ほとんどは非継承。継承した子だけ下に並ぶ。血統外の新特性は繁殖では出ない(genesis限定)。", 16, demoY - 14, "#f0d9a8");
const sp = SPECIES[3]; // フトアゴ(明色で仮面が見やすい)
const pA = draw1(sp, 150, demoY + 40, "normal", [{ key: "mimikakushi" }]);
const pB = draw1(sp, 150, demoY + 130, "normal", [{ key: "mimikakushi" }]);
label("親A(ミミカクシ)", 40, demoY + 42);
label("親B(ミミカクシ)", 40, demoY + 132);
// seed固定の決定論rng(スクショ再現用)。Game.inheritTraits は乱数窓口を注入できる(fable2)。
// ※lcg は render.js のグローバルを流用(seed→[0,1)の関数を返す)。
const rng = lcg(20260722);
const TRIES = 200; let hits = 0; const inheritors = [];
for (let i = 0; i < TRIES; i++) {
  const traits = Game.inheritTraits(pA, pB, rng); // 実ロジックで子の特性を決定
  if (traits.length) { hits++; if (inheritors.length < 6) inheritors.push(traits); }
}
label(`${TRIES}回の繁殖 → ${hits}匹が継承(実測 ${(100 * hits / TRIES).toFixed(1)}%)。狙って平均 ${(TRIES / hits).toFixed(0)}回で1匹=射幸心と、やり込み。`, 380, demoY + 20, "#f0d9a8");
label("↓ 継承した子(ミミカクシが正しく現れる):", 380, demoY + 40, "#9fd4a0");
inheritors.forEach((traits, i) => {
  const cx = 400 + (i % 3) * 120, cy = demoY + 90 + Math.floor(i / 3) * 80;
  draw1(sp, cx, cy, "normal", traits);
});
label("※2つの特性を両方持つ子は各pの積=小数点%(数百〜千回級)=トップやり込み層の目標。到達保証はS5賢者の石(固定化)。", 16, demoY + 250, "#c9b8a2");
</script>
</body>
</html>
