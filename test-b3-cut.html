<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>R5-b B3カット — チェレンコ/ハガネ/ムメイ(開発用・Ric判定前)</title>
<!-- R5-b B3: 現意匠と刷新の並置比較(3種×両固有種)+血統列2本(ヨウガン+ヒョウガ→ハガネ/ミミカクシ+ハクシ→ムメイ)
     +遠目実寸。血統列=素材(芯線なし)と合成(深紅の芯線)の格差検分を兼ねる。
     旧意匠=git記録(08db734時点)の各trait関数を本ページ内に複製し関数スワップで同一フレーム描画。
     localStorageサンドボックス=本セーブ非接触。.vercelignoreでdev限定。ローカルのみ・デプロイなし。 -->
<script>
(function () {
  const mem = {};
  const shim = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { for (const k in mem) delete mem[k]; } };
  Object.defineProperty(window, "localStorage", { value: shim, configurable: false });
})();
</script>
<style>
  body { background: #221a12; margin: 0; color: #e8dccb; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 10px 16px 0; margin: 0; font-weight: 600; }
  p.note { font-size: 12px; padding: 2px 16px 8px; margin: 0; color: #c9b8a2; }
  canvas { display: block; }
</style>
</head>
<body>
<h1>B3カット — 各ブロック: 上段=現意匠 / 下段=刷新・左=カナヘビ/右=ニホントカゲ</h1>
<p class="note">文法=シズミマチ基準。3種とも完全静止(臨界光=連続光・鋼と白=動かない)。合成2種=深紅の芯線維持。</p>
<canvas id="game" width="10" height="10" style="display:none"></canvas>
<canvas id="cmp" width="900" height="840"></canvas>
<h1>血統列1 — ヨウガン+ヒョウガ→ハガネ(素材=芯線なし/合成=深紅の芯線・格差の検分)</h1>
<canvas id="blood1" width="900" height="260"></canvas>
<h1>血統列2 — ミミカクシ+ハクシ(維持=刷新されない親)→ムメイ(刷新された成果・幾何引用で血統が読めるか)</h1>
<canvas id="blood2" width="900" height="260"></canvas>
<h1>遠目 — 飼育槽実寸(通常個体の群れの中のB3保持3匹・琥珀枠)</h1>
<canvas id="far" width="900" height="330"></canvas>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script>
globalThis.UI = { toast: () => {} };
Game.newGame(); Game.state.lizards = [];
Render.init(); Render.time = 1.3;

// ---- 旧意匠(git記録 08db734時点・比較用に複製) ----
function oldCherenko(ctx, g, def) {
  const { body, L } = g; if (!body) return;
  const c = def.rim || "#6FB8A0";
  ctx.save();
  ctx.strokeStyle = c; ctx.shadowColor = c; ctx.shadowBlur = Math.max(4, L * 0.05);
  ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1, L * 0.011);
  ctx.stroke(body);
  ctx.globalAlpha = 0.25; ctx.lineWidth = Math.max(2, L * 0.024);
  ctx.stroke(body);
  ctx.restore();
}
function oldHagane(ctx, g, def) {
  const { S, body, L } = g; if (!S || !body) return;
  ctx.save(); ctx.clip(body); ctx.lineCap = "round";
  const at = (t, dy) => { const s = S(t); return { x: s.p.x, y: s.p.y + s.w * 0.05 + (dy || 0) }; };
  ctx.strokeStyle = def.rim || "#9FB2C0"; ctx.globalAlpha = 0.88; ctx.lineWidth = Math.max(3, L * 0.048);
  ctx.beginPath(); for (let i = 0; i <= 8; i++) { const p = at(0.42 + i * 0.05); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.stroke();
  ctx.strokeStyle = "rgba(240,248,252,.92)"; ctx.lineWidth = Math.max(1, L * 0.011);
  ctx.beginPath(); for (let i = 0; i <= 16; i++) { const p = at(0.42 + i * 0.025, L * 0.022 + Math.sin(i * 1.55) * L * 0.008); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.stroke();
  ctx.strokeStyle = "rgba(50,60,68,.9)"; ctx.lineWidth = Math.max(1, L * 0.009);
  for (const t of [0.52, 0.66]) { const p = at(t); ctx.beginPath(); ctx.moveTo(p.x - L * 0.012, p.y - L * 0.024); ctx.lineTo(p.x + L * 0.012, p.y + L * 0.024); ctx.stroke(); }
  ctx.strokeStyle = "#8E1826"; ctx.globalAlpha = 0.8; ctx.lineWidth = Math.max(0.8, L * 0.006);
  ctx.beginPath(); for (let i = 0; i <= 8; i++) { const p = at(0.45 + i * 0.036, -L * 0.013); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.stroke();
  ctx.restore();
}
function oldMumei(ctx, g, def) {
  const { ex, ey, eyeR, body, L } = g;
  const white = def.rim || "#F3EFE6";
  ctx.save();
  const hw = eyeR * 3.4, hh = eyeR * 2.0, cx = ex + eyeR * 0.2, cy = ey + eyeR * 0.15, rot = -0.12;
  ctx.fillStyle = white; ctx.globalAlpha = 0.94;
  ctx.beginPath(); ctx.ellipse(cx, cy, hw, hh, rot, 0, 7); ctx.fill();
  ctx.strokeStyle = "#b9b4a8"; ctx.globalAlpha = 0.7; ctx.lineWidth = Math.max(1, eyeR * 0.3);
  ctx.beginPath(); ctx.ellipse(cx, cy, hw * 0.96, hh * 0.96, rot, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1; ctx.fillStyle = "#0d0906";
  ctx.beginPath(); ctx.arc(ex, ey, eyeR * 0.92, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.beginPath(); ctx.arc(ex + eyeR * 0.3, ey - eyeR * 0.32, eyeR * 0.28, 0, 7); ctx.fill();
  if (body) {
    ctx.setLineDash([Math.max(3, L * 0.035), Math.max(3, L * 0.03)]);
    ctx.strokeStyle = white; ctx.globalAlpha = 0.55; ctx.lineWidth = Math.max(1, L * 0.009);
    ctx.stroke(body);
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = "#8E1826"; ctx.globalAlpha = 0.8; ctx.lineWidth = Math.max(0.8, eyeR * 0.2);
  ctx.beginPath(); ctx.ellipse(cx, cy, hw * 0.9, hh * 0.9, rot, Math.PI * 0.25, Math.PI * 0.72); ctx.stroke();
  ctx.restore();
}
const OLD = { cherenko: oldCherenko, hagane: oldHagane, mumei: oldMumei };
const FN = { cherenko: "traitCherenko", hagane: "traitHagane", mumei: "traitMumei" };
const NEW = {}; for (const k in FN) NEW[k] = Render[FN[k]];

const spA = SPECIES.find((s) => s.id === "kanahebi"), spB = SPECIES.find((s) => s.id === "nihontokage");
function mk(sp, key) {
  return Game.makeLizard(sp.id, "normal", { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: "stripe", traits: [{ key }] }, "adult");
}
function drawAt(ctx, lz, x, y, scale) {
  lz.x = x / scale; lz.y = y / scale; lz.tx = lz.x; lz.ty = lz.y; lz.angle = 0.12; lz.moving = false;
  ctx.save(); ctx.scale(scale, scale);
  Render.drawLizard(ctx, lz, true);
  ctx.restore();
}
function clearCache() { Render._lizCache && Render._lizCache.clear && Render._lizCache.clear(); }

// ---- 近目並置(1.8倍・3種×現/刷新×両種) ----
const c1 = document.getElementById("cmp").getContext("2d");
c1.fillStyle = "#2c2118"; c1.fillRect(0, 0, 900, 840);
const NAMES = { cherenko: "チェレンコ(水中で燃える冷たい青)", hagane: "ハガネ(焼き入れの刃紋)", mumei: "ムメイ(名を消された白)" };
["cherenko", "hagane", "mumei"].forEach((key, bi) => {
  const y0 = bi * 280;
  c1.font = "13px system-ui"; c1.fillStyle = "#e4bc3a";
  c1.fillText(NAMES[key], 20, y0 + 20);
  c1.fillStyle = "#c9b8a2";
  c1.fillText("現", 20, y0 + 80); c1.fillText("新", 20, y0 + 210);
  Render[FN[key]] = OLD[key]; clearCache();
  drawAt(c1, mk(spA, key), 250, y0 + 90, 1.8); drawAt(c1, mk(spB, key), 670, y0 + 90, 1.8);
  Render[FN[key]] = NEW[key]; clearCache();
  drawAt(c1, mk(spA, key), 250, y0 + 220, 1.8); drawAt(c1, mk(spB, key), 670, y0 + 220, 1.8);
});

// ---- 血統列1: ヨウガン+ヒョウガ→ハガネ ----
const c3 = document.getElementById("blood1").getContext("2d");
c3.fillStyle = "#241c26"; c3.fillRect(0, 0, 900, 260);
c3.font = "13px system-ui"; c3.fillStyle = "#c9b8a2";
c3.fillText("ヨウガン(素材=熱の橙・芯線なし)", 40, 30); c3.fillText("ヒョウガ(素材=冷却の波・芯線なし)", 330, 30); c3.fillText("ハガネ(合成=刃文+深紅の芯線)", 650, 30);
c3.fillText("+", 320, 150); c3.fillText("→", 610, 150);
drawAt(c3, mk(spA, "yougan"), 170, 150, 1.8);
drawAt(c3, mk(spA, "hyoga"), 460, 150, 1.8);
drawAt(c3, mk(spA, "hagane"), 760, 150, 1.8);

// ---- 血統列2: ミミカクシ+ハクシ(維持)→ムメイ ----
const c4 = document.getElementById("blood2").getContext("2d");
c4.fillStyle = "#241c26"; c4.fillRect(0, 0, 900, 260);
c4.font = "13px system-ui"; c4.fillStyle = "#c9b8a2";
c4.fillText("ミミカクシ(維持=仮面の幾何)", 40, 30); c4.fillText("ハクシ(維持=白斑の楕円文法)", 330, 30); c4.fillText("ムメイ(合成=白い仮面+大判の白抜け+芯線)", 610, 30);
c4.fillText("+", 320, 150); c4.fillText("→", 610, 150);
drawAt(c4, mk(spA, "mimikakushi"), 170, 150, 1.8);
drawAt(c4, mk(spA, "hakushi"), 460, 150, 1.8);
drawAt(c4, mk(spA, "mumei"), 760, 150, 1.8);

// ---- 遠目(実寸1.0×・通常個体の群れ+B3保持3匹) ----
const c2 = document.getElementById("far").getContext("2d");
c2.fillStyle = "#b39869"; c2.fillRect(0, 0, 900, 330);
const spots = [[110, 80], [260, 200], [420, 90], [700, 70], [820, 210], [180, 265], [560, 280], [760, 160]];
spots.forEach(([x, y], i) => {
  const sp = i % 2 ? spA : spB;
  const lz = Game.makeLizard(sp.id, "normal", { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: ["stripe", "spot", "none"][i % 3], traits: [] }, "adult");
  drawAt(c2, lz, x, y, 1.0);
});
[["cherenko", 320, 160], ["hagane", 540, 130], ["mumei", 620, 250]].forEach(([key, x, y], i) => {
  drawAt(c2, mk(i % 2 ? spB : spA, key), x, y, 1.0);
  c2.strokeStyle = "#e4bc3a"; c2.globalAlpha = .5; c2.strokeRect(x - 52, y - 30, 104, 62); c2.globalAlpha = 1;
  c2.font = "11px system-ui"; c2.fillStyle = "#e4bc3a"; c2.fillText(NAMES[key].split("(")[0], x - 50, y - 36);
});
</script>
</body>
</html>
