<title>本部 GBA規律の基準カット(開発用・資産記録)</title>

     旧8bitスプライト(3案レンダラ+#v左パネル)はRic許可(2026-07-24)で削除。比較スクショは会話ログ+HANDOFFに記録済。
     残置資産: SCENE定義(採用配置の原本)・RAMP/GBA規律(基準)・整数倍ブリットの枠組み。本実装の単一の真実は js/ui/screens/hqlab.js。 -->
<style>
  body { background: #0d0b09; margin: 0; color: #e8dccb; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 10px 16px 2px; margin: 0; font-weight: 600; }
  p.note { font-size: 12px; padding: 0 16px 8px; margin: 0; color: #c9b8a2; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
</style>

<body>
<h1>本部 GBA/GBC後期規律 — 基準カット(採用版の記録)</h1>
<p class="note">6規律: 色ランプ3〜4段(RAMP)・セレクティブ輪郭(最暗+上辺明抜き)・材質の描き分け・大面積の分割(揺らぎ/目地/摩耗)・白タイル+深紅/琥珀・整数倍拡大死守。本実装=js/ui/screens/hqlab.js(このページは基準の記録)。</p>
<canvas id="cv" width="1272" height="700"></canvas>
<script>
// ============================================================
// 資産1: SCENE定義(案A採用配置の原本。本実装 LAB_SCENE の出典)
// ============================================================
const ROOM = { cols: 22, rows: 14 };
const EQUIP = [
  { t: "desk", x: 3, y: 2 }, { t: "rack", x: 9, y: 1 }, { t: "tank", x: 16, y: 3 },
  { t: "rocket", x: 17, y: 9 }, { t: "shelfMain", x: 1, y: 7 },
];
// ============================================================
// 資産2: RAMP=GBA規律の色ランプ(基準。本実装 hqlab.js の RAMP と同一定義)
// ============================================================
const RAMP = {
  floor: [[196, 190, 178], [214, 208, 196], [226, 220, 208], [238, 233, 222]],
  wall: [[104, 100, 92], [150, 146, 136], [186, 182, 172], [212, 208, 198]],
  metal: [[64, 68, 74], [104, 108, 116], [148, 152, 160], [206, 210, 218]],
  wood: [[92, 68, 42], [136, 104, 66], [170, 138, 94], [200, 172, 130]],
  paper: [[186, 180, 166], [218, 212, 198], [242, 238, 228], [252, 250, 244]],
  water: [[52, 110, 150], [84, 152, 192], [120, 190, 220], [172, 222, 242]],
  crimson: [[86, 10, 22], [142, 24, 38], [186, 52, 64], [222, 104, 104]],
  amber: [[132, 94, 18], [188, 142, 30], [222, 178, 54], [244, 214, 118]],
  glass: [[150, 178, 190], [190, 214, 224], [220, 238, 244], [244, 252, 254]],
  led: [[26, 88, 44], [56, 140, 78], [96, 186, 118], [152, 226, 166]],
};
// ============================================================
// 資産3: 整数倍ブリットの枠組み — 基準カット=承認済み#vのGBA側(代表スプライト2種)を記録として描く
// ============================================================
const VCFG = { rampSteps: 4, floorJitter: 1, grainLines: 2 };
const rc = (m, i) => { const v = RAMP[m][Math.min(i, VCFG.rampSteps - 1)]; return "rgb(" + v[0] + "," + v[1] + "," + v[2] + ")"; };
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const K = 3, W0 = 424, H0 = 220;
const off = document.createElement("canvas"); off.width = W0; off.height = H0;
const c = off.getContext("2d");
const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const dth = (x, y, w, h, col) => { c.fillStyle = col; for (let yy = Math.round(y); yy < y + h; yy++) for (let xx = Math.round(x) + (yy % 2); xx < x + w; xx += 2) c.fillRect(xx, yy, 1, 1); };
const T = 16, CUT = { cols: 24, rows: 10 }, RX = (W0 - CUT.cols * T) / 2, RY = 40;
const hash2 = (a, b) => (((a + 7) * 73856093) ^ ((b + 3) * 19349663)) >>> 0;
px(0, 0, W0, H0, "rgb(13,11,9)");
// 壁(パネル分割+上辺明抜き+巾木)
px(RX - 4, RY - 20, CUT.cols * T + 8, 20, rc("wall", 1)); px(RX - 4, RY - 20, CUT.cols * T + 8, 2, rc("wall", 3));
for (let i = 1; i < 8; i++) px(RX - 4 + i * (CUT.cols * T + 8) / 8, RY - 18, 1, 15, rc("wall", 0));
px(RX - 4, RY - 7, CUT.cols * T + 8, 2, rc("wall", 2)); px(RX - 4, RY - 5, CUT.cols * T + 8, 5, rc("wall", 0));
// 床(揺らぎ+目地+明段)
for (let gx = 0; gx < CUT.cols; gx++) for (let gy = 0; gy < CUT.rows; gy++) {
  const X = RX + gx * T, Y = RY + gy * T, base = (gx + gy) % 2 ? 1 : 2, j = (hash2(gx, gy) % 2) * VCFG.floorJitter;
  px(X, Y, T, T, rc("floor", Math.min(3, base + j)));
  px(X, Y + T - 1, T, 1, rc("floor", 0)); px(X + T - 1, Y, 1, T, rc("floor", 0)); px(X, Y, T, 1, rc("floor", 3));
}
// 基準スプライト2種(検証カット承認版の代表: 投資端末+錬成槽)
(function desk(x, y) {
  dth(x + 1, y + 28, 64, 3, rc("floor", 0));
  px(x, y, 64, 30, rc("metal", 1)); px(x, y, 64, 4, rc("metal", 2)); px(x, y, 64, 1, rc("metal", 3)); px(x, y + 26, 64, 4, rc("metal", 0));
  px(x + 32, y + 2, 1, 26, rc("metal", 0));
  for (let i = 0; i < 4; i++) px(x + 52, y + 8 + i * 4, 8, 1, rc("metal", 0));
  px(x + 5, y + 5, 22, 14, rc("metal", 0)); px(x + 7, y + 7, 18, 10, rc("water", 1)); px(x + 7, y + 7, 18, 3, rc("water", 2)); px(x + 8, y + 15, 16, 1, rc("water", 0));
  px(x + 30, y + 7, 15, 11, rc("metal", 0)); px(x + 32, y + 9, 11, 7, rc("crimson", 0));
  c.strokeStyle = rc("crimson", 2); c.beginPath();
  for (let i = 0; i <= 10; i++) { const yy = y + 12.5 + ((i % 4 === 1) ? -2 : (i % 4 === 3) ? 2 : 0); i ? c.lineTo(x + 33 + i, yy) : c.moveTo(x + 33, yy); }
  c.stroke();
  c.strokeStyle = rc("metal", 0); c.strokeRect(x + 0.5, y + 0.5, 64, 30); px(x + 1, y, 63, 1, rc("metal", 3));
})(RX + 3 * T, RY + 2 * T);
(function tank(x, y) {
  dth(x + 1, y + 46, 48, 3, rc("floor", 0));
  px(x, y, 48, 48, rc("metal", 1)); px(x, y, 48, 2, rc("metal", 3)); px(x, y + 46, 48, 2, rc("metal", 0));
  for (const b of [[2, 2], [44, 2], [2, 44], [44, 44]]) px(x + b[0], y + b[1], 2, 2, rc("metal", 3));
  px(x + 4, y + 4, 40, 40, rc("water", 1)); dth(x + 5, y + 5, 38, 8, rc("water", 2)); px(x + 5, y + 5, 38, 1, rc("glass", 3)); px(x + 6, y + 38, 36, 5, rc("water", 0));
  dth(x + 16, y + 16, 16, 4, rc("crimson", 1)); px(x + 20, y + 19, 8, 8, rc("crimson", 2)); px(x + 21, y + 20, 3, 2, rc("crimson", 3));
  c.strokeStyle = rc("metal", 0); c.strokeRect(x + 0.5, y + 0.5, 48, 48); px(x + 1, y, 47, 1, rc("metal", 3));
})(RX + 16 * T, RY + 3 * T);
// 整数倍ブリット
g.imageSmoothingEnabled = false;
g.fillStyle = "rgb(13,11,9)"; g.fillRect(0, 0, cv.width, cv.height);
g.drawImage(off, 0, 0, W0, H0, (cv.width - W0 * K) / 2, (cv.height - H0 * K) / 2, W0 * K, H0 * K);
</script>
</body>
