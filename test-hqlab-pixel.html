<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>本部v2.0 参照スタイル3案比較(#a カイロ俯瞰 / #b Core Keeper / #c PS1研究所)</title>
<style>
  body { background: #0d0b09; margin: 0; color: #e8dccb; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 10px 16px 2px; margin: 0; font-weight: 600; }
  p.note { font-size: 12px; padding: 0 16px 8px; margin: 0; color: #c9b8a2; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
</style>
</head>
<body>
<h1 id="title">スタイル比較</h1>
<p class="note">共通: 壁のある部屋・外は照明の外の暗さ・プロップ16種(3案同一セット/同一配置)・1ドット3px(整数倍死守)・階調3段+ディザ(影縁/液面)・白タイル+深紅/琥珀。#a/#bで切替。</p>
<canvas id="cv" width="1272" height="930"></canvas>
<script>
// ============================================================
// 3案共通のシーン定義(同一プロップ・同一機能設備配置)。差=スタイル(投影/照明/パレット)のみ。
// プロップ16種: shelfJars(標本瓶棚) papers(書類の山) cables(ケーブル束) waveMon(深紅波形モニタ)
//  tubeRack(試験管ラック) oreCrate(鉱石木箱) cart(台車) mold(床の配線モール) pipe(細い蒸気パイプ)
//  ladder(脚立) trash(ゴミ箱) cup(コーヒーカップ) ext(消火器) board(ホワイトボード) stain(床のシミ) light(埋込ライト)
// 主役機材: desk(投資端末) tank(錬成槽) rocket(ロケット) shelfMain(標本棚) rack(サーバーラック)
// ============================================================
const ROOM = { cols: 22, rows: 14 };
const EQUIP = [
  { t: "desk", x: 3, y: 2 }, { t: "rack", x: 9, y: 1 }, { t: "tank", x: 16, y: 3 },
  { t: "rocket", x: 17, y: 9 }, { t: "shelfMain", x: 1, y: 7 },
];
const PROPS = [
  { t: "board", x: 6, y: 0 }, { t: "pipe", x: 0, y: 0 }, { t: "light", x: 5, y: 4 }, { t: "light", x: 12, y: 7 }, { t: "light", x: 17, y: 5 },
  { t: "shelfJars", x: 13, y: 1 }, { t: "shelfJars", x: 15, y: 1 }, { t: "waveMon", x: 7, y: 2 },
  { t: "tubeRack", x: 5, y: 3 }, { t: "tubeRack", x: 15, y: 4 }, { t: "papers", x: 2, y: 4 }, { t: "papers", x: 6, y: 5 }, { t: "papers", x: 12, y: 3 },
  { t: "cables", x: 8, y: 4 }, { t: "cables", x: 11, y: 2 }, { t: "oreCrate", x: 19, y: 2 }, { t: "oreCrate", x: 20, y: 3 }, { t: "oreCrate", x: 19, y: 6 },
  { t: "cart", x: 13, y: 6 }, { t: "ladder", x: 10, y: 9 }, { t: "trash", x: 4, y: 6 }, { t: "trash", x: 16, y: 7 },
  { t: "cup", x: 4.6, y: 2.4 }, { t: "cup", x: 13.5, y: 6.3 }, { t: "ext", x: 8, y: 12.4 }, { t: "ext", x: 0.3, y: 6 },
  { t: "mold", x: 3, y: 8, len: 8 }, { t: "mold", x: 14, y: 10, len: 6 }, { t: "stain", x: 7, y: 7 }, { t: "stain", x: 18, y: 12 }, { t: "stain", x: 2, y: 11 },
  { t: "papers", x: 9, y: 11 }, { t: "cables", x: 6, y: 12 }, { t: "tubeRack", x: 12, y: 12 }, { t: "oreCrate", x: 1, y: 12 }, { t: "cart", x: 19, y: 11.5 },
];
const MODES = {
  a: { name: "#a カイロソフト系俯瞰 — 明快グリッド・輪郭くっきり・明るめ", proj: "top", lighting: false, bright: true, sat: 1.0 },
  b: { name: "#b Core Keeper系 — 壁と照明が主役・暗部許可・光が空間を切り取る", proj: "top", lighting: true, bright: false, sat: 0.9 },
  c: { name: "#c PS1研究所系 — 深アイソメ・低彩度・配管とダクトの無骨な施設", proj: "iso", lighting: false, bright: false, sat: 0.55 },
};
MODES.v = { name: "#v 検証カット — 左:現行#a(8bit) vs 右:GBA/GBC後期(色ランプ+材質+セレクティブ輪郭)", proj: "verify", lighting: false, bright: true, sat: 1.0 };
const mode = MODES[(location.hash || "#a").slice(1)] || MODES.a;
document.getElementById("title").textContent = "スタイル比較 — " + mode.name;

const cv = document.getElementById("cv"), g = cv.getContext("2d");
const K = 3, W0 = 424, H0 = 310; // 1ドット=3px(1920時・整数倍死守)
const off = document.createElement("canvas"); off.width = W0; off.height = H0;
const c = off.getContext("2d");
// ---- 色: [r,g,b]→スタイル係数(彩度/明度)→3段階調 ----
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const desat = (col) => { const l = (col[0] + col[1] + col[2]) / 3; return mix(col, [l, l, l], 1 - mode.sat); };
const css = (col, f) => { const d = desat(col); return `rgb(${d[0] * f | 0},${d[1] * f | 0},${d[2] * f | 0})`; };
const C = { // 基色(白タイル+深紅/琥珀の規律)
  floor: [232, 226, 214], floorAlt: [220, 214, 201], wall: [201, 196, 184], wallDk: [122, 117, 106],
  ink: [30, 26, 20], metal: [148, 150, 152], metalDk: [96, 98, 102], wood: [164, 132, 88],
  paper: [244, 240, 230], screen: [110, 200, 220], crimson: [142, 24, 38], amber: [216, 168, 40],
  water: [96, 170, 210], green: [120, 190, 130],
};
const px = (x, y, w, h, col, f) => { c.fillStyle = typeof col === "string" ? col : css(col, f == null ? 1 : f); c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function dither(x, y, w, h, col, f) { // 市松ディザ(影縁/液面用)
  c.fillStyle = typeof col === "string" ? col : css(col, f == null ? 1 : f);
  for (let yy = Math.round(y); yy < y + h; yy++) for (let xx = Math.round(x) + (yy % 2); xx < x + w; xx += 2) c.fillRect(xx, yy, 1, 1);
}

// ============================================================
// トップダウン共通(案A/案B)。タイル16px。壁=上面バンド+側壁。
// ============================================================
function renderTop() {
  const T = 16, RX = (W0 - ROOM.cols * T) / 2, RY = 42;
  px(0, 0, W0, H0, C.ink, 0.4); // 照明の外
  // --- 照明レベル(案B): タイル中心→最寄り光源距離で3段 ---
  const lights = PROPS.filter((p) => p.t === "light").map((p) => ({ x: p.x + 0.5, y: p.y + 0.5 }));
  lights.push({ x: EQUIP[2].x + 1.5, y: EQUIP[2].y + 1.5 }); // 錬成槽の液光
  const lvOf = (gx, gy) => {
    if (!mode.lighting) return 1;
    let d = 99; for (const L of lights) d = Math.min(d, Math.hypot(gx + 0.5 - L.x, gy + 0.5 - L.y));
    return d < 3.2 ? 1 : d < 5.5 ? 0.72 : 0.5;
  };
  // --- 床 ---
  for (let gx = 0; gx < ROOM.cols; gx++) for (let gy = 0; gy < ROOM.rows; gy++) {
    const f = lvOf(gx, gy);
    px(RX + gx * T, RY + gy * T, T, T, (gx + gy) % 2 ? C.floorAlt : C.floor, f);
    px(RX + gx * T, RY + gy * T, T, 1, C.floorAlt, f * 0.92); // 目地(階調段)
    px(RX + gx * T, RY + gy * T, 1, T, C.floorAlt, f * 0.92);
    if (mode.lighting) { // 照明リング境界のディザ(段の縁)
      const f2 = lvOf(gx - 1, gy);
      if (Math.abs(f - f2) > 0.1) dither(RX + gx * T, RY + gy * T, 2, T, C.floor, Math.max(f, f2) * 0.86);
    }
  }
  // --- 壁(奥=高さバンド・左右=側壁・手前=低い縁) ---
  px(RX - 6, RY - 26, ROOM.cols * T + 12, 26, C.wall, mode.bright ? 1 : 0.66);
  px(RX - 6, RY - 26, ROOM.cols * T + 12, 3, C.wall, mode.bright ? 1.06 : 0.8); // 上面の明段
  px(RX - 6, RY - 4, ROOM.cols * T + 12, 4, C.wallDk, mode.bright ? 1 : 0.7);   // 巾木
  px(RX - 6, RY, 6, ROOM.rows * T, C.wallDk, mode.bright ? 1 : 0.6);
  px(RX + ROOM.cols * T, RY, 6, ROOM.rows * T, C.wallDk, mode.bright ? 1 : 0.6);
  px(RX - 6, RY + ROOM.rows * T, ROOM.cols * T + 12, 5, C.wallDk, mode.bright ? 0.9 : 0.55);
  c.strokeStyle = css(C.ink, 1); c.lineWidth = 1; c.strokeRect(RX - 6.5, RY - 26.5, ROOM.cols * T + 13, ROOM.rows * T + 32);
  const O = mode.bright; // 輪郭くっきり(案A)
  const outline = (x, y, w, h) => { if (O) { c.strokeStyle = css(C.ink, 1); c.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, w, h); } };
  const at = (gx, gy) => ({ x: RX + gx * T, y: RY + gy * T });
  const shadow = (x, y, w, h, f) => dither(x, y + h - 2, w, 3, C.ink, 0.75);
  // --- スプライト(トップダウン・案A/Bで共有・照明係数fで暗部) ---
  const draw = {
    desk(p, f) { const { x, y } = p; shadow(x, y, 64, 32); px(x, y, 64, 30, C.metal, f); px(x, y, 64, 4, C.metal, f * 1.12); px(x + 6, y + 6, 20, 12, C.ink, f); px(x + 8, y + 8, 16, 8, C.screen, 1); px(x + 30, y + 8, 14, 9, C.ink, f); px(x + 32, y + 10, 10, 5, C.screen, 0.9); px(x + 48, y + 9, 10, 6, C.paper, f); outline(x, y, 64, 30); },
    rack(p, f) { const { x, y } = p; shadow(x, y, 32, 18); px(x, y, 32, 16, C.ink, f * 1.4); px(x + 2, y + 2, 28, 12, C.metalDk, f); for (let i = 0; i < 4; i++) { px(x + 4 + i * 7, y + 4, 1, 1, C.green, 1); px(x + 4 + i * 7, y + 7, 1, 1, i % 2 ? C.amber : C.green, 1); } outline(x, y, 32, 16); },
    tank(p, f) { const { x, y } = p; shadow(x, y, 48, 48); px(x, y, 48, 48, C.metalDk, f); px(x + 3, y + 3, 42, 42, C.water, f * 0.8); dither(x + 5, y + 5, 38, 10, C.water, 1.15); px(x + 20, y + 20, 8, 8, C.crimson, 1); dither(x + 16, y + 16, 16, 3, C.crimson, 0.8); px(x, y, 48, 2, C.metal, f * 1.1); outline(x, y, 48, 48); },
    rocket(p, f) { const { x, y } = p; shadow(x, y, 48, 48); px(x, y, 48, 48, C.metalDk, f * 0.9); px(x + 8, y + 8, 32, 32, C.metal, f); px(x + 14, y + 14, 20, 20, C.paper, f); px(x + 19, y + 19, 10, 10, C.amber, 1); px(x + 22, y + 6, 4, 4, C.crimson, 1); outline(x, y, 48, 48); },
    shelfMain(p, f) { const { x, y } = p; shadow(x, y, 32, 64); px(x, y, 32, 64, C.wood, f); px(x + 2, y + 2, 28, 60, C.wood, f * 0.8); for (let r = 0; r < 4; r++) for (let j = 0; j < 3; j++) px(x + 5 + j * 9, y + 5 + r * 15, 6, 9, C.water, f * 1.1); outline(x, y, 32, 64); },
    shelfJars(p, f) { const { x, y } = p; px(x, y, 28, 12, C.wood, f); for (let j = 0; j < 5; j++) px(x + 2 + j * 5, y + 2, 3, 8, C.water, f * 1.15); outline(x, y, 28, 12); },
    papers(p, f) { const { x, y } = p; px(x, y, 12, 10, C.paper, f); px(x + 2, y - 2, 12, 10, C.paper, f * 0.94); px(x + 3, y + 1, 9, 1, C.ink, f * 2.4); px(x + 3, y + 3, 7, 1, C.ink, f * 2.4); outline(x + 2, y - 2, 12, 10); },
    cables(p, f) { const { x, y } = p; c.strokeStyle = css(C.ink, f * 1.8); c.lineWidth = 2; c.beginPath(); c.moveTo(x, y + 8); c.bezierCurveTo(x + 6, y, x + 10, y + 14, x + 16, y + 5); c.stroke(); c.strokeStyle = css(C.crimson, f); c.lineWidth = 1; c.beginPath(); c.moveTo(x + 1, y + 10); c.bezierCurveTo(x + 7, y + 3, x + 9, y + 15, x + 15, y + 8); c.stroke(); },
    waveMon(p, f) { const { x, y } = p; px(x, y, 22, 16, C.ink, f * 1.5); px(x + 2, y + 2, 18, 12, C.ink, f * 0.8); c.strokeStyle = css(C.crimson, 1.15); c.lineWidth = 1; c.beginPath(); for (let i = 0; i <= 16; i++) { const yy = y + 8 + ((i % 4 === 1) ? -4 : (i % 4 === 3) ? 4 : 0); i ? c.lineTo(x + 3 + i, yy) : c.moveTo(x + 3, yy); } c.stroke(); outline(x, y, 22, 16); },
    tubeRack(p, f) { const { x, y } = p; px(x, y + 6, 18, 6, C.metal, f); for (let j = 0; j < 4; j++) { px(x + 2 + j * 4, y, 2, 9, C.paper, f * 1.05); px(x + 2 + j * 4, y + 4, 2, 4, j % 2 ? C.crimson : C.water, 1); } outline(x, y, 18, 12); },
    oreCrate(p, f) { const { x, y } = p; shadow(x, y, 20, 16); px(x, y, 20, 16, C.wood, f); px(x, y, 20, 3, C.wood, f * 1.15); px(x + 3, y + 4, 5, 4, C.amber, 1); px(x + 9, y + 5, 5, 4, C.water, f * 1.1); px(x + 14, y + 3, 4, 4, C.metal, f * 1.1); outline(x, y, 20, 16); },
    cart(p, f) { const { x, y } = p; shadow(x, y, 26, 16); px(x, y, 26, 12, C.metal, f); px(x + 1, y + 1, 24, 3, C.metal, f * 1.1); px(x + 2, y + 13, 4, 3, C.ink, f * 1.6); px(x + 20, y + 13, 4, 3, C.ink, f * 1.6); px(x + 4, y + 3, 8, 6, C.wood, f); outline(x, y, 26, 12); },
    mold(p, f) { const { x, y } = p; px(x, y, (p.len || 5) * T, 3, C.metalDk, f * 0.9); px(x, y, (p.len || 5) * T, 1, C.metal, f); },
    pipe(p, f) { px(RX - 4, RY - 22, ROOM.cols * T + 8, 3, C.metalDk, f); for (let i = 0; i < 7; i++) px(RX + 20 + i * 50, RY - 23, 3, 5, C.metal, f); dither(RX + 60, RY - 19, 6, 4, C.paper, 0.9); },
    ladder(p, f) { const { x, y } = p; px(x, y, 3, 26, C.amber, f); px(x + 11, y, 3, 26, C.amber, f); for (let i = 0; i < 4; i++) px(x + 3, y + 3 + i * 6, 8, 2, C.amber, f * 0.85); outline(x, y, 14, 26); },
    trash(p, f) { const { x, y } = p; px(x, y, 10, 12, C.metalDk, f); px(x, y, 10, 2, C.metal, f * 1.1); px(x + 2, y - 2, 6, 2, C.paper, f); outline(x, y, 10, 12); },
    cup(p, f) { const { x, y } = p; px(x, y, 5, 5, C.paper, f); px(x + 5, y + 1, 2, 2, C.paper, f * 0.9); px(x + 1, y + 1, 3, 1, C.wood, f * 0.7); },
    ext(p, f) { const { x, y } = p; px(x, y, 6, 12, C.crimson, 1); px(x + 1, y - 2, 2, 3, C.metal, f); outline(x, y, 6, 12); },
    board(p, f) { const { x, y } = p; px(x, y - 20, 40, 16, C.paper, f); c.strokeStyle = css(C.ink, f * 1.6); c.lineWidth = 1; c.beginPath(); c.moveTo(x + 4, y - 14); c.lineTo(x + 20, y - 14); c.moveTo(x + 4, y - 10); c.lineTo(x + 28, y - 10); c.stroke(); c.strokeStyle = css(C.crimson, 1); c.beginPath(); c.moveTo(x + 24, y - 16); c.lineTo(x + 34, y - 8); c.stroke(); outline(x, y - 20, 40, 16); },
    stain(p, f) { const { x, y } = p; dither(x, y, 14, 8, C.floorAlt, f * 0.8); },
    light(p, f) { const { x, y } = p; px(x + 4, y + 4, 8, 8, C.paper, mode.lighting ? 1.25 : 1.05); px(x + 5, y + 5, 6, 6, [255, 250, 230], 1); },
  };
  const items = [];
  for (const e of EQUIP) items.push({ ...e, kind: "equip" });
  for (const p of PROPS) items.push({ ...p, kind: "prop" });
  items.sort((p, q) => p.y - q.y);
  for (const it of items) {
    const pt = at(it.x, it.y);
    const f = lvOf(it.x, it.y);
    (draw[it.t] || (() => {}))({ ...it, x: pt.x, y: pt.y }, f);
  }
}

// ============================================================
// 深アイソメ(案C)。タイル16×8。低彩度・配管/ダクト・金属質。
// ============================================================
function renderIso() {
  px(0, 0, W0, H0, C.ink, 0.4);
  const TW = 16, TH = 8, OX = W0 / 2, OY = 84;
  const iso = (gx, gy) => ({ x: OX + (gx - gy) * TW / 2, y: OY + (gx + gy) * TH / 2 });
  const flat = (pts, col, f, line) => {
    c.beginPath(); c.moveTo(Math.round(pts[0].x) + 0.5, Math.round(pts[0].y) + 0.5);
    for (let i = 1; i < pts.length; i++) c.lineTo(Math.round(pts[i].x) + 0.5, Math.round(pts[i].y) + 0.5);
    c.closePath(); c.fillStyle = css(col, f == null ? 1 : f); c.fill();
    if (line) { c.strokeStyle = css(C.ink, 1); c.lineWidth = 1; c.stroke(); }
  };
  const box = (gx, gy, w, d, h, col, fTop, line) => {
    const p00 = iso(gx, gy), p10 = iso(gx + w, gy), p11 = iso(gx + w, gy + d), p01 = iso(gx, gy + d);
    const up = (p) => ({ x: p.x, y: p.y - h });
    flat([up(p01), up(p11), p11, p01], col, 0.74);
    flat([{ x: up(p01).x, y: p01.y - h * 0.3 }, { x: up(p11).x, y: p11.y - h * 0.3 }, p11, p01], col, 0.6); // 暗底帯(3段目)
    flat([up(p10), up(p11), p11, p10], col, 0.55);
    flat([up(p00), up(p10), up(p11), up(p01)], col, fTop || 1, line !== false);
    return { p00, p10, p11, p01, up };
  };
  const R = ROOM;
  // 壁(左右の奥2面=中程度の高さ・視界を塞がない)+天井際の配管/ダクト
  const wallH = 34;
  const A = iso(0, 0), B = iso(R.cols, 0), D = iso(0, R.rows);
  flat([{ x: A.x, y: A.y - wallH }, { x: B.x, y: B.y - wallH }, B, A], C.wall, 0.62);
  flat([{ x: A.x, y: A.y - wallH }, { x: D.x, y: D.y - wallH }, D, A], C.wall, 0.5);
  // 床
  for (let gx = 0; gx < R.cols; gx++) for (let gy = 0; gy < R.rows; gy++) {
    const p0 = iso(gx, gy), p1 = iso(gx + 1, gy), p2 = iso(gx + 1, gy + 1), p3 = iso(gx, gy + 1);
    flat([p0, p1, p2, p3], (gx + gy) % 2 ? C.floorAlt : C.floor, 0.86);
    c.strokeStyle = css(C.floorAlt, 0.72); c.beginPath(); c.moveTo(p3.x + 0.5, p3.y + 0.5); c.lineTo(p2.x + 0.5, p2.y + 0.5); c.stroke();
  }
  // 天井際の配管2本+ジョイント+ダクト(PS1研究所の無骨)
  for (const [wy, col] of [[-wallH + 5, C.metalDk], [-wallH + 10, C.metal]]) {
    c.strokeStyle = css(col, 0.8); c.lineWidth = 2;
    c.beginPath(); c.moveTo(D.x + 1, D.y + wy); c.lineTo(A.x + 1, A.y + wy); c.lineTo(B.x - 1, B.y + wy); c.stroke();
    for (let i = 1; i < 6; i++) { const p = iso(i * 3.6, 0); px(p.x - 1, p.y + wy - 2, 3, 4, C.metalDk, 0.9); }
  }
  box(3, -0.01, 2, 0.01, 14, C.metalDk, 0.7); // 壁のダクト箱
  dither(iso(4, 0).x - 3, iso(4, 0).y - wallH + 12, 6, 5, C.paper, 0.8); // 蒸気
  // 巾木(手前2辺)
  const C2 = iso(R.cols, R.rows);
  flat([B, C2, { x: C2.x, y: C2.y + 4 }, { x: B.x, y: B.y + 4 }], C.wallDk, 0.6);
  flat([D, C2, { x: C2.x, y: C2.y + 4 }, { x: D.x, y: D.y + 4 }], C.wallDk, 0.7);

        px(p.x, p.y, 6, 12, rc("crimson", 1)); px(p.x + 1, p.y, 1, 12, rc("crimson", 3)); px(p.x + 4, p.y, 2, 12, rc("crimson", 0));
        px(p.x + 1, p.y - 2, 3, 2, rc("metal", 2)); px(p.x + 1, p.y - 2, 3, 1, rc("metal", 3));
        c.strokeStyle = rc("crimson", 0); c.strokeRect(p.x + 0.5, p.y + 0.5, 5, 11);
      }
    }
    c.fillStyle = "#c9b8a2"; c.font = "8px system-ui"; c.fillText(label, RX, RY + CUT.rows * T + 12);
  }
  drawCut(18, 60, false, "現行 #a (8bit: ベタ1色+黒輪郭)");
  drawCut(18 + CUT.cols * T + 30, 60, true, "GBA/GBC後期 (色ランプ3-4段+材質+セレクティブ輪郭)");
}
if (mode.proj === "top") renderTop(); else if (mode.proj === "verify") renderVerify(); else renderIso();
// 整数倍ブリット
g.imageSmoothingEnabled = false;
g.fillStyle = "#0d0b09"; g.fillRect(0, 0, cv.width, cv.height);
g.drawImage(off, 0, 0, W0, H0, (cv.width - W0 * K) / 2, (cv.height - H0 * K) / 2, W0 * K, H0 * K);
</script>
