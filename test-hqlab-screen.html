<!-- §5ooo QA: 本部を「特定の惑星から開いた」状態を再現し、スクリーンの映り(背景明度差)を確認する。
     ハッシュ #p2=ネオヴェルデ / #p8=グラキス(既定=#p2)。構図=案ロ(管制室型・一本化済)。
     localStorageは下でサンドボックス化=本セーブに一切触れない。.vercelignoreでdev限定。 -->
<script>
// 本セーブ非接触の保証: 実localStorageを遮断しメモリ実装に差し替え(スクリプト読込より先に実行)
(function () {
  const mem = {};
  const shim = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { for (const k in mem) delete mem[k]; } };
  Object.defineProperty(window, "localStorage", { value: shim, configurable: false });
})();
</script>

<script>
// #now: 同期実行の実時間ベンチ(virtual-timeはperformance.nowを凍結するため、QAページ#nowと同じくパース時に同期計測)
if (location.hash === "#now") {
  Game.newGame();
  UI._labRoomTierOverride = 3;
  UI.openHqLab();
  const t0 = performance.now(); for (let i = 0; i < 120; i++) UI._drawLabScreenVideo(i / 12);
  const vidMs = (performance.now() - t0) / 120;
  const t1 = performance.now(); for (let i = 0; i < 60; i++) UI.renderHqLab();
  const roomMs = (performance.now() - t1) / 60;
  document.title = `SCRFPS video=${vidMs.toFixed(3)}ms/回(${CFG.ctrlFps}fps=${(vidMs * CFG.ctrlFps).toFixed(2)}ms/秒) room=${roomMs.toFixed(2)}ms`;
}
// 指定惑星へ正規手順(selectStage=純血ペア開拓)で移動→固有種を数匹追加→本部を開く(メモリ内・本セーブ非接触)
if (location.hash !== "#now") window.addEventListener("load", () => setTimeout(() => {
  const m = location.hash.match(/^#p(\d+)(b?)$/);
  const planet = m ? parseInt(m[1], 10) : 2;
  Game.newGame();
  Game.state.rank = 999;
  Game.raid = null;
  if (planet !== 1) Game.selectStage(planet);
  const pool = Game.breedablePool();
  for (let i = 0; i < 10; i++) {
    const sp = pool[i % pool.length];
    const lz = Game.makeLizard(sp.id, "normal", { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: ["stripe", "spot", "band", "none"][i % 4], traits: [] }, "adult");
    Game.addLizard(lz, true);
  }
  UI._labRoomTierOverride = 3;
  // QAプローブ: 生中継の実行回数と条件をtitleへ(headlessの--dump-domで読む)
  const orig = UI._drawLabScreenVideo.bind(UI);
  let vidN = 0, startN = 0, rafN = 0;
  const origStart = UI._startLabVideo.bind(UI);
  const origRaf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function (cb) { rafN++; return origRaf(cb); };
  UI._startLabVideo = function () { startN++; origStart(); };
  let vidErr = "-", dstPix = "-";
  UI._drawLabScreenVideo = function (t) {
    vidN++;
    try { orig(t); } catch (e) { vidErr = String(e).slice(0, 60); }
    try { const cv2 = document.getElementById("hqlab-canvas"), r = { x: DOCKW.booth.x, y: DOCKW.booth.y, w: CFG.dockBoothW, h: CFG.dockBoothH }, b = UI._labBlit; // v4: ブース窓(設計座標)
      const d = cv2.getContext("2d").getImageData(Math.round(b.bx + (r.x + r.w / 2) * b.k), Math.round(b.by + (r.y + r.h / 2) * b.k), 2, 2).data;
      dstPix = [d[0], d[1], d[2]].join(","); } catch (e) { dstPix = "err"; }
  };
  setInterval(() => { const src = document.getElementById("game");
    let pix = "-";
    try { const d = src.getContext("2d").getImageData(src.width / 2 - 2, src.height / 2 - 2, 4, 4).data;
      let r = 0, g = 0, b2 = 0, a = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b2 += d[i + 2]; a += d[i + 3]; }
      const n = d.length / 4; pix = [r, g, b2, a].map((v) => Math.round(v / n)).join(","); } catch (e) { pix = "err"; }
    document.title = `start=${startN} vid=${vidN} raf=${rafN} dstPix=${dstPix} err=${vidErr}`; }, 300); // v4: 平均色プローブはv3廃止に伴い撤去(ブース窓=dstPixで判定)
  setTimeout(() => {
    UI.openHqLab();
    UI.update(); // sigを先に確定=撮影直前のrAF復活フレームでupdate()が部屋を再描画して映像を上書きするレースを防ぐ(headless限定の撮影対策)
    // headless(virtual-time)は初回ペイント後にrAFが止まるため、撮影用にsetTimerで生中継を強制駆動(実ブラウザはrAF駆動で不要)
    let k = 0;
    const force = setInterval(() => { UI._drawLabScreenVideo(performance.now() / 1000); if (++k > 20) clearInterval(force); }, 120);
    // 負荷実測(§5ooo報告用): 生中継1回の同期コスト(test-hqlab-qa #nowと同方式)+部屋フル再描画コスト
    setTimeout(() => {
      const t0 = performance.now(); for (let i = 0; i < 120; i++) UI._drawLabScreenVideo(i / 12);
      const vidMs = (performance.now() - t0) / 120;
      const t1 = performance.now(); for (let i = 0; i < 60; i++) UI.renderHqLab();
      const roomMs = (performance.now() - t1) / 60;
      console.log(`[SCRFPS] video=${vidMs.toFixed(3)}ms/回(${CFG.ctrlFps}fps=${(vidMs * CFG.ctrlFps).toFixed(2)}ms/秒) room=${roomMs.toFixed(2)}ms`);
      document.title = `SCRFPS video=${vidMs.toFixed(3)}ms room=${roomMs.toFixed(2)}ms | ` + document.title;
      UI._drawLabScreenVideo(1.3); // ベンチ後に映像を戻す(スクショ用)
    }, 3200);
  }, 700); // 飼育槽を数フレーム回してから開く(スクリーンに実配置が映る)
}, 250));
</script>
