<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>統合テスト(開発用・実UI/実描画経路)</title>
<!-- Phase6 実機3症状の再発防止。node stub では通らない「実UI/実DOM/実Roulette」経路を通す統合テスト。
     使い方: このファイルをブラウザで開く(repoルート基準・相対パス) or headless Chrome で file:// 指定。
     結果は画面 と document.title(PASS n/FAIL m) に出る。本番デプロイには含めない(.vercelignore)。 -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<style>#itest{position:fixed;inset:0;z-index:99999;background:#0d0a06;color:#cde;font:14px monospace;padding:20px;overflow:auto}#itest .ok{color:#7bd986}#itest .ng{color:#ff6a6a}</style>
</head>
<body>
<div id="itest">統合テスト実行中…</div>
<!-- 本体DOM(UI.initが配線する要素。省略なしで index.html 準拠) -->
<header id="topbar"><div id="brand"></div>
  <div class="res"><b id="ui-coins">0</b><small id="ui-cps"></small></div>
  <div class="res"><b id="ui-crickets-top">0</b></div><div class="res"><b id="ui-gems">0</b></div><div class="res"><b id="ui-stones">0</b></div>
  <nav><button id="btn-map"></button><button id="btn-hq"></button><span id="hq-badge"></span><button id="btn-dex"></button><span id="dex-badge"></span>
  <button id="btn-missions"></button><span id="mission-badge"></span><button id="btn-stats"></button><span id="stats-badge"></span><button id="btn-settings"></button></nav>
</header>
<div id="hq-bar"><div id="rank-bar"></div><span id="hq-bar-label"><b id="ui-rank">1</b></span></div>
<main><aside id="left"><div class="card"><button id="btn-cricket"><span id="cricket-lot-lbl"></span></button><button id="btn-fac"></button></div>
  <div id="slit-device"><canvas id="slit-canvas"></canvas></div></aside>
  <section id="center"><div id="frame"><canvas id="game" width="1280" height="720"></canvas>
    <div id="raid-hud"><div class="rh-line"><span id="raid-timer"></span></div><div id="next-boss" class="hidden"></div><button id="btn-raid-now"></button></div>
    <div id="toasts"></div></div><div id="raid-banner" class="hidden"></div><div id="detail" class="hidden"></div></section></main>
<div id="modal" class="hidden"><div id="modal-box"><header><h2 id="modal-title"></h2><button id="modal-close">×</button></header><div id="modal-body"></div></div></div>

<script src="js/data.js"></script><script src="js/game.js"></script><script src="js/render.js"></script>
<script src="js/roulette.js"></script><script src="js/slit.js"></script>
<script src="js/ui/core.js"></script><script src="js/ui/icons.js"></script><script src="js/ui/components.js"></script><script src="js/ui/motion.js"></script>
<script src="js/ui/hero/hero.js"></script><script src="js/ui/hero/nest-reveal.js"></script><script src="js/ui/hero/boss.js"></script>
<script src="js/ui/hero/meteorite.js"></script><script src="js/ui/hero/rocket.js"></script><script src="js/ui/hero/species-reveal.js"></script><script src="js/ui/hero/boss-reward.js"></script>
<script src="js/ui/screens/main.js"></script><script src="js/ui/screens/feeder-skins.js"></script><script src="js/ui/screens/feeder.js"></script>
<script src="js/ui/screens/roulette.js"></script><script src="js/ui/screens/slit.js"></script><script src="js/ui/screens/breeding.js"></script>
<script src="js/ui/screens/equipment.js"></script><script src="js/ui/screens/planet-map.js"></script><script src="js/ui/screens/nest.js"></script>
<script src="js/ui/screens/hq.js"></script><script src="js/ui/screens/dex.js"></script><script src="js/ui/screens/meta.js"></script><script src="js/ui/boot.js"></script>
<script>
window.__err=null; window.addEventListener("error",e=>{window.__err=(window.__err||"")+e.message+" | ";});
(function(){
 var R=[],pass=0,fail=0;
 function ok(n,c,e){ if(c){pass++;R.push('<div class="ok">PASS '+n+'</div>');} else {fail++;R.push('<div class="ng">FAIL '+n+(e?" :: "+e:"")+'</div>');} }
 function killBoss(stage,typeId){
   Game.newGame(); Game.state.rank=200; Game.state.stageSel=stage; Game.state.stageWins=4;
   Game.rollNextRaid(); Game.startRaid();
   if(Game.raid){ if(typeId){Game.raid.typeId=typeId;Game.raid.type=bossTypeById(typeId);} Game.raid.boss=true;
     if(!Game.raid.tier){Game.raid.tier=6;Game.raid.tierDef=BOSS_TIERS[5];} Game.raid.snake.hp=1; Game.raid.snake.arrived=true; }
   for(var i=0;i<200&&Game.raid;i++){ Game.updateRaid(0.1); if(!Game.raid) return true; }
   return !Game.raid;
 }
 function run(){
  try{
   // (0) 症状A: アリド(ID1)でもボス討伐→報酬DOMが出る(実UI)。低tierでも起動
   if(UI.closeBossReward)UI.closeBossReward();
   var aridKilled=killBoss(1,"snake"); // アリド署名=ワーム(snake)
   setTimeout(function(){
    ok("症状A: アリド(ID1)でボス討伐→報酬DOMが出る", !!document.getElementById("boss-reward"));
    if(UI.closeBossReward)UI.closeBossReward();

   // (1) 症状3: 実UI/実Roulette経路で「ボス討伐→報酬ルーレット」がDOM生成・球が用意される
   var killed=killBoss(6,"monitor");
   var brSet=!!Game.bossReward;
   setTimeout(function(){
    var relDom=!!document.getElementById("boss-reward");
    var rem=(typeof Roulette!=="undefined"&&Roulette.rewardRemaining)?Roulette.rewardRemaining():0;
    ok("症状3: ボス討伐でbeginBossReward発火", brSet);
    ok("症状3: 報酬ルーレットDOM(#boss-reward)がせり上がる", relDom);
    ok("症状3: ルーレットに球が用意される(rewardRemaining>0)", rem>0, "rem="+rem);
    ok("症状3: 討伐処理でJSエラーなし", !window.__err, window.__err||"");

    // (2) 症状1: 署名惑星でボスraidが署名描画(planetBossDraw)に載る
    // 【期待値の更新履歴】旧②方式(aadef20: 脅威型一致時のみ署名描画・非署名=null)→ §5ii 署名主役化(7715cbf・Ric承認)で
    // 「署名惑星でboss時は常に署名の姿(汎用の姿ゼロ・pre-R30案B)」へ仕様変更。本テストが旧仕様のまま残りFAILしていた
    // (2026-07-24 Ric検出)。node側(phase6/boss_roster)と同じ現行仕様へ期待値を更新。ID6署名はmonitor→spider(§5ii配役)。
    Game.state.stageSel=6;
    var sigDraw=Render.planetBossDraw({boss:true,typeId:"spider"});
    ok("症状1: ID6の署名脅威型(spider)ボスが署名描画(drawSkullAnaconda)", sigDraw==="drawSkullAnaconda", "="+sigDraw);
    ok("症状1: ID6のsnakeボス(非署名脅威型)でも署名の姿(§5ii=汎用の姿ゼロ)", Render.planetBossDraw({boss:true,typeId:"snake"})==="drawSkullAnaconda");
    // 【更新2・2026-08-01 案C(Ric裁定)】通常襲来も署名の姿(その惑星の主の「幼体」)へ。旧アサート
    //   「非bossはnull(署名は出ない)」は、Phase6の議題外だった仮定をCC自身が固定していたもの(§5x-MINION)。
    //   ★このページは同種の期待値ズレを2度起こしている(2026-07-24 / 今回)。仕様変更時はnode側だけでなく
    //     ここも同一コミットで追随させること(§5x-OPS ⑫)。
    ok("症状1: 非boss(通常襲来)も署名の姿=幼体(汎用の姿ゼロ)", Render.planetBossDraw({boss:false,typeId:"spider"})==="drawSkullAnaconda");
    ok("症状1: 非boss(通常襲来)の名前も惑星固有(幼体ドクロ・アナコンダ)", Game.bossDisplayName({boss:false,typeId:"spider"})===PLANET_BOSS[6].minion);

    // (3) 症状2: buildPioneer(開拓UI)に引き連れ選択が存在しない・開拓ボタンのみ
    var div=document.createElement("div");
    UI.buildPioneer(div, 6);
    var html=div.innerHTML;
    ok("症状2: 開拓UIに引き連れ文言なし(創始者の卵)", html.indexOf("創始者の卵")<0);
    ok("症状2: 開拓UIに個体選択グリッドなし(founder-list)", html.indexOf("founder-list")<0);
    ok("症状2: 開拓ボタンは存在(開拓する)", html.indexOf("開拓する")>=0);

    // (4) V6-P2-2 B3で検出した実在バグの再発防止(本番hotfix 3263d3f・§5x-OPS ⑮実績):
    //   汎用 [data-tip]{position:relative} が同特異度の後勝ちで .wnode の absolute を奪い、
    //   81ノード中79が画面外へ飛散していた(dim表示で潜伏)。position と実座標の両方を固定する。
    //   ※このページに #nestpage は無いため、openNest はモーダルフォールバック(退路)経路を通る=退路の生存検査も兼ねる。
    UI.openNest();
    if(UI._nestLayout)UI._nestLayout();
    var wnsAll=[].slice.call(document.querySelectorAll(".wnode"));
    // 中心ノードはB1で意図的に display:none(canvasの巣が正)=検査対象は可視ノードのみ
    var wns=wnsAll.filter(function(e){return e.offsetParent!==null;});
    ok("巣: ノード21個が生成される(可視20+中心=canvas・P2-3ロスター統合)", wnsAll.length===21&&wns.length===20, "all="+wnsAll.length+" vis="+wns.length);
    ok("巣: computed positionがabsolute(汎用セレクタに奪われていない)",
      wns.length>10&&getComputedStyle(wns[10]).position==="absolute", wns.length>10?getComputedStyle(wns[10]).position:"-");
    var mis=wns.filter(function(e){return Math.abs(e.offsetLeft-parseFloat(e.style.left))>2||Math.abs(e.offsetTop-parseFloat(e.style.top))>2;}).length;
    ok("巣: 全可視ノードが指定座標に配置(乖離>2pxゼロ)", mis===0, "misplaced="+mis);
    var stEl=document.getElementById("nest-stage"), stR=stEl&&stEl.getBoundingClientRect(), outside=-1;
    if(stR){ outside=wns.filter(function(e){var r=e.getBoundingClientRect();return r.top>stR.bottom+2||r.left>stR.right+2||r.bottom<stR.top-2||r.right<stR.left-2;}).length; }
    ok("巣: ステージ外に飛散したノードがない", outside===0, "outside="+outside);

    // (5) V6-P2-2 B4: 右パネルは実データ駆動(モック見本値の混入=捏造を検知)
    var bigEl=document.querySelector("#nest-side .np-big"), cnt=Game.nestWebCounts();
    ok("巣B4: 大表示=解放ノード数(実データ)", !!bigEl&&parseInt(bigEl.textContent,10)===cnt.open, bigEl?bigEl.textContent:"-");
    var oreRows=document.querySelectorAll("#nest-side .np-ore");
    ok("巣B4: レア資源6行(裁定の写像=6鉱石全表示)", oreRows.length===6, "rows="+oreRows.length);
    var oreOk=oreRows.length===6;
    ORES.forEach(function(o,idx){ var b=oreRows[idx]&&oreRows[idx].querySelector("b"); var v=(Game.state.rare&&Game.state.rare[o.id])||0; if(!b||parseInt(b.textContent,10)!==v)oreOk=false; });
    ok("巣B4: 鉱石数値=rareWallet実値と一致", oreOk);
    var fxb=document.getElementById("nest-fx-btn"); if(fxb)fxb.click();
    ok("巣B4: 効果一覧→モーダルが開く", !!fxb&&document.getElementById("modal-title").textContent.indexOf("巣の効果一覧")>=0);
    if(UI.closeModal)UI.closeModal();

    document.getElementById("itest").innerHTML="<b>統合テスト: "+pass+" PASS / "+fail+" FAIL</b><br>"+R.join("");
    document.title=(fail?"FAIL":"PASS")+" "+pass+"/"+(pass+fail);
   },2600);
   },2000); // 外側(症状Aアリド報酬)のsetTimeoutを閉じる
  }catch(e){ document.getElementById("itest").innerHTML="ERR: "+e.message; document.title="ERR:"+e.message; }
 }
 window.addEventListener("load",function(){ setTimeout(run,700); });
})();
</script>
</body>
</html>
