<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>R5-b B4カット — コンテンギ/ホウカン/リンカイ(開発用・Ric判定前)</title>
<!-- R5-b B4(最終): 現意匠と刷新の並置比較(3種×両固有種)+血統列3本(全て合成)+遠目実寸(リンカイ=最上位の格の検分)。
     旧意匠=git記録(b3cf29f時点)の各trait関数を本ページ内に複製し関数スワップで同一フレーム描画。
     localStorageサンドボックス=本セーブ非接触。.vercelignoreでdev限定。ローカルのみ・デプロイなし。 -->
<script>
(function () {
  const mem = {};
  const shim = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { for (const k in mem) delete mem[k]; } };
  Object.defineProperty(window, "localStorage", { value: shim, configurable: false });
})();
</script>
<style>
  body { background: #221a12; margin: 0; color: #e8dccb; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 10px 16px 0; margin: 0; font-weight: 600; }
  p.note { font-size: 12px; padding: 2px 16px 8px; margin: 0; color: #c9b8a2; }
  canvas { display: block; }
</style>
</head>
<body>
<h1>B4カット — 各ブロック: 上段=現意匠 / 下段=刷新・左=カナヘビ/右=ニホントカゲ</h1>
<p class="note">最終バッチ・全て合成=深紅の芯線維持。動き=コンテンギ(天球を巡る星)とリンカイ(臨界点の呼吸)のみ・ホウカンは完全静止。</p>
<canvas id="game" width="10" height="10" style="display:none"></canvas>
<canvas id="cmp" width="900" height="840"></canvas>
<h1>血統列1 — クロノ+アミダグラ→コンテンギ(歯車の輪+あみだの路と灯→天球)</h1>
<canvas id="blood1" width="900" height="260"></canvas>
<h1>血統列2 — オウゴンヅカ+トライアド→ホウカン(玄室の金+原初紋→宝冠)</h1>
<canvas id="blood2" width="900" height="260"></canvas>
<h1>血統列3 — ヴォイド(維持)+チェレンコ→リンカイ(黒+臨界光の極点=B3の伏線回収)</h1>
<canvas id="blood3" width="900" height="260"></canvas>
<h1>遠目 — 飼育槽実寸(B4保持3匹・リンカイ=最上位として群れで最も目を引くかの検分)</h1>
<canvas id="far" width="900" height="330"></canvas>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script>
globalThis.UI = { toast: () => {} };
Game.newGame(); Game.state.lizards = [];
Render.init(); Render.time = 1.3;

// ---- 旧意匠(git記録 b3cf29f時点・比較用に複製) ----
function oldKontengi(ctx, g, def) {
  const { S, L } = g; if (!S) return;
  const c = def.rim || "#D4AF5E";
  ctx.save(); ctx.lineCap = "round";
  const rings = [[0.56, -0.5], [0.66, -0.35]];
  for (const [t, rot] of rings) {
    const s = S(t);
    const cx = s.p.x, cy = s.p.y + s.w * 0.02;
    ctx.strokeStyle = c; ctx.globalAlpha = 0.9; ctx.lineWidth = Math.max(1, L * 0.010);
    ctx.beginPath(); ctx.ellipse(cx, cy, L * 0.055, s.w * 1.32, rot, 0, 7); ctx.stroke();
    ctx.fillStyle = "#fdf6e3";
    const sx = cx + Math.cos(rot + 1.1) * L * 0.05, sy = cy - s.w * 1.22;
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, L * 0.011), 0, 7); ctx.fill();
  }
  const s0 = S(rings[0][0]);
  ctx.strokeStyle = "#8E1826"; ctx.globalAlpha = 0.85; ctx.lineWidth = Math.max(0.9, L * 0.008);
  ctx.beginPath(); ctx.ellipse(s0.p.x, s0.p.y + s0.w * 0.02, L * 0.055, s0.w * 1.32, rings[0][1], Math.PI * 0.35, Math.PI * 0.62); ctx.stroke();
  ctx.restore();
}
function oldHoukan(ctx, g, def) {
  const { ex, ey, eyeR } = g;
  const gold = def.rim || "#E4BC3A";
  ctx.save();
  ctx.strokeStyle = "rgba(18,10,4,.55)"; ctx.lineWidth = Math.max(1.2, eyeR * 0.5);
  ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.6, 0, 7); ctx.stroke();
  ctx.strokeStyle = gold; ctx.lineWidth = Math.max(0.9, eyeR * 0.32);
  ctx.beginPath(); ctx.arc(ex, ey, eyeR * 1.6, 0, 7); ctx.stroke();
  const bx = ex - eyeR * 0.4, by = ey - eyeR * 2.7, w = eyeR * 3.0, hMid = eyeR * 2.1, hSide = eyeR * 1.3;
  ctx.fillStyle = gold; ctx.strokeStyle = "rgba(18,10,4,.6)"; ctx.lineWidth = Math.max(0.8, eyeR * 0.16);
  ctx.beginPath();
  ctx.moveTo(bx - w / 2, by);
  ctx.lineTo(bx - w / 2, by - hSide); ctx.lineTo(bx - w / 6, by - hSide * 0.55);
  ctx.lineTo(bx, by - hMid); ctx.lineTo(bx + w / 6, by - hSide * 0.55);
  ctx.lineTo(bx + w / 2, by - hSide); ctx.lineTo(bx + w / 2, by);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fdf3d0";
  for (const dx of [-w / 3, 0, w / 3]) { ctx.beginPath(); ctx.arc(bx + dx, by - eyeR * 0.42, eyeR * 0.22, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#8E1826"; ctx.globalAlpha = 0.85; ctx.lineWidth = Math.max(0.7, eyeR * 0.16);
  ctx.beginPath(); ctx.moveTo(bx - w / 2 + eyeR * 0.2, by - eyeR * 0.12); ctx.lineTo(bx + w / 2 - eyeR * 0.2, by - eyeR * 0.12); ctx.stroke();
  ctx.restore();
}
function oldRinkai(ctx, g, def) {
  const { S, body, L } = g; if (!body) return;
  const c = def.rim || "#8FE8CC";
  ctx.save(); ctx.clip(body);
  ctx.globalAlpha = 0.58; ctx.fillStyle = "#070103"; ctx.fill(body);
  if (S) {
    const s = S(0.6), px = s.p.x, py = s.p.y + s.w * 0.05;
    const gl = ctx.createRadialGradient(px, py, 1, px, py, L * 0.06);
    gl.addColorStop(0, "rgba(143,232,204,.85)"); gl.addColorStop(1, "rgba(143,232,204,0)");
    ctx.globalAlpha = 1; ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(px, py, L * 0.06, 0, 7); ctx.fill();
    ctx.fillStyle = "#eafff6"; ctx.beginPath(); ctx.arc(px, py, Math.max(1, L * 0.012), 0, 7); ctx.fill();
    ctx.strokeStyle = "#8E1826"; ctx.globalAlpha = 0.9; ctx.lineWidth = Math.max(0.8, L * 0.007);
    ctx.beginPath(); ctx.arc(px, py, L * 0.028, Math.PI * 0.2, Math.PI * 1.1); ctx.stroke();
  }
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = c; ctx.shadowColor = c; ctx.shadowBlur = Math.max(6, L * 0.07);
  ctx.globalAlpha = 0.85; ctx.lineWidth = Math.max(1.2, L * 0.013);
  ctx.stroke(body);
  ctx.globalAlpha = 0.35; ctx.lineWidth = Math.max(2.4, L * 0.028);
  ctx.stroke(body);
  ctx.restore();
}
const OLD = { kontengi: oldKontengi, houkan: oldHoukan, rinkai: oldRinkai };
const FN = { kontengi: "traitKontengi", houkan: "traitHoukan", rinkai: "traitRinkai" };
const NEW = {}; for (const k in FN) NEW[k] = Render[FN[k]];

const spA = SPECIES.find((s) => s.id === "kanahebi"), spB = SPECIES.find((s) => s.id === "nihontokage");
function mk(sp, key) {
  return Game.makeLizard(sp.id, "normal", { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: "stripe", traits: [{ key }] }, "adult");
}
function drawAt(ctx, lz, x, y, scale) {
  lz.x = x / scale; lz.y = y / scale; lz.tx = lz.x; lz.ty = lz.y; lz.angle = 0.12; lz.moving = false;
  ctx.save(); ctx.scale(scale, scale);
  Render.drawLizard(ctx, lz, true);
  ctx.restore();
}
function clearCache() { Render._lizCache && Render._lizCache.clear && Render._lizCache.clear(); }

// ---- 近目並置(1.8倍・3種×現/刷新×両種) ----
const c1 = document.getElementById("cmp").getContext("2d");
c1.fillStyle = "#2c2118"; c1.fillRect(0, 0, 900, 840);
const NAMES = { kontengi: "コンテンギ(天球)", houkan: "ホウカン(宝冠)", rinkai: "リンカイ(最上位・臨界)" };
["kontengi", "houkan", "rinkai"].forEach((key, bi) => {
  const y0 = bi * 280;
  c1.font = "13px system-ui"; c1.fillStyle = "#e4bc3a";
  c1.fillText(NAMES[key], 20, y0 + 20);
  c1.fillStyle = "#c9b8a2";
  c1.fillText("現", 20, y0 + 80); c1.fillText("新", 20, y0 + 210);
  Render[FN[key]] = OLD[key]; clearCache();
  drawAt(c1, mk(spA, key), 250, y0 + 90, 1.8); drawAt(c1, mk(spB, key), 670, y0 + 90, 1.8);
  Render[FN[key]] = NEW[key]; clearCache();
  drawAt(c1, mk(spA, key), 250, y0 + 220, 1.8); drawAt(c1, mk(spB, key), 670, y0 + 220, 1.8);
});

// ---- 血統列(1.8倍・全て新意匠同士) ----
function bloodRow(id, keys, labels) {
  const c = document.getElementById(id).getContext("2d");
  c.fillStyle = "#241c26"; c.fillRect(0, 0, 900, 260);
  c.font = "13px system-ui"; c.fillStyle = "#c9b8a2";
  labels.forEach((lb, i) => c.fillText(lb, [40, 330, 630][i], 30));
  c.fillText("+", 320, 150); c.fillText("→", 610, 150);
  keys.forEach((k, i) => drawAt(c, mk(spA, k), [170, 460, 760][i], 150, 1.8));
}
bloodRow("blood1", ["chrono", "amidagura", "kontengi"], ["クロノ(素材=歯車と針)", "アミダグラ(素材=路と灯)", "コンテンギ(合成=歯車の環+渡し+巡る星)"]);
bloodRow("blood2", ["ougon", "triad", "houkan"], ["オウゴンヅカ(素材=玄室の金箔)", "トライアド(素材=原初の菱形紋)", "ホウカン(合成=箔の冠+原初紋の宝石)"]);
bloodRow("blood3", ["void", "cherenko", "rinkai"], ["ヴォイド(維持=黒ヴェール)", "チェレンコ(素材=縁光2層+光条)", "リンカイ(合成=黒の奥の臨界点・極点)"]);

// ---- 遠目(実寸1.0×・通常個体の群れ+B4保持3匹) ----
const c2 = document.getElementById("far").getContext("2d");
c2.fillStyle = "#b39869"; c2.fillRect(0, 0, 900, 330);
const spots = [[110, 80], [260, 200], [420, 90], [700, 70], [820, 210], [180, 265], [560, 280], [760, 160]];
spots.forEach(([x, y], i) => {
  const sp = i % 2 ? spA : spB;
  const lz = Game.makeLizard(sp.id, "normal", { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: ["stripe", "spot", "none"][i % 3], traits: [] }, "adult");
  drawAt(c2, lz, x, y, 1.0);
});
[["kontengi", 320, 160], ["houkan", 540, 130], ["rinkai", 480, 235]].forEach(([key, x, y], i) => {
  drawAt(c2, mk(i % 2 ? spB : spA, key), x, y, 1.0);
  c2.strokeStyle = "#e4bc3a"; c2.globalAlpha = .5; c2.strokeRect(x - 52, y - 30, 104, 62); c2.globalAlpha = 1;
  c2.font = "11px system-ui"; c2.fillStyle = "#e4bc3a"; c2.fillText(NAMES[key].split("(")[0], x - 50, y - 36);
});
</script>
</body>
</html>
