<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>特性カタログ — 全特性の獲得情報(開発用・TRAITSデータ駆動)</title>
<!-- 再監査アーク③(2026-07-24)発・V6-P2改訂(2026-08-10):
     1行=1特性: 両固有種(惑星1 カナヘビ/ニホントカゲ)で実レンダ+獲得情報+出自バッジ。
     ★V6-P1-2で合成撤廃につき、血統6レシピ節と RECIPES 参照を撤去(旧版は RECIPES 例外で
     全行が描画されない状態だった=撤廃の追随漏れ・§5x-OPS ⑫。意匠の血統の設計資料は trait_system §8.4)。
     行数・高さは TRAITS データ駆動=特性追加のたび自動で増える(22種時点で検分済)。
     localStorageは下でサンドボックス化=本セーブに一切触れない。.vercelignoreでdev限定。
     明滅・脈動する特性(shizu/neon/shinkai/yougan/chrono/amida/kontengi/rinkai)は本ページでは固定フレーム(time=1.3)。 -->
<script>
// 本セーブ非接触の保証: 実localStorageを遮断しメモリ実装に差し替え(スクリプト読込より先に実行)
(function () {
  const mem = {};
  const shim = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { for (const k in mem) delete mem[k]; } };
  Object.defineProperty(window, "localStorage", { value: shim, configurable: false });
})();
</script>
<style>
  body { background: #4a352f; margin: 0; color: #e8dccb; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 10px 16px 0; margin: 0; font-weight: 600; }
  p.note { font-size: 12px; padding: 2px 16px 8px; margin: 0; color: #c9b8a2; }
  canvas { display: block; }
</style>
</head>
<body>
<h1>特性カタログ — 全特性の獲得情報+両固有種の実レンダ(TRAITSデータ駆動)</h1>
<p class="note">左=惑星1の両固有種(ニホンカナヘビ/ニホントカゲ)。バッジ: 創世可=賢者の石の乱択創世(全種) / tier6(希少枠)=旧・合成専用の重み極小プール / 出自=R5-b刷新・維持・V6-P2新規。</p>
<canvas id="game" width="860" height="2620"></canvas>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script>
// メモリ上だけで動作しセーブに触れない開発用ページ。TRAITSが単一の真実(追加のたび行が増える)。
globalThis.UI = { toast: () => {} };
Game.newGame(); Game.state.lizards = [];
Render.init(); Render.time = 1.3;
const ctx = Render.ctx;
const spA = SPECIES.find((s) => s.id === "kanahebi"), spB = SPECIES.find((s) => s.id === "nihontokage");
const draw1 = (species, c, x, y, traits) => {
  const lz = Game.makeLizard(species.id, "normal", { hue: species.hue, sat: species.sat, light: species.light, pattern: "stripe", traits }, "adult");
  lz.x = x; lz.y = y; lz.tx = x; lz.ty = y; lz.angle = 0.12; lz.moving = false;
  Render.drawLizard(c, lz, true);
};
const badge = (c, x, y, text, bg, fg) => {
  c.font = "11px system-ui";
  const w = c.measureText(text).width + 12;
  c.fillStyle = bg; c.beginPath(); c.roundRect(x, y - 11, w, 16, 8); c.fill();
  c.fillStyle = fg; c.fillText(text, x + 6, y + 1);
  return x + w + 6;
};
const KEEP = ["mimikakushi", "hakushi", "void"];                       // R5-b維持3種
const P2NEW = ["dokushirushi", "hoshiwatari", "kokemushiro", "suami"]; // V6-P2新規4種
const keys = Object.keys(TRAITS);
const cv = document.getElementById("game");
cv.height = 120 + keys.length * 112 + 20; // データ駆動=行数に追随
ctx.fillStyle = "#5c4238"; ctx.fillRect(0, 0, 860, cv.height);
keys.forEach((key, r) => {
  const d = TRAITS[key], y = 120 + r * 112, tr = [{ key }];
  draw1(spA, ctx, 500, y, tr);
  draw1(spB, ctx, 720, y, tr);
  ctx.fillStyle = d.rim || "#f0d9a8"; ctx.font = "13px system-ui"; ctx.fillText("●", 16, y - 14);
  ctx.fillStyle = "#f0d9a8"; ctx.fillText(d.name, 34, y - 14);
  let bx = 16;
  bx = badge(ctx, bx, y + 6, "創世可", "#24381f", "#a8e08a");
  if (d.tier >= 6) bx = badge(ctx, bx, y + 6, "tier6(希少枠)", "#3d2431", "#e8a0c8");
  if (KEEP.includes(key)) bx = badge(ctx, bx, y + 6, "維持", "#2e2c26", "#b9b4a8");
  else if (P2NEW.includes(key)) bx = badge(ctx, bx, y + 6, "V6-P2新規", "#1f3830", "#8ae0c0");
  else bx = badge(ctx, bx, y + 6, "R5-b刷新", "#3a1c20", "#e08a8a");
  ctx.fillStyle = "#c9b8a2"; ctx.font = "11px system-ui"; ctx.fillText(d.desc || "", 16, y + 26);
});
document.title = "trait-catalog done (" + keys.length + ")";
</script>
</body>
</html>
