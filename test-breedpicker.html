<!-- 実UI/実DOMで繁殖ピッカーを開き、4パターン(2枚持ち+固定印/1枚/なし/レジェンダリー)を1画面で確認する。
     localStorageは下でサンドボックス化=本セーブに一切触れない(読みも書きもメモリ内のみ)。.vercelignoreでdev限定。 -->
<script>
// 本セーブ非接触の保証: 実localStorageを遮断しメモリ実装に差し替え(スクリプト読込より先に実行)
(function () {
  const mem = {};
  const shim = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { for (const k in mem) delete mem[k]; } };
  Object.defineProperty(window, "localStorage", { value: shim, configurable: false });
})();
</script>

<script>
// モック個体を構成(メモリ内newGame=サンドボックスlocalStorage。本セーブは遮断済みで読まれも書かれもしない)
window.addEventListener("load", () => setTimeout(() => {
  Game.newGame();
  Game.state.coins = 999999;
  const mk = (name, morph, traits, fixed) => {
    const sp = SPECIES.find((s) => s.id === "kanahebi");
    const lz = Game.makeLizard(sp.id, morph, { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: "stripe", traits }, "adult");
    lz.injuredT = 0; lz.breedCd = 0; lz._mockName = name;
    if (fixed) lz.fixedTraits = fixed;
    Game.addLizard(lz, true);
    return lz;
  };
  const host = Game.state.lizards[0]; host.injuredT = 0; host.breedCd = 0; // 相手選択の主
  Game.state.lizards = [host]; // 候補を4パターンだけに固定(スクショの走査性)
  mk("①2枚持ち+固定", "normal", [{ key: "mimikakushi" }, { key: "hagane" }], ["mimikakushi"]); // 固定印+合成専用特性
  mk("②1枚(固定なし)", "normal", [{ key: "shinkai" }]);
  mk("③特性なし", "normal", []);
  mk("④レジェンダリー", "legendary", []);
  UI.openBreedPicker(host);
}, 250));
</script>
