<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>QA実行中…</title>
<!-- 本部C-2 重点QA(実UI/実DOM)。①ページ往復でcanvasが壊れない ②本部滞在中もゲームが進む ③12機能 ④合成UI。
     headless: window-sizeを変えて実行し title(PASS n/FAIL m) を読む。.vercelignoreでdev限定。 -->

<body>

<!-- 本体DOM(index.html準拠・#hqlab含む) -->
<header id="topbar"><div id="brand"></div>
  <div class="res"><b id="ui-coins">0</b><small id="ui-cps"></small></div>

  <nav><button id="btn-map"></button><button id="btn-hq"></button><span id="hq-badge"></span><button id="btn-dex"></button><span id="dex-badge"></span>

<main><aside id="left"><div class="card"><button id="btn-cricket"><span id="cricket-lot-lbl"></span></button><button id="btn-fac"></button><button id="btn-breed-menu"></button></div>

    <div id="raid-hud"><div class="rh-line"><span id="raid-timer"></span></div><div id="next-boss" class="hidden"></div><button id="btn-raid-now"></button></div>

<script src="js/data.js"></script><script src="js/game.js"></script><script src="js/render.js"></script>

<script src="js/ui/hero/meteorite.js"></script><script src="js/ui/hero/rocket.js"></script><script src="js/ui/hero/species-reveal.js"></script><script src="js/ui/hero/boss-reward.js"></script>

<script src="js/ui/screens/equipment.js"></script><script src="js/ui/screens/planet-map.js"></script><script src="js/ui/screens/nest.js"></script>
<script src="js/ui/screens/hq.js"></script><script src="js/ui/screens/hqlab.js"></script><script src="js/ui/screens/dex.js"></script><script src="js/ui/screens/meta.js"></script><script src="js/ui/boot.js"></script>
<script>
window.__err = null; window.addEventListener("error", (e) => { window.__err = (window.__err || "") + e.message + " | "; });
(function () {
  var R = [], pass = 0, fail = 0;
  function ok(n, c, e) { if (c) { pass++; R.push('<div class="ok">PASS ' + n + '</div>'); } else { fail++; R.push('<div class="ng">FAIL ' + n + (e ? " :: " + e : "") + '</div>'); } }
  function rectOf(el) { var r = el.getBoundingClientRect(); return { w: Math.round(r.width * 10) / 10, h: Math.round(r.height * 10) / 10, x: Math.round(r.left * 10) / 10, y: Math.round(r.top * 10) / 10 }; }
  function run() {
    try {
      var game = document.getElementById("game");
      // ===== 重点QA①: ページ往復でcanvasが壊れない =====
      var before = rectOf(game), attrsBefore = game.width + "x" + game.height;
      // 初回ロード直後に本部を開く(過去地雷: 0サイズ初期化)
      UI.openHqLab();
      var labCv = document.getElementById("hqlab-canvas"), labRect = rectOf(labCv);
      ok("QA1: 初回ロード直後に本部が開く(labキャンバス実寸>0)", labRect.w > 300 && labRect.h > 200, JSON.stringify(labRect));
      ok("QA1: 本部が1画面固定(labがviewport内=あふれ0)", labRect.w <= innerWidth && (labRect.y + labRect.h) <= innerHeight + 1, JSON.stringify(labRect) + " vp=" + innerWidth + "x" + innerHeight);
      for (var i = 0; i < 3; i++) { UI.closeHqLab(); UI.openHqLab(); } // 往復×3
      UI.closeHqLab();
      var after = rectOf(game), attrsAfter = game.width + "x" + game.height;
      ok("QA1: 往復後 #game の実寸が同一(過去地雷: 300px潰れ)", before.w === after.w && before.h === after.h && before.x === after.x && before.y === after.y, JSON.stringify(before) + " → " + JSON.stringify(after));
      ok("QA1: 往復後 #game のcanvas属性が同一", attrsBefore === attrsAfter, attrsBefore + " → " + attrsAfter);
      // クリック判定: 実クリックで個体選択→往復→同座標で再選択できる
      Game.newGame();
      var lz = Game.state.lizards[0];
      Game.state.lizards = [lz]; // 決定論化: 2匹目(位置ランダム)が判定圏へ迷い込むflakeを排除(fable3: 不安定テスト=非決定性の隔離)
      lz.x = 640; lz.y = 360; lz.tx = 640; lz.ty = 360; Game.ensureRuntime(lz);
      Render.draw();
      var r0 = game.getBoundingClientRect();
      var cx = r0.left + lz.x * r0.width / game.width, cy = r0.top + lz.y * r0.height / game.height;
      function clickAt(x, y) { game.dispatchEvent(new PointerEvent("pointerdown", { clientX: x, clientY: y, bubbles: true })); } // 実配線=pointerdown(core.js)
      Game.selectedId = null; clickAt(cx, cy);
      var sel1 = Game.selectedId === lz.id;
      UI.openHqLab(); UI.closeHqLab();
      Game.selectedId = null; Render.draw(); clickAt(cx, cy);
      ok("QA1: クリック判定が往復後もズレない(同座標で同個体を選択)", sel1 && Game.selectedId === lz.id, "sel1=" + sel1 + " sel2=" + (Game.selectedId === lz.id));

      // ===== 重点QA②: 本部滞在中もゲームが進む =====
      Game.newGame();
      Game.state.crickets = 0; // 自動給餌のGold消費を避け生産を純観測
      var inc = Game.totalIncomePerSec();
      Game.state.eggs.push({ speciesId: "kanahebi", morphId: "normal", hue: 100, sat: 50, light: 50, pattern: "stripe", t: 300, total: 300 });
      Game.state.raidTimer = 500;
      var coins0 = Game.state.coins, egg0 = Game.state.eggs[0].t, raid0 = Game.state.raidTimer, slit0 = (typeof Slit !== "undefined" && Slit._cd != null) ? 1 : 0;
      UI.openHqLab();
      for (var s = 0; s < 60; s++) { Game.tick(1); if (typeof Slit !== "undefined") Slit.advance(1); if (typeof Roulette !== "undefined") Roulette.advance(1); }
      ok("QA2: 本部滞在60秒でGoldが生産どおり増える", Game.state.coins > coins0 + inc * 50, "Δ=" + (Game.state.coins - coins0).toFixed(1) + " 期待≈" + (inc * 60).toFixed(1));
      ok("QA2: 卵の孵化が進む(t-60)", Math.abs((egg0 - Game.state.eggs[0].t) - 60) < 1.5, "Δ=" + (egg0 - Game.state.eggs[0].t).toFixed(1));
      ok("QA2: 襲撃タイマーが進む", Game.state.raidTimer < raid0 - 50, "Δ=" + (raid0 - Game.state.raidTimer).toFixed(1));
      UI.update();
      ok("QA2: 滞在中も本部表示が更新される(#hqlab-lvにHQ Lv)", /HQ Lv/.test(document.getElementById("hqlab-lv").textContent));
      UI.closeHqLab(); Render.draw();
      ok("QA2: 戻った直後にRender.drawがエラーなく走る(表示同期)", true);

      // ===== 12機能(パネル移設・経済直結の実操作) =====
      Game.newGame(); Game.state.coins = 10000000; Game.addRes("bio", 5000); Game.state.stones = 50;
      UI.openHqLab();
      UI.openLabPanel("desks");
      var body = document.getElementById("modal-body");
      ok("機能: デスク群パネル(投資/変換/開発/侵食/研究)", body.querySelector("#lab-invest") && body.querySelector("#cv-food") && body.querySelector("#hq-dev") && body.querySelector("#hq-invasion") && body.querySelector("#research-list").children.length > 5);
      var food0 = Game.res("food"), c0 = Game.state.coins;
      body.querySelector("#cv-food").click(); body = document.getElementById("modal-body");
      ok("機能: Gold変換(実クリック)=食料+・Gold-", Game.res("food") === food0 + CFG.convertBatch && Game.state.coins < c0);
      var dev0 = Game.state.devLv || 0; c0 = Game.state.coins;
      body.querySelector("#hq-dev").click(); body = document.getElementById("modal-body");
      ok("機能: 惑星開発(実クリック)=devLv+1・Gold-", (Game.state.devLv || 0) === dev0 + 1 && Game.state.coins < c0);
      // 研究購入(recipe1を実クリック)
      var rows = body.querySelectorAll("#research-list .list-row"), bought = false;
      for (var ri = 0; ri < rows.length; ri++) { if (/レシピ解読 I</.test(rows[ri].innerHTML.replace("解読 I", "解読 I<"))) {} }
      Game.addRes("science", 500); UI.closeModal(); UI.openLabPanel("desks"); body = document.getElementById("modal-body");
      // V6-P1-2: レシピ解読は撤廃。研究一覧に残っていないことを検査する(叩かない)
      ok("撤廃: 研究一覧にレシピ解読が無い", body.textContent.indexOf("レシピ解読") < 0);
      ok("撤廃: RESEARCH定義にrecipeが無い", !RESEARCH.some(function (r) { return /^recipe[1-6]$/.test(r.id); }));
      UI.closeModal();
      UI.openLabPanel("tank"); body = document.getElementById("modal-body");
      ok("機能: 水槽パネル(遺伝子ラボ3/鍛造・合成は撤廃)", !body.querySelector("#synth-list") && body.querySelector("#hq-gene") && body.querySelector("#hq-forge").children.length > 3);
      ok("撤廃: 水槽に合成の痕跡が無い(レシピ名/未解読の?)", body.textContent.indexOf("シズミマチ") < 0 && body.textContent.indexOf("? ? ?") < 0);
      UI.closeModal();
      UI.openLabPanel("rocket"); body = document.getElementById("modal-body");
      ok("機能: 宇宙港パネル(建造)", /段階|完成/.test(body.textContent) && (body.querySelector("#hq-rocket") || /完成/.test(body.textContent)));
      UI.closeModal();
      UI.openLabPanel("shelf"); body = document.getElementById("modal-body");
      ok("機能: 標本棚パネル(Lore/鉱石アイコン列)", body.querySelector("#hq-lore") && body.querySelectorAll("svg.icon").length >= 6);
      UI.closeModal();
      // 設備投資(labInvest・案B): 鉱石を投じるとtierが育つ+後方互換
      Game.addOre("titaniumOre", 5); Game.addOre("amber", 5);
      var inv0 = Game.labInvestLv("desks"), tOre0 = Game.ore("titaniumOre");
      UI.closeModal(); UI.openLabPanel("desks"); body = document.getElementById("modal-body");
      var invBtn = body.querySelector("#lab-invest-btn");
      if (invBtn) invBtn.click();
      ok("投資: 鉱石を投じるとlabInvest+1・鉱石消費・tier連動", Game.labInvestLv("desks") === inv0 + 1 && Game.ore("titaniumOre") === tOre0 - 2 && UI.labTiers().desks === 1 + Game.labInvestLv("desks"), "inv=" + Game.labInvestLv("desks"));
      UI.closeModal();
      // 新着ドット: openHqLabで消える
      Game._badgeHq = true; UI.openHqLab();
      ok("機能: 新着ドットは本部を開くと消える", Game._badgeHq === false);

      // ===== R1: 繁殖ピッカーv2(実操作: タイル→A/B→切替→クイック→確定=Game.breed同一経路) =====
      Game.newGame(); Game.state.coins = 100000; Game.raid = null;
      Game.state.lizards = [];
      (function () {
        var sp = SPECIES.find(function (x) { return x.id === "kanahebi"; }), sp2 = SPECIES.find(function (x) { return x.id === "nihontokage"; });
        function mk(spec, morph, trs) {
          var lz = Game.makeLizard(spec.id, morph, { hue: spec.hue, sat: spec.sat, light: spec.light, pattern: "stripe", traits: (trs || []).map(function (k) { return { key: k }; }) }, "adult");
          lz.injuredT = 0; lz.breedCd = 0; Game.addLizard(lz, true); return lz;
        }
        mk(sp, "normal", ["mimikakushi"]); mk(sp, "normal", []); mk(sp, "albino", ["shinkai"]); mk(sp2, "normal", []);
      })();
      document.getElementById("btn-breed-menu").click();
      ok("R1: 左メニュー繁殖クリックでピッカーv2が開く", !!document.querySelector("#modal-body .sp-tiles"));
      var t1 = document.querySelector('.sp-tile[data-tile="kanahebi:normal"]');
      t1.click();
      ok("R1: タイル選択でAスロットに個体(チップ領域つき)", !!UI._bmState.a && !!document.querySelector("#modal-body .sp-slot canvas"));
      var aBefore = UI._bmState.a;
      var navBtn = document.querySelector('[data-nav="A:1"]');
      if (navBtn) navBtn.click();
      ok("R1: ◀▶で同タイル内の個体が切替わる", UI._bmState.a !== aBefore, aBefore + "→" + UI._bmState.a);
      document.querySelector('.sp-tile[data-tile="nihontokage:normal"]').click();
      ok("R1: 2枚目のタイルでBスロットが埋まる", !!UI._bmState.b);
      // ③クイック繁殖・繁殖予約の撤廃(§5ddd・70210c0)への追随。★叩くのではなく「無いこと」を検査する
      //   =撤廃したはずのUIが戻ってきたら落ちる向き。手動での掛け合わせだけが選出経路であることを固定する。
      ok("R1: クイック繁殖ボタン(#bm-quick)が存在しない(撤廃済)", !document.getElementById("bm-quick"));
      ok("R1: 繁殖予約トグル(#bm-reserve)が存在しない(撤廃済)", !document.getElementById("bm-reserve"));
      ok("R1: 手動選出(タイル→A/B)だけでA/Bが揃う=自動選出に依存しない", !!UI._bmState.a && !!UI._bmState.b);
      // 確定=Game.breed同一経路の証明(スパイ+効果検証)
      var bArgs = null, origBreed = Game.breed.bind(Game);
      Game.breed = function (aId, bId, silent) { bArgs = [aId, bId]; return origBreed(aId, bId, silent); };
      var selA = UI._bmState.a, selB = UI._bmState.b;
      var eggs0 = Game.state.eggs.length, coins0b = Game.state.coins;
      var la = Game.state.lizards.find(function (x) { return x.id === selA; });
      var lb = Game.state.lizards.find(function (x) { return x.id === selB; });
      var costAB = Game.breedCost(la, lb);
      document.getElementById("bm-go").click();
      ok("R1: 確定=Game.breed(選出A,B)が唯一の実行経路(旧UIと同一関数)", !!bArgs && bArgs[0] === selA && bArgs[1] === selB, JSON.stringify(bArgs));
      ok("R1: 繁殖成立=卵+1・コスト消費・CD開始(ロジック不変)", Game.state.eggs.length === eggs0 + 1 && Game.state.coins === coins0b - costAB && la.breedCd > 0, "eggs+" + (Game.state.eggs.length - eggs0) + " Δcoins=" + (coins0b - Game.state.coins) + " cd=" + Math.round(la.breedCd));
      Game.breed = origBreed;
      UI.closeModal();
      Game.state.research.recipe1 = true; // R1節のnewGameで消えた解読状態を復元(後続の合成テスト前提)
      Game.state.coins = 10000000; Game.addRes("bio", 5000);

      // ===== R5-a: 創世乱択(実操作: 確認モーダル→実行=乱択1・石4消費) =====
      (function () {
        var lz5 = Game.state.lizards[0];
        lz5.traits = []; lz5.fixedTraits = [];
        Game.state.stones = 10; Game.selectedId = lz5.id; UI.renderDetail();
        var gbtn = document.querySelector('#detail [data-act="genesis"]');
        if (gbtn) gbtn.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
        var goEl = document.querySelector("#modal-body #gn-go");
        ok("R5a: 創世ボタンで確認モーダル(ランダム明示)", !!goEl && /ランダム|選ぶことはできない/.test(document.getElementById("modal-body").textContent));
        if (goEl) goEl.click();
        var got = (lz5.traits || []).length === 1 && !TRAITS[(lz5.traits[0] || {}).key].synth;
        ok("R5a: 実行=基本特性1つが宿る+石" + (CFG.stoneGenesisRandCost || 4) + "消費", got && Game.stones() === 10 - (CFG.stoneGenesisRandCost || 4), "traits=" + JSON.stringify(lz5.traits) + " st=" + Game.stones());
        UI.closeModal();
      })();

      // ===== R3: 繁殖CDリセット(⬡実操作) =====
      Game.addOre("amethyst", 5);
      var cdlz = Game.state.lizards[0];
      cdlz.breedCd = 120; Game.selectedId = cdlz.id; UI.renderDetail();
      var cdBtn = document.querySelector('#detail [data-act="cd-amethyst"]');
      var am0 = Game.ore("amethyst");
      if (cdBtn) cdBtn.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true })); // 実配線=pointerdown(core.js:121)
      ok("R3: CDリセット実クリック=breedCd0+⬡消費" + (CFG.amethystCdResetCost || 2), !!cdBtn && cdlz.breedCd === 0 && Game.ore("amethyst") === am0 - (CFG.amethystCdResetCost || 2), "btn=" + !!cdBtn + " cd=" + cdlz.breedCd + " am=" + Game.ore("amethyst"));
      ok("R3: トップバーにアメジスト残数(#ui-amethyst)", !!document.getElementById("ui-amethyst"));

      // V6-P1-2: 合成は撤廃。UIからもAPIからも実行できないことを検査する
      ok("撤廃: 合成APIが存在しない", typeof Game.synthesize !== "function" && typeof Game.synthesizableRecipes !== "function");
      ok("撤廃: tier6も乱択創世で到達できる(獲得不能を作らない)", Object.keys(TRAITS).filter(function (k) { return TRAITS[k].tier >= 6; }).length === 6 && CFG.traitGenesisT6Weight > 0);
      UI.closeModal(); UI.closeHqLab();

      // ===== 当たり判定の整合(v5 HOLO COMMAND・設計座標1600×900。各モジュールの代表点がそのzoneを返す) =====
      // 更新履歴: GBA俯瞰→v3→v4→R4-1復元→v5 HOLO COMMAND(2026-07-25)。zones=錬成槽/標本アーカイブ/投資リング/中央フィード。
      UI._labRoomTierOverride = 3; UI.openHqLab(); // T3=全モジュール点灯で判定
      var reps = { tank: [190, 243], archive: [190, 509], desks: [1382, 461], feed: [800, 418] };
      for (var zk in reps) {
        var zp = { x: reps[zk][0], y: reps[zk][1] };
        ok("判定: " + zk + " の代表点がzone一致(v5モジュール座標)", UI._hqlabZoneAt(zp.x, zp.y) === zk, JSON.stringify(zp) + "→" + UI._hqlabZoneAt(zp.x, zp.y));
      }
      var labCv2 = document.getElementById("hqlab-canvas"), bl = UI._labBlit, rr = labCv2.getBoundingClientRect();
      function holoClick(px, py) {
        var dx = rr.left + (bl.bx + px * bl.k) * rr.width / labCv2.width, dy = rr.top + (bl.by + py * bl.k) * rr.height / labCv2.height;
        labCv2.dispatchEvent(new MouseEvent("click", { clientX: dx, clientY: dy, bubbles: true }));
      }
      holoClick(1382, 461);
      ok("判定: 投資リング実クリックで研究デスクパネルが開く", !!document.getElementById("modal-body").querySelector("#lab-invest"));
      UI.closeModal();
      holoClick(190, 243);
      ok("判定: 錬成槽実クリックでパネルが開く(遺伝子ラボ)", !!document.querySelector("#modal-body #hq-gene"));
      UI.closeModal();
      holoClick(800, 418);
      ok("判定: 中央フィードクリックで飼育槽へ戻る", !UI.hqLabOpen());
      UI.openHqLab();
      holoClick(1382, 660);
      ok("判定: 観測ログ実クリックで標本棚パネルが開く(裁定①・T3)", !!document.getElementById("modal-body").querySelector("#hq-lore"));
      UI.closeModal();
      holoClick(1450, 54);
      ok("判定: SPACEPORTインジケータ実クリックで宇宙港パネルが開く(裁定①)", /段階|完成/.test(document.getElementById("modal-body").textContent));
      UI.closeModal();
      // ===== §14: 右メニュー(常設導線)全項目の実クリック =====
      var menuChecks = [["desks", function(b){ return !!b.querySelector("#lab-invest"); }],
                        ["tank", function(b){ return !!b.querySelector("#hq-gene"); }], // V6-P1-2: 合成撤廃後の中身は遺伝子ラボ
                        ["shelf", function(b){ return !!b.querySelector("#hq-lore"); }],
                        ["rocket", function(b){ return /段階|完成/.test(b.textContent); }]];
      for (var mi = 0; mi < menuChecks.length; mi++) {
        var mk = menuChecks[mi][0];
        var mbtn = document.querySelector('#hqlab-menu [data-panel="' + mk + '"]');
        if (mbtn) mbtn.click();
        ok("右メニュー: " + mk + " クリックでパネルが開く", !!mbtn && menuChecks[mi][1](document.getElementById("modal-body")));
        UI.closeModal();
      }
      var dxbtn = document.querySelector('#hqlab-menu [data-panel="dex"]');
      if (dxbtn) dxbtn.click();
      ok("右メニュー: 図鑑クリックでモーダルが開く", !!dxbtn && !document.getElementById("modal").classList.contains("hidden"));
      UI.closeModal();
      UI._labRoomTierOverride = null;
      // ===== fps実測(フル再描画/静的blit方式の確認) =====
      var t0 = performance.now(); for (var fi = 0; fi < 120; fi++) UI.renderHqLab();
      var ms = (performance.now() - t0) / 120;
      ok("fps: フル再描画 " + ms.toFixed(2) + "ms(" + (1000 / ms).toFixed(0) + "fps) 予算内<8ms", ms < 8); console.log("[LABFPS] " + ms.toFixed(2) + "ms = " + (1000 / ms).toFixed(0) + "fps");
      document.title = "LABFPS " + (1000 / ms).toFixed(0);
      UI.closeHqLab();

      ok("console: 実行時エラーなし", !window.__err, window.__err);
    } catch (err) { fail++; R.push('<div class="ng">EXCEPTION ' + (err && err.message) + '</div>'); }
    document.getElementById("itest").innerHTML = "<b>PASS " + pass + " / FAIL " + fail + "</b>" + R.join("");
    document.title = "PASS " + pass + "/FAIL " + fail;
  }
  if (location.hash === "#now") run(); else window.addEventListener("load", function () { setTimeout(run, 300); }); // #now=同期実行(実時間fps計測用)
})();
</script>
</body>
</html>
