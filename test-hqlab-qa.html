<script>
window.__err = null; window.addEventListener("error", (e) => { window.__err = (window.__err || "") + e.message + " | "; });
(function () {
  var R = [], pass = 0, fail = 0;
  // 失敗の詳細(e)は実データ由来でHTMLを含みうる。そのまま流し込むと結果欄に要素が生まれ、
  //   壊れた <use href> が404を出して「console 0」の証拠を濁す(実際に起きた)。必ずエスケープする。
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function ok(n, c, e) { if (c) { pass++; R.push('<div class="ok">PASS ' + esc(n) + '</div>'); } else { fail++; R.push('<div class="ng">FAIL ' + esc(n) + (e ? " :: " + esc(e) : "") + '</div>'); } }
  function rectOf(el) { var r = el.getBoundingClientRect(); return { w: Math.round(r.width * 10) / 10, h: Math.round(r.height * 10) / 10, x: Math.round(r.left * 10) / 10, y: Math.round(r.top * 10) / 10 }; }
  function run() {
    try {
      var game = document.getElementById("game");
      // ===== 重点QA①: ページ往復でcanvasが壊れない =====
      var before = rectOf(game), attrsBefore = game.width + "x" + game.height;
      // 初回ロード直後に本部を開く(過去地雷: 0サイズ初期化)
      UI.openHqLab();
      var labCv = document.getElementById("hqlab-canvas"), labRect = rectOf(labCv);
      ok("QA1: 初回ロード直後に本部が開く(labキャンバス実寸>0)", labRect.w > 300 && labRect.h > 200, JSON.stringify(labRect));
      ok("QA1: 本部が1画面固定(labがviewport内=あふれ0)", labRect.w <= innerWidth && (labRect.y + labRect.h) <= innerHeight + 1, JSON.stringify(labRect) + " vp=" + innerWidth + "x" + innerHeight);
      for (var i = 0; i < 3; i++) { UI.closeHqLab(); UI.openHqLab(); } // 往復×3
      UI.closeHqLab();
      var after = rectOf(game), attrsAfter = game.width + "x" + game.height;
      ok("QA1: 往復後 #game の実寸が同一(過去地雷: 300px潰れ)", before.w === after.w && before.h === after.h && before.x === after.x && before.y === after.y, JSON.stringify(before) + " → " + JSON.stringify(after));
      ok("QA1: 往復後 #game のcanvas属性が同一", attrsBefore === attrsAfter, attrsBefore + " → " + attrsAfter);
      // クリック判定: 実クリックで個体選択→往復→同座標で再選択できる
      Game.newGame();
      var lz = Game.state.lizards[0];
      Game.state.lizards = [lz]; // 決定論化: 2匹目(位置ランダム)が判定圏へ迷い込むflakeを排除(fable3: 不安定テスト=非決定性の隔離)
      lz.x = 640; lz.y = 360; lz.tx = 640; lz.ty = 360; Game.ensureRuntime(lz);
      Render.draw();
      var r0 = game.getBoundingClientRect();
      var cx = r0.left + lz.x * r0.width / game.width, cy = r0.top + lz.y * r0.height / game.height;
      function clickAt(x, y) { game.dispatchEvent(new PointerEvent("pointerdown", { clientX: x, clientY: y, bubbles: true })); } // 実配線=pointerdown(core.js)
      Game.selectedId = null; clickAt(cx, cy);
      var sel1 = Game.selectedId === lz.id;
      UI.openHqLab(); UI.closeHqLab();
      Game.selectedId = null; Render.draw(); clickAt(cx, cy);
      ok("QA1: クリック判定が往復後もズレない(同座標で同個体を選択)", sel1 && Game.selectedId === lz.id, "sel1=" + sel1 + " sel2=" + (Game.selectedId === lz.id));

      // ===== 重点QA②: 本部滞在中もゲームが進む =====
      Game.newGame();
      Game.state.crickets = 0; // 自動給餌のGold消費を避け生産を純観測
      var inc = Game.totalIncomePerSec();
      Game.state.eggs.push({ speciesId: "kanahebi", morphId: "normal", hue: 100, sat: 50, light: 50, pattern: "stripe", t: 300, total: 300 });
      Game.state.raidTimer = 500;
      var coins0 = Game.state.coins, egg0 = Game.state.eggs[0].t, raid0 = Game.state.raidTimer, slit0 = (typeof Slit !== "undefined" && Slit._cd != null) ? 1 : 0;
      UI.openHqLab();
      for (var s = 0; s < 60; s++) { Game.tick(1); if (typeof Slit !== "undefined") Slit.advance(1); if (typeof Roulette !== "undefined") Roulette.advance(1); }
      ok("QA2: 本部滞在60秒でGoldが生産どおり増える", Game.state.coins > coins0 + inc * 50, "Δ=" + (Game.state.coins - coins0).toFixed(1) + " 期待≈" + (inc * 60).toFixed(1));
      ok("QA2: 卵の孵化が進む(t-60)", Math.abs((egg0 - Game.state.eggs[0].t) - 60) < 1.5, "Δ=" + (egg0 - Game.state.eggs[0].t).toFixed(1));
      ok("QA2: 襲撃タイマーが進む", Game.state.raidTimer < raid0 - 50, "Δ=" + (raid0 - Game.state.raidTimer).toFixed(1));
      UI.update();
      ok("QA2: 滞在中も本部表示が更新される(#hqlab-lvにHQ Lv)", /HQ Lv/.test(document.getElementById("hqlab-lv").textContent));
      UI.closeHqLab(); Render.draw();
      ok("QA2: 戻った直後にRender.drawがエラーなく走る(表示同期)", true);

      // ===== 12機能(パネル移設・経済直結の実操作) =====
      Game.newGame(); Game.state.coins = 10000000; Game.addRes("bio", 5000); Game.state.stones = 50;
      UI.openHqLab();
      UI.openLabPanel("desks");
      var body = document.getElementById("modal-body");
      // P3-3: 研究リストはβ遮蔽対象のため「枠の存在」のみ(中身の両面検査は後段のP3-3節が単一の真実)
      ok("機能: デスク群パネル(投資/変換/開発/侵食+研究枠)", body.querySelector("#lab-invest") && body.querySelector("#cv-food") && body.querySelector("#hq-dev") && body.querySelector("#hq-invasion") && body.querySelector("#research-list").children.length > 0);
      var food0 = Game.res("food"), c0 = Game.state.coins;
      body.querySelector("#cv-food").click(); body = document.getElementById("modal-body");
      ok("機能: Gold変換(実クリック)=食料+・Gold-", Game.res("food") === food0 + CFG.convertBatch && Game.state.coins < c0);
      var dev0 = Game.state.devLv || 0; c0 = Game.state.coins;
      body.querySelector("#hq-dev").click(); body = document.getElementById("modal-body");
      ok("機能: 惑星開発(実クリック)=devLv+1・Gold-", (Game.state.devLv || 0) === dev0 + 1 && Game.state.coins < c0);
      // 研究購入(recipe1を実クリック)
      var rows = body.querySelectorAll("#research-list .list-row"), bought = false;
      for (var ri = 0; ri < rows.length; ri++) { if (/レシピ解読 I</.test(rows[ri].innerHTML.replace("解読 I", "解読 I<"))) {} }
      Game.addRes("science", 500); UI.closeModal(); UI.openLabPanel("desks"); body = document.getElementById("modal-body");
      // V6-P1-2: レシピ解読は撤廃。研究一覧に残っていないことを検査する(叩かない)
      ok("撤廃: 研究一覧にレシピ解読が無い", body.textContent.indexOf("レシピ解読") < 0);
      ok("撤廃: RESEARCH定義にrecipeが無い", !RESEARCH.some(function (r) { return /^recipe[1-6]$/.test(r.id); }));
      UI.closeModal();
      UI.openLabPanel("tank"); body = document.getElementById("modal-body");
      ok("機能: 水槽パネル(遺伝子ラボ3/鍛造・合成は撤廃)", !body.querySelector("#synth-list") && body.querySelector("#hq-gene") && body.querySelector("#hq-forge").children.length > 3);
      ok("撤廃: 水槽に合成の痕跡が無い(レシピ名/未解読の?)", body.textContent.indexOf("シズミマチ") < 0 && body.textContent.indexOf("? ? ?") < 0);
      UI.closeModal();
      UI.openLabPanel("rocket"); body = document.getElementById("modal-body");
      ok("機能: 宇宙港パネル(建造)", /段階|完成/.test(body.textContent) && (body.querySelector("#hq-rocket") || /完成/.test(body.textContent)));
      UI.closeModal();
      UI.openLabPanel("shelf"); body = document.getElementById("modal-body");
      ok("機能: 標本棚パネル(Lore/鉱石アイコン列)", body.querySelector("#hq-lore") && body.querySelectorAll("svg.icon").length >= 6);
      UI.closeModal();
      // 設備投資(labInvest・案B): 鉱石を投じるとtierが育つ+後方互換
      Game.addOre("titaniumOre", 5); Game.addOre("amber", 5);
      var inv0 = Game.labInvestLv("desks"), tOre0 = Game.ore("titaniumOre");
      UI.closeModal(); UI.openLabPanel("desks"); body = document.getElementById("modal-body");
      var invBtn = body.querySelector("#lab-invest-btn");
      if (invBtn) invBtn.click();
      ok("投資: 鉱石を投じるとlabInvest+1・鉱石消費・tier連動", Game.labInvestLv("desks") === inv0 + 1 && Game.ore("titaniumOre") === tOre0 - 2 && UI.labTiers().desks === 1 + Game.labInvestLv("desks"), "inv=" + Game.labInvestLv("desks"));
      UI.closeModal();
      // 新着ドット: openHqLabで消える
      Game._badgeHq = true; UI.openHqLab();
      ok("機能: 新着ドットは本部を開くと消える", Game._badgeHq === false);

      // ===== R1: 繁殖ピッカーv2(実操作: タイル→A/B→切替→クイック→確定=Game.breed同一経路) =====
      Game.newGame(); Game.state.coins = 100000; Game.raid = null;
      Game.state.lizards = [];
      (function () {
        var sp = SPECIES.find(function (x) { return x.id === "kanahebi"; }), sp2 = SPECIES.find(function (x) { return x.id === "nihontokage"; });
        function mk(spec, morph, trs) {
          var lz = Game.makeLizard(spec.id, morph, { hue: spec.hue, sat: spec.sat, light: spec.light, pattern: "stripe", traits: (trs || []).map(function (k) { return { key: k }; }) }, "adult");
          lz.injuredT = 0; lz.breedCd = 0; Game.addLizard(lz, true); return lz;
        }
        mk(sp, "normal", ["mimikakushi"]); mk(sp, "normal", []); mk(sp, "albino", ["shinkai"]); mk(sp2, "normal", []);
      })();
      document.getElementById("btn-breed-menu").click();
      ok("R1: 左メニュー繁殖クリックでピッカーv2が開く", !!document.querySelector("#modal-body .sp-tiles"));
      var t1 = document.querySelector('.sp-tile[data-tile="kanahebi:normal"]');
      t1.click();
      ok("R1: タイル選択でAスロットに個体(チップ領域つき)", !!UI._bmState.a && !!document.querySelector("#modal-body .sp-slot canvas"));
      var aBefore = UI._bmState.a;
      var navBtn = document.querySelector('[data-nav="A:1"]');
      if (navBtn) navBtn.click();
      ok("R1: ◀▶で同タイル内の個体が切替わる", UI._bmState.a !== aBefore, aBefore + "→" + UI._bmState.a);
      document.querySelector('.sp-tile[data-tile="nihontokage:normal"]').click();
      ok("R1: 2枚目のタイルでBスロットが埋まる", !!UI._bmState.b);
      // ③クイック繁殖・繁殖予約の撤廃(§5ddd・70210c0)への追随。★叩くのではなく「無いこと」を検査する
      //   =撤廃したはずのUIが戻ってきたら落ちる向き。手動での掛け合わせだけが選出経路であることを固定する。
      ok("R1: クイック繁殖ボタン(#bm-quick)が存在しない(撤廃済)", !document.getElementById("bm-quick"));
      ok("R1: 繁殖予約トグル(#bm-reserve)が存在しない(撤廃済)", !document.getElementById("bm-reserve"));
      ok("R1: 手動選出(タイル→A/B)だけでA/Bが揃う=自動選出に依存しない", !!UI._bmState.a && !!UI._bmState.b);
      // 確定=Game.breed同一経路の証明(スパイ+効果検証)
      var bArgs = null, origBreed = Game.breed.bind(Game);
      Game.breed = function (aId, bId, silent) { bArgs = [aId, bId]; return origBreed(aId, bId, silent); };
      var selA = UI._bmState.a, selB = UI._bmState.b;
      var eggs0 = Game.state.eggs.length, coins0b = Game.state.coins;
      var la = Game.state.lizards.find(function (x) { return x.id === selA; });
      var lb = Game.state.lizards.find(function (x) { return x.id === selB; });
      var costAB = Game.breedCost(la, lb);
      document.getElementById("bm-go").click();
      ok("R1: 確定=Game.breed(選出A,B)が唯一の実行経路(旧UIと同一関数)", !!bArgs && bArgs[0] === selA && bArgs[1] === selB, JSON.stringify(bArgs));
      ok("R1: 繁殖成立=卵+1・コスト消費・CD開始(ロジック不変)", Game.state.eggs.length === eggs0 + 1 && Game.state.coins === coins0b - costAB && la.breedCd > 0, "eggs+" + (Game.state.eggs.length - eggs0) + " Δcoins=" + (coins0b - Game.state.coins) + " cd=" + Math.round(la.breedCd));
      Game.breed = origBreed;
      UI.closeModal();
      Game.state.research.recipe1 = true; // R1節のnewGameで消えた解読状態を復元(後続の合成テスト前提)
      Game.state.coins = 10000000; Game.addRes("bio", 5000);

      // ===== R5-a: 創世乱択(実操作: 確認モーダル→実行=乱択1・石4消費) =====
      (function () {
        var lz5 = Game.state.lizards[0];
        lz5.traits = []; lz5.fixedTraits = [];
        Game.state.stones = 10; Game.selectedId = lz5.id; UI.renderDetail();
        var gbtn = document.querySelector('#detail [data-act="genesis"]');
        if (gbtn) gbtn.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
        var goEl = document.querySelector("#modal-body #gn-go");
        ok("R5a: 創世ボタンで確認モーダル(ランダム明示)", !!goEl && /ランダム|選ぶことはできない/.test(document.getElementById("modal-body").textContent));
        if (goEl) goEl.click();
        var got = (lz5.traits || []).length === 1 && !TRAITS[(lz5.traits[0] || {}).key].synth;
        ok("R5a: 実行=基本特性1つが宿る+石" + (CFG.stoneGenesisRandCost || 4) + "消費", got && Game.stones() === 10 - (CFG.stoneGenesisRandCost || 4), "traits=" + JSON.stringify(lz5.traits) + " st=" + Game.stones());
        UI.closeModal();
      })();

      // ===== R3: 繁殖CDリセット(⬡実操作) =====
      Game.addOre("amethyst", 5);
      var cdlz = Game.state.lizards[0];
      cdlz.breedCd = 120; Game.selectedId = cdlz.id; UI.renderDetail();
      var cdBtn = document.querySelector('#detail [data-act="cd-amethyst"]');
      var am0 = Game.ore("amethyst");
      if (cdBtn) cdBtn.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true })); // 実配線=pointerdown(core.js:121)
      ok("R3: CDリセット実クリック=breedCd0+⬡消費" + (CFG.amethystCdResetCost || 2), !!cdBtn && cdlz.breedCd === 0 && Game.ore("amethyst") === am0 - (CFG.amethystCdResetCost || 2), "btn=" + !!cdBtn + " cd=" + cdlz.breedCd + " am=" + Game.ore("amethyst"));
      ok("R3: トップバーにアメジスト残数(#ui-amethyst)", !!document.getElementById("ui-amethyst"));

      // V6-P1-2: 合成は撤廃。UIからもAPIからも実行できないことを検査する
      ok("撤廃: 合成APIが存在しない", typeof Game.synthesize !== "function" && typeof Game.synthesizableRecipes !== "function");
      ok("撤廃: tier6も乱択創世で到達できる(獲得不能を作らない)", Object.keys(TRAITS).filter(function (k) { return TRAITS[k].tier >= 6; }).length === 6 && CFG.traitGenesisT6Weight > 0);
      UI.closeModal(); UI.closeHqLab();

      // ===== 当たり判定の整合(v5 HOLO COMMAND・設計座標1600×900。各モジュールの代表点がそのzoneを返す) =====
      // 更新履歴: GBA俯瞰→v3→v4→R4-1復元→v5 HOLO COMMAND(2026-07-25)。zones=錬成槽/標本アーカイブ/投資リング/中央フィード。
      UI._labRoomTierOverride = 3; UI.openHqLab(); // T3=全モジュール点灯で判定
      var reps = { tank: [190, 243], archive: [190, 509], desks: [1382, 461], feed: [800, 418] };
      for (var zk in reps) {
        var zp = { x: reps[zk][0], y: reps[zk][1] };
        ok("判定: " + zk + " の代表点がzone一致(v5モジュール座標)", UI._hqlabZoneAt(zp.x, zp.y) === zk, JSON.stringify(zp) + "→" + UI._hqlabZoneAt(zp.x, zp.y));
      }
      var labCv2 = document.getElementById("hqlab-canvas"), bl = UI._labBlit, rr = labCv2.getBoundingClientRect();
      function holoClick(px, py) {
        var dx = rr.left + (bl.bx + px * bl.k) * rr.width / labCv2.width, dy = rr.top + (bl.by + py * bl.k) * rr.height / labCv2.height;
        labCv2.dispatchEvent(new MouseEvent("click", { clientX: dx, clientY: dy, bubbles: true }));
      }
      holoClick(1382, 461);
      ok("判定: 投資リング実クリックで研究デスクパネルが開く", !!document.getElementById("modal-body").querySelector("#lab-invest"));
      UI.closeModal();
      holoClick(190, 243);
      ok("判定: 錬成槽実クリックでパネルが開く(遺伝子ラボ)", !!document.querySelector("#modal-body #hq-gene"));
      UI.closeModal();
      holoClick(800, 418);
      ok("判定: 中央フィードクリックで飼育槽へ戻る", !UI.hqLabOpen());
      UI.openHqLab();
      holoClick(1382, 660);

  // ===== §15: V6-P5 S0 音の窓口(docs/SoundSkills.md 憲章・2026-08-11 Ric承認) =====
  //   この段階では鳴らす音はまだ無い(基準音3種はS1)。ここで固定するのは**窓口の規律**と**計測器の感度**。
  //   波形の数値ゲート(RMS/ピーク/尺)は OfflineAudioContext が要るため node 側ではなく装置QAが担う。
  function soundSection() {
    try {
      if (typeof Sound === "undefined") { ok("§15前提: sound.js が読み込まれている", false); return Promise.resolve(); }
      ok("§15前提: CFG.soundOn の既定=false(初回無音・不可逆④)", CFG.soundOn === false);
      Game.newGame();
      ok("§15保存: 新規コロニーは音OFF", Game.soundEnabled() === false);

      // ---- 窓口(不可逆②: 発音は Sound.play(id) だけ) ----
      Sound.log.length = 0; Sound._last = {}; Sound._voices = 0;
      ok("§15窓口: OFFのまま play は受理しない(ログ0)", Sound.play("probe") === false && Sound.log.length === 0);
      // ★実ユーザー操作前の状態へ戻してからONにする。
      //   QA前半の実クリックは dispatchEvent の**合成**イベント=Chromeはuser gestureと認めない。
      //   このまま AudioContext を作ると suspended のまま warning が出るだけで「鳴った証拠」にはならない
      //   (偽の計測)。実音の判定はS1の ?tune=1 で Ric が本物のクリックで行う。
      Sound._unlocked = false; Sound._ctx = null;
      Game.setSoundEnabled(true);
      ok("§15 autoplay: ユーザー操作前は AudioContext を作らない(実ブラウザで実証)", Sound._ctx === null);
      ok("§15窓口: ONがSoundへ伝わる(演出層はセーブのキー名を知らない)", Sound.on() === true);
      ok("§15窓口: 未定義idは受理しない(捏造音を作らない)", Sound.play("nosuch") === false);
      Sound.log.length = 0; Sound._last = {};
      var accepted = 0;
      for (var si = 0; si < 10; si++) { if (Sound.play("probe")) accepted++; }
      ok("§15間引き: 連打10回でも受理1回(minGap " + CFG.soundMinGapMs + "ms・憲章§2-4)", accepted === 1 && Sound.log.length === 1, "受理=" + accepted);
      ok("§15 autoplay: ctx無しでも窓口は落ちない(受理は返るが発音しない=安全に退化)", Sound.log.length === 1 && Sound._ctx === null);

      // ---- ★カナリア先行: 計測器が差を本当に観測できるか(観測できない計測は0を偽造する) ----
      CFG.soundDefs.__qaQuiet = { type: "sine", freq: 880, dur: 0.12, vol: 0.05, attack: 0.005, release: 0.08 };
      CFG.soundDefs.__qaLong = { type: "sine", freq: 880, dur: 0.36, vol: 0.5, attack: 0.005, release: 0.08 };
      CFG.soundDefs.__qaNoise = { type: "noise", dur: 0.12, vol: 0.5, attack: 0.005, release: 0.08, seed: 7777 };
      // 期待値はCFGとdefから導く(QA側に数値を書き写さない=知識はCFGの1箇所)
      var pd = Sound.def("probe");
      var lenOf = function (d) { return Math.ceil(CFG.soundRenderSampleRate * (d.dur + d.release + CFG.soundRenderPadSec)); };
      var volOf = function (d) { return d.vol * CFG.soundMaster * (d.bus === "amb" ? CFG.soundAmbVol : CFG.soundSeVol); };
      var expLen = lenOf(pd);
      return Promise.all([Sound.renderOffline("probe"), Sound.renderOffline("__qaQuiet"), Sound.renderOffline("__qaLong"),
        Sound.renderOffline("__qaNoise"), Sound.renderOffline("__qaNoise")]).then(function (r) {
        var base = r[0], quiet = r[1], lng = r[2], n1 = r[3], n2 = r[4];
        ok("§15カナリア: 計測器が音量差を観測できる(vol 0.5 vs 0.05)", !!base && !!quiet && quiet.rms < base.rms * 0.5,
          "base=" + (base && base.rms.toFixed(4)) + " quiet=" + (quiet && quiet.rms.toFixed(4)));
        ok("§15カナリア: 計測器が尺の差を観測できる(dur 0.36 vs 0.12)", !!lng && lng.length > base.length * 1.5,
          "base=" + base.length + " long=" + lng.length);
        // ---- 数値ゲート(憲章§2-6) ----
        ok("§15波形: probe の尺が def どおり(" + expLen + "サンプル)", base.length === expLen, "実測=" + base.length);
        ok("§15波形: 無音ではない(RMS>0.01)", base.rms > 0.01, "rms=" + base.rms.toFixed(4));
        ok("§15波形: クリップしない(0.05<peak≤1.0)", base.peak > 0.05 && base.peak <= 1.0, "peak=" + base.peak.toFixed(4));
        ok("§15波形: peak が CFG の音量計算どおり(vol×master×se)", Math.abs(base.peak - volOf(pd)) < 0.02,
          "peak=" + base.peak.toFixed(4) + " 期待=" + volOf(pd).toFixed(4));
        ok("§15カナリア: 計測器が周波数を観測できる(probe=" + pd.freq + "Hz)", Math.abs(base.freqHz - pd.freq) < 20, "実測=" + base.freqHz.toFixed(1) + "Hz");
        ok("§15決定論: ノイズは固定シードで同一波形(Math.random不使用の実証)",
          n1.rms === n2.rms && n1.peak === n2.peak && n1.length === n2.length, "rms " + n1.rms.toFixed(6) + " / " + n2.rms.toFixed(6));
        delete CFG.soundDefs.__qaQuiet; delete CFG.soundDefs.__qaLong; delete CFG.soundDefs.__qaNoise;

        // ---- S1 基準音3種の数値ゲート(音の良し悪しはRic実機判定・ここは「defどおり鳴るか」だけ) ----
        var S1 = ["feed", "hatch", "defeat"];
        return Promise.all(S1.map(function (id) { return Sound.renderOffline(id); })).then(function (rs) {
          var pk = {}, ln = {};
          S1.forEach(function (id, i) {
            var d = Sound.def(id), r = rs[i];
            pk[id] = r.peak; ln[id] = r.length;
            ok("§15 S1[" + id + "]: 尺が def どおり(" + lenOf(d) + "サンプル)", r.length === lenOf(d), "実測=" + r.length);
            ok("§15 S1[" + id + "]: 無音ではない(RMS>0.005)", r.rms > 0.005, "rms=" + r.rms.toFixed(4));
            ok("§15 S1[" + id + "]: クリップしない(peak≤1.0)", r.peak <= 1.0, "peak=" + r.peak.toFixed(4));
            if (d.filterFreq) {
              // フィルタは減衰させるだけ(vol の額面どおりには鳴らない)。=ではなく上限で縛る。
              ok("§15 S1[" + id + "]: peak は CFG音量以下(フィルタの減衰ぶん小さい)", r.peak > 0 && r.peak <= volOf(d) * 1.05,
                "peak=" + r.peak.toFixed(4) + " 上限=" + volOf(d).toFixed(4));
            } else {
              ok("§15 S1[" + id + "]: peak が CFG の音量計算どおり", Math.abs(r.peak - volOf(d)) < 0.02,
                "peak=" + r.peak.toFixed(4) + " 期待=" + volOf(d).toFixed(4));
            }
            if (d.type !== "noise") {
              // スイープは持続部の平均周波数=両端の内側に必ず入る(端の値を書き写さない形の検査)
              var lo = Math.min(d.freq, d.freqEnd || d.freq), hi = Math.max(d.freq, d.freqEnd || d.freq);
              ok("§15 S1[" + id + "]: 実測周波数が def の範囲内(" + lo + "〜" + hi + "Hz)",
                r.freqHz > lo - 30 && r.freqHz < hi + 30, "実測=" + r.freqHz.toFixed(1) + "Hz");
            }
          });
          // 憲章§2-7「頻発ほど軽く短く・核となる瞬間に予算を集中」を数値で固定する。
          //   ★序列の物差しは RMS ではなく peak。RMS はバッファ全体の平均で、余韻の長い音ほど
          //     静寂で薄まる(尺の違う音の重さ比較には使えない)。peak は瞬間の当たりの強さで尺に依存しない。
          ok("§15 音予算(§2-7): peak 撃破>孵化>給餌", pk.defeat > pk.hatch && pk.hatch > pk.feed,
            JSON.stringify({ feed: +pk.feed.toFixed(3), hatch: +pk.hatch.toFixed(3), defeat: +pk.defeat.toFixed(3) }));
          ok("§15 音予算(§2-7): 尺 撃破>孵化>給餌", ln.defeat > ln.hatch && ln.hatch > ln.feed,
            JSON.stringify({ feed: ln.feed, hatch: ln.hatch, defeat: ln.defeat }));
          // ---- 配線の実測: 実プレイの場面で間引きが効くか(憲章§2-4「同時多発の濁りは仕組みで防ぐ」) ----
          //   購読はboot.jsが張った本番の配線をそのまま使う(QA専用の別配線を作らない=経路統一)。
          var idsIn = function (id) { return Sound.log.filter(function (e) { return e.id === id; }).length; };
          Game.newGame(); Game.state.crickets = 9999; Game.state.dial.auto = false;
          Sound.log.length = 0; Sound._last = {};
          for (var fi2 = 0; fi2 < 20; fi2++) { Game.feed(Game.state.lizards[0]); }
          ok("§15実測: 給餌20連打でも音は間引かれる(≦3)", idsIn("feed") <= 3 && idsIn("feed") >= 1, "feed音=" + idsIn("feed") + "/20回");
          Sound.log.length = 0; Sound._last = {};
          for (var hi = 0; hi < 20; hi++) {
            Game._hatchEggObject({ speciesId: "kanahebi", morphId: "normal", hue: 100, sat: 50, light: 50, pattern: "stripe" });
          }
          ok("§15実測: 大量孵化20件でも音は間引かれる(≦3)", idsIn("hatch") <= 3 && idsIn("hatch") >= 1, "hatch音=" + idsIn("hatch") + "/20件");
          Sound.log.length = 0; Sound._last = {};
          for (var di = 0; di < 20; di++) { Game.emit("defeat", { x: 0, y: 0 }); }
          ok("§15実測: 撃破イベント20連続でも音は間引かれる(≦3)", idsIn("defeat") <= 3 && idsIn("defeat") >= 1, "defeat音=" + idsIn("defeat") + "/20回");

          // ---- 初回無音の維持: 配線したあとでもOFFなら1つも鳴らない ----
          Game.setSoundEnabled(false);
          Sound.log.length = 0; Sound._last = {};
          Game.state.crickets = 9999;
          for (var oi = 0; oi < 10; oi++) { Game.feed(Game.state.lizards[0]); }
          Game._hatchEggObject({ speciesId: "kanahebi", morphId: "normal", hue: 100, sat: 50, light: 50, pattern: "stripe" });
          Game.emit("defeat", { x: 0, y: 0 });
          ok("★§15初回無音: OFFなら配線済みでも1つも鳴らない(不可逆④の実測)", Sound.log.length === 0, "log=" + Sound.log.length);

          // ---- §2-1「ONへの導線を一度だけ静かに知らせる」(boot.jsが張った本番の購読をそのまま使う) ----
          //   トーストはUI側の器なのでスパイして数える(DOM構造に依存しない=器を変えても壊れない検査)。
          var toasts = [], origToast = UI.toast;
          UI.toast = function (m) { toasts.push(String(m)); };
          Game.newGame(); Game.setSoundEnabled(false); toasts.length = 0;
          Game.emit("defeat", { x: 0, y: 0 });
          // 文言はS2後に「効果音」→「音」へ見直した(環境音が入りトグルの対象が広がったため)
          ok("★§15告知: 初回撃退でONの導線を1度だけ知らせる", toasts.length === 1 && /音をONにできます/.test(toasts[0]), JSON.stringify(toasts));
          Game.emit("defeat", { x: 0, y: 0 }); Game.emit("defeat", { x: 0, y: 0 });
          ok("★§15告知: 2度目以降は出ない(押し売りしない)", toasts.length === 1, "件数=" + toasts.length);
          ok("§15告知: 告知済みがセーブに残る(リロードしても再告知しない)", Game.soundHintSeen() === true);
          Game.newGame(); Game.setSoundEnabled(true); toasts.length = 0;
          Game.emit("defeat", { x: 0, y: 0 });
          ok("§15告知: 既にONの人には知らせない(必要がない)", toasts.length === 0, JSON.stringify(toasts));
          UI.toast = origToast;

          Game.setSoundEnabled(false);
          ok("§15保存: OFFへ戻せる(両方向トグル=単調フラグではない)", Game.soundEnabled() === false && Sound.on() === false);

          // ===== §16: S2 環境音の数値ゲート(SEとは物差しが違う) =====
          //   SE   = 一瞬の主張 → peak で測る(尺に依存しない当たりの強さ)
          //   環境音 = 背景に沈む → **持続RMS・定常性・低域比率**で測る。peakは判定に使わない。
          var st8 = STAGES.find(function (s) { return s.id === 8; });   // 明るい空(氷の前線)
          var st9 = STAGES.find(function (s) { return s.id === 9; });   // 暗い空(廃原子炉)
          var p8 = Sound.ambientFromTint(st8.sky), p9 = Sound.ambientFromTint(st9.sky);
          var deepDepth = CFG.soundAmbBreathDepth;
          return Promise.all([Sound.renderAmbientOffline(p8), Sound.renderAmbientOffline(p9)]).then(function (ar) {
            var a8 = ar[0], a9 = ar[1];
            ok("§16環境音: レンダリングできる(尺=CFGどおり)",
              !!a8 && a8.length === Math.ceil(CFG.soundRenderSampleRate * CFG.soundAmbRenderSec), "len=" + (a8 && a8.length));
            ok("§16環境音: 無音ではない(持続RMS>0.001)", a8.rms > 0.001, "rms=" + a8.rms.toFixed(5));
            ok("§16環境音: クリップしない(peak≤1.0)", a8.peak <= 1.0 && a9.peak <= 1.0);
            ok("★§16主張しない: 環境音のpeakがSE最軽(給餌)より小さい",
              a8.peak < pk.feed && a9.peak < pk.feed, "amb8=" + a8.peak.toFixed(4) + " amb9=" + a9.peak.toFixed(4) + " feed=" + pk.feed.toFixed(4));
            // 定常性=100ms窓RMSの max/min。風は本来ゆらぐので1.0にはならず、実測2.6前後が「静かな風」。
            //   速く深い息づかい(下のカナリア)では3.9まで悪化する。3.2はその間に引いた線。
            //   ★レンダリングは固定シードで決定論なので、この閾値は再現する(たまたま通る値ではない)。
            ok("★§16疲れない: 定常(100ms窓のRMSがそろう=耳につく揺れも立ち上がりも無い)",
              a8.steady < 3.2 && a9.steady < 3.2, "steady8=" + a8.steady.toFixed(2) + " steady9=" + a9.steady.toFixed(2));
            ok("§16環境音: 低域寄り(風がこもっている)", a8.lowRatio > 0.15 && a9.lowRatio > 0.15,
              "low8=" + a8.lowRatio.toFixed(3) + " low9=" + a9.lowRatio.toFixed(3));
            ok("★§16惑星差: 暗い惑星⑨のほうが低域に寄る(tint連動が音の差として出ている)",
              a9.lowRatio > a8.lowRatio, "low9=" + a9.lowRatio.toFixed(3) + " > low8=" + a8.lowRatio.toFixed(3));
            // ★カナリア: 定常性の物差しが「揺れ」を本当に観測できるか(観測できない計測は1.0を偽造する)
            CFG.soundAmbBreathSec = 1.0; CFG.soundAmbBreathDepth = 0.95;   // わざと速く深く揺らす
            return Sound.renderAmbientOffline(p8).then(function (aw) {
              CFG.soundAmbBreathSec = 14; CFG.soundAmbBreathDepth = deepDepth;  // 戻す
              ok("★§16カナリア: 定常性の計測が揺れを検知できる(速く深い息づかい→定常性が悪化)",
                aw.steady > a8.steady, "揺らした=" + aw.steady.toFixed(2) + " 通常=" + a8.steady.toFixed(2));
              // 系統別音量が環境音に効く(bus=ambの最初の利用者)
              var base = CFG.soundAmbVol;
              CFG.soundAmbVol = base * 0.25;
              return Sound.renderAmbientOffline(p8).then(function (aq) {
                CFG.soundAmbVol = base;
                ok("★§16系統別音量: 環境音は soundAmbVol で下がる(SEのsoundSeVolとは別系統)",
                  aq.rms < a8.rms * 0.5, "1/4量=" + aq.rms.toFixed(5) + " 基準=" + a8.rms.toFixed(5));
                ok("§16環境音: 惑星切替のフェードがCFGにある(クリックを出さない)", CFG.soundAmbFadeSec > 0);

                // ===== §17: S3 場所の環境音(本部/巣)+ 賢者の石 の数値ゲート =====
                //   ★S2で確立した物差しをそのまま使う。飼育槽が基準で、本部/巣はその相対で判定する。
                //   ★持続層(ハム/パッド)と点の層(tick/心拍)は物差しが違う: 定常性は持続層で測り、
                //     点の層はpeakで測る。混ぜて測ると「tickがあるから定常性が悪い」が疲れを隠す。
                var pHq = Sound.ambientForPlace("hq", null), pNest = Sound.ambientForPlace("nest", null);
                return Promise.all([Sound.renderAmbientOffline(pHq), Sound.renderAmbientOffline(pNest)]).then(function (br) {
                  var H = br[0], N = br[1];
                  ok("§17場所: 本部と巣のパラメータが導出できる", !!pHq && !!pNest && isFinite(pHq.padHz) && isFinite(pNest.padHz));
                  ok("★§17主張しない: 本部も巣もpeakがSE最軽(給餌)より小さい",
                    H.peak < pk.feed && N.peak < pk.feed, "hq=" + H.peak.toFixed(4) + " nest=" + N.peak.toFixed(4) + " feed=" + pk.feed.toFixed(4));
                  // ★基準は飼育槽(Ric承認: 以後の場面音はこの基準からの相対で設計する)。
                  //   実測 a8/a9 = 0.0097/0.0066。場所の音がこの帯から大きく外れたら「基準からの相対」が崩れている。
                  ok("★§17基準からの相対: 本部/巣の持続RMSが飼育槽と同程度(0.5〜1.6倍の帯)",
                    H.rms > a9.rms * 0.5 && H.rms < a8.rms * 1.6 && N.rms > a9.rms * 0.5 && N.rms < a8.rms * 1.6,
                    "hq=" + H.rms.toFixed(5) + " nest=" + N.rms.toFixed(5) + " 飼育槽=" + a9.rms.toFixed(5) + "〜" + a8.rms.toFixed(5));
                  ok("§17環境音: 低域寄り(場所の音も背景に沈む)", H.lowRatio > 0.15 && N.lowRatio > 0.15,
                    "hq=" + H.lowRatio.toFixed(3) + " nest=" + N.lowRatio.toFixed(3));
                  // ★三者の質感差が数値にも出ているか(Ric要件: 聴いて分かること)
                  ok("★§17質感差: 籠もり具合に序列がある(巣>本部>飼育槽=巣が最も籠もる)",
                    N.lowRatio > H.lowRatio && H.lowRatio > a8.lowRatio,
                    "nest=" + N.lowRatio.toFixed(3) + " > hq=" + H.lowRatio.toFixed(3) + " > tank=" + a8.lowRatio.toFixed(3));
                  ok("★§17質感差: 本部は計器=最も平坦 / 飼育槽は風=最もゆらぐ",
                    H.steady < N.steady && N.steady < a8.steady,
                    "hq=" + H.steady.toFixed(2) + " < nest=" + N.steady.toFixed(2) + " < tank=" + a8.steady.toFixed(2));
                  ok("★§17質感差: 三者の音程が互いに離れている(同じ音に聞こえない)",
                    Math.abs(Math.log2(pHq.padHz / pNest.padHz)) > 1 / 12 && Math.abs(Math.log2(p8.padHz / pHq.padHz)) > 1 / 12,
                    "tank=" + p8.padHz.toFixed(1) + " hq=" + pHq.padHz.toFixed(1) + " nest=" + pNest.padHz.toFixed(1));
                  // ★持続層だけで疲れを測る(点の層を0にする)。tick/心拍は「点」であって揺れではない
                  var hqT = CFG.soundHqTickLevel, nsP = CFG.soundNestPulseLevel;
                  CFG.soundHqTickLevel = 0; CFG.soundNestPulseLevel = 0;
                  return Promise.all([Sound.renderAmbientOffline(pHq), Sound.renderAmbientOffline(pNest)]).then(function (sr) {
                    CFG.soundHqTickLevel = hqT; CFG.soundNestPulseLevel = nsP;
                    ok("★§17疲れない: 持続層が定常(本部のハム・巣のパッドに耳につく揺れが無い)",
                      sr[0].steady < 3.2 && sr[1].steady < 3.2, "hq=" + sr[0].steady.toFixed(2) + " nest=" + sr[1].steady.toFixed(2));
                    ok("★§17点の層が存在する(tick・心拍がpeakとして出ている=消えていない)",
                      H.peak > sr[0].peak * 1.2 && N.peak > sr[1].peak * 1.2,
                      "hq " + sr[0].peak.toFixed(4) + "→" + H.peak.toFixed(4) + " / nest " + sr[1].peak.toFixed(4) + "→" + N.peak.toFixed(4));
                    // ★カナリア: 巣のうなりを速く戻すと定常性が悪化して捕まるか(是正が本物である証明)
                    var nd = CFG.soundNestPadDetune; CFG.soundNestPadDetune = CFG.soundAmbPadDetune;
                    return Sound.renderAmbientOffline(pNest).then(function (nw) {
                      CFG.soundNestPadDetune = nd;
                      ok("★§17カナリア: 巣のうなりを速くすると定常性が悪化する(是正が閾値いじりでない証拠)",
                        nw.steady > sr[1].steady * 1.5, "速いうなり=" + nw.steady.toFixed(2) + " 現行=" + sr[1].steady.toFixed(2));
                      // ---- 賢者の石(=四重スリットの全通過) ----
                      return Sound.renderOffline("stone").then(function (S) {
                        ok("§17石: レンダリングできる・無音ではない", !!S && S.rms > 0.005, "rms=" + (S && S.rms.toFixed(4)));
                        ok("§17石: クリップしない(peak≤1.0)", S.peak <= 1.0, "peak=" + S.peak.toFixed(4));
                        ok("★§17音予算(§2-7): 石が最も重い(peak 石>撃破>孵化>給餌)",
                          S.peak > pk.defeat && pk.defeat > pk.hatch && pk.hatch > pk.feed,
                          "石=" + S.peak.toFixed(4) + " 撃破=" + pk.defeat.toFixed(4));
                        // ★未実装のボス撃破(優先度4)が撃破と石の間に入る余地を残してあるか。
                        //   石を撃破のすぐ上に置くとボスの居場所が無くなる=優先度表と整合しなくなる。
                        ok("★§17序列の余地: 石と撃破の間が十分開いている(未実装のボス撃破が入る)",
                          S.peak > pk.defeat * 1.5, "石/撃破=" + (S.peak / pk.defeat).toFixed(2) + "倍");
                        ok("★§17石: 最も長い余韻を持つ(極めて稀な事象に見合う尾)",
                          S.length > ln.defeat * 2, "石=" + Math.round(S.length / S.sampleRate * 1000) + "ms 撃破=" + Math.round(ln.defeat / S.sampleRate * 1000) + "ms");
                        ok("★§17石: 2層(ノイズバースト+ベル)が両方鳴っている",
                          (CFG.soundDefs.stone.layers || []).length === 2 && S.peak > 0.3, "peak=" + S.peak.toFixed(4));
                        // ★ここまでで音はOFFへ戻されている(§15の最後)。窓口はOFFだと受理しないので、
                        //   この1点だけ一時的にONにして数え、必ず元へ戻す(初回無音の検査を壊さない)。
                        var stoneLog = (function () {
                          var was = Sound.on();
                          Sound.setEnabled(true);
                          Sound.log.length = 0; Sound._last.stone = null;
                          var acc = Sound.play("stone");
                          var n = Sound.log.length;
                          Sound.setEnabled(was);
                          return { acc: acc, n: n, was: was };
                        })();
                        ok("§17石: 1音として1回だけ数える(層の数だけログを増やさない・§2-7 1操作1音)",
                          stoneLog.acc === true && stoneLog.n === 1, "受理=" + stoneLog.acc + " log=" + stoneLog.n);
                        ok("§17石: 計測のあと音はOFFへ戻っている(初回無音の検査を汚さない)", Sound.on() === false && Game.soundEnabled() === false);
                        ok("★§17石: 全通過は約1/3900の極めて稀な事象(音予算集中の根拠)",
                          CFG.slitHalfDeg.reduce(function (a, d) { return a * (2 * d / 360); }, 1) < 1 / 1000);
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    } catch (err) { fail++; R.push('<div class="ng">EXCEPTION(§15 sound) ' + (err && err.message) + '</div>'); return Promise.resolve(); }
  }
  if (location.hash === "#now") run(); else window.addEventListener("load", function () { setTimeout(run, 300); }); // #now=同期実行(実時間fps計測用)
})();
</script>
</body>
</html>
