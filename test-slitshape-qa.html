<!DOCTYPE html>
<meta charset="utf-8">
<title>四重スリット 姿形QA(切れ目=物理の角度窓 の一致証明)</title>
<style>body{background:#12100f;color:#e8dccb;font:13px/1.6 system-ui;padding:16px}
.ok{color:#8fd68f}.ng{color:#ff8f8f}h2{font-size:15px;margin:14px 0 6px}pre{white-space:pre-wrap}</style>
<body>
<h2>四重スリット 姿形QA — 実描画のピクセルから「見た目の隙間=物理の角度窓」を検証</h2>
<pre id="out">実行中…</pre>
<script src="js/data.js"></script>
<script>var UI = {}; var Motion = { reduced: false };</script>
<script src="js/ui/screens/slit.js"></script>
<script>
// 実描画(UI._slitRing)を1リングずつ描き、円周上のピクセルを走査して「線が不在の角度区間」を実測する。
//   期待: 最大の不在区間 = 物理の切れ目 2*slitHalfDeg[i](= 粒子が通れる角度窓)と一致し、その中心 = 基準角。
//   期待: それ以外の不在区間(分節の粒の隙間・標識の警戒縞)は物理の切れ目より十分小さい(曖昧にならない)。
const L = [], P = (s, ok) => L.push((ok === undefined ? "" : (ok ? "  [PASS] " : "  [FAIL] ")) + s);
let pass = 0, fail = 0;
const chk = (cond, msg) => { cond ? pass++ : fail++; P(msg, !!cond); };

const S = 900, cv = document.createElement("canvas"); cv.width = cv.height = S;
const ctx = cv.getContext("2d");
const cx = S / 2, cy = S / 2, R = S * 0.44;

// 1リングを描いて、角度ごとに「その姿形の半径帯に線があるか」を判定 → 不在区間(度)の一覧を返す
function gapsOf(sk, rr, baseDeg, halfDeg) {
  ctx.clearRect(0, 0, S, S);
  UI._slitRing(ctx, cx, cy, rr, baseDeg, halfDeg, "rgba(255,255,255,1)", 2.2, sk);
  const img = ctx.getImageData(0, 0, S, S).data;
  const lit = (x, y) => { const i = ((y | 0) * S + (x | 0)) * 4 + 3; return img[i] > 24; };
  const step = 0.25, on = [];
  let rMinLit = Infinity;                                 // 描画が中心へどこまで迫ったか(px)=着地点の可読性検査に使う
  for (let d = 0; d < 360; d += step) {
    const th = d * Math.PI / 180;
    let hit = false;
    // 中心付近から外まで放射方向を全走査(星形の谷/歯車の歯底/ルーローの窪みまで届く)。内側から見て最初に当たった半径を記録。
    // 切れ目の中は「どの半径にも線が無い」ため広く走っても偽陽性にならない(1リングだけを描いて判定しているため)。
    for (let r = R * 0.008; r <= rr * 1.18; r += 0.6) {
      if (lit(cx + r * Math.cos(th), cy - r * Math.sin(th))) { hit = true; if (r < rMinLit) rMinLit = r; break; }
    }
    on.push(hit);
  }
  gapsOf.rMinLit = rMinLit;
  const n = on.length, gaps = [];
  let i0 = 0; while (i0 < n && !on[i0]) i0++;           // 線のある位置から走査開始(区間の分断を避ける)
  if (i0 >= n) return [{ span: 360, mid: 0 }];
  let run = 0;
  for (let k = 1; k <= n; k++) {
    const idx = (i0 + k) % n;
    if (!on[idx]) run++;
    else if (run) { const endD = ((i0 + k) % n) * step; gaps.push({ span: run * step, mid: (endD - run * step / 2 + 360) % 360 }); run = 0; }
  }
  return gaps.sort((a, b) => b.span - a.span);
}

const angDist = (a, b) => { let d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const def = CFG.slitSkinDefault, byStage = CFG.slitSkinByStage;
const names = {}; STAGES.forEach((s) => names[s.id] = s.name);
const cells = [["default", def]].concat(Object.keys(byStage).map(Number).sort((a, b) => a - b).map((id) => [names[id] + "(" + id + ")", Object.assign({}, def, byStage[id])]));

for (const [label, sk0] of cells) {
  const shapes = [];
  for (let i = 0; i < CFG.slitRings; i++) { const s = UI._slitRingSkin(sk0, i); shapes.push((s.shape || "ring") + (s.sides ? "/" + s.sides : "") + (s.points ? "/" + s.points + "点" : "")); }
  P("■ " + label + " リング別=" + shapes.join(" → "));
  for (let i = 0; i < CFG.slitRings; i++) {
    const sk = UI._slitRingSkin(sk0, i);            // リング別の幾何で検証(惑星単位の単一shapeなら従来どおり)
    const half = CFG.slitHalfDeg[i], base = CFG.slitBaseAngleDeg + i * 37; // 基準角は任意(回転しても成立すること)
    const rr = CFG.slitRadiif[i] * R;
    const g = gapsOf(sk, rr, base, half);
    const top = g[0] || { span: 0, mid: 0 }, second = g[1] || { span: 0 };
    // ① 最大の不在区間 = 物理の切れ目 2*half(描画の離散化とlineWidth分の誤差を許容)
    chk(Math.abs(top.span - 2 * half) <= 4, `ring${i} 切れ目の幅 実測${top.span.toFixed(1)}° = 物理2*half ${2 * half}°`);
    // ② 切れ目の中心 = 物理の基準角(見た目の隙間が物理の通過角と同じ位置)
    chk(angDist(top.mid, base) <= 3, `ring${i} 切れ目の中心 実測${top.mid.toFixed(1)}° = 物理の基準角 ${base}°`);
    // ③ 他の隙間は物理の切れ目の半分未満=切れ目の位置が曖昧にならない
    chk(second.span < top.span * 0.5, `ring${i} 次に大きい隙間 ${second.span.toFixed(1)}° < 切れ目${top.span.toFixed(1)}°の半分`);
    // ④ 着地点の可読性(合格条件4): 描画が中心の確保余白 R*coreF*clearF の内側へ侵入しない
    const rMin = R * (CFG.slitCenterCoreF || 0.028) * (CFG.slitCenterClearF || 2.5);
    chk(gapsOf.rMinLit >= rMin, `ring${i} 最内到達 ${(gapsOf.rMinLit / R).toFixed(3)}R >= 確保余白 ${(rMin / R).toFixed(3)}R(中心を覆わない)`);
  }
}
P("");
P(`=== 四重スリット姿形 QA: ${pass} PASS / ${fail} FAIL ===`);
P(fail === 0 ? "すべてPASS(全10惑星+default×4リング: 見た目の隙間=物理の角度窓と一致・位置も一致・分節/標識の粒間は曖昧化しない)" : "要修正");
document.getElementById("out").innerHTML = L.join("\n").replace(/\[PASS\]/g, '<span class="ok">[PASS]</span>').replace(/\[FAIL\]/g, '<span class="ng">[FAIL]</span>');
document.title = (fail === 0 ? "ALLPASS " : "FAIL ") + pass + "/" + (pass + fail);
</script>
</body>
