<h1>本部=研究施設 試作(hq_lab.md・アイソメ2:1・白タイル承認済)— 部屋+設備のtier成長</h1>
<p class="note">研究室の静けさ・清潔さを保つ(賑やかにしない)。設備は1つずつ追加・tierで姿ごと発達(Phase 8方式)。</p>
<canvas id="lab" width="1000" height="620"></canvas>
<div id="strips"></div>
<script>
// ============================================================
// アイソメ試作(ゲーム非接続)。承認後に本実装へ移植する基準画。パラメータはLAB/各設備定数に集約(本実装でCFG/tokens化)。
// ============================================================
const LAB = {
  tileW: 64, tileH: 32, cols: 12, rows: 9,
  originX: 500, originY: 150, wallH: 92,
  tile: "#e9e7e1", tileAlt: "#e2dfd8", seam: "#c9c5bb", tileEdge: "#b5b1a6",
  wall: "#dcd9d2", wallDk: "#cfccc4", wallBase: "#b8b4a9",
  light: "rgba(210, 225, 235, .10)", vig: 0.34,
};
const iso = (gx, gy, o) => ({ x: o.x + (gx - gy) * LAB.tileW / 2, y: o.y + (gx + gy) * LAB.tileH / 2 });
const poly = (c, pts, fill, stroke, lw) => {
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.closePath();
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
};
// アイソメの箱(設備の基本形): footprint w×d タイル・高さh px。top/左面/右面の3面(面の向きで明暗)。
const isoBox = (c, o, gx, gy, w, d, h, col) => {
  const p00 = iso(gx, gy, o), p10 = iso(gx + w, gy, o), p11 = iso(gx + w, gy + d, o), p01 = iso(gx, gy + d, o);
  const up = (p) => ({ x: p.x, y: p.y - h });
  poly(c, [up(p01), up(p11), p11, p01], col.left);
  poly(c, [up(p10), up(p11), p11, p10], col.right);
  poly(c, [up(p00), up(p10), up(p11), up(p01)], col.top, col.line, 1);
  return { p00, p10, p11, p01, up };
};

// ---------------- 設備: パソコンデスク群(研究) ----------------
// tier成長: T1 机1+端末1 → T2 3台の島 → T3 多面モニタの解析卓 → T4 サーバーラック併設。
// 清潔さ=白い天板・冷たいシアンの画面光(弱)・配線や散らかりは描かない。
const DESK = {
  top: "#d3cfc6", left: "#a8a498", right: "#98948a", line: "rgba(90,86,78,.45)", // 床よりわずかに沈む灰(同化しない)
  mon: { top: "#4c4f55", left: "#3c3f45", right: "#34373d", line: "rgba(0,0,0,.4)" },
  screen: "#bfe4ee", screenGlow: 5, screenA: 0.85,
  rack: { top: "#464a52", left: "#383c44", right: "#30343c", line: "rgba(0,0,0,.45)" },
  led1: "#7fd98a", led2: "#e0b34a",
};
const deskCol = { top: DESK.top, left: DESK.left, right: DESK.right, line: DESK.line };
function monitor(c, o, gx, gy, w, screenW) { // 机上のモニタ(SE面=画面がこちらを向く)
  const b = isoBox(c, o, gx, gy, w, 0.1, 15, DESK.mon);
  const s0 = iso(gx + w * 0.08, gy + 0.1, o), s1 = iso(gx + w * (0.08 + (screenW || 0.84)), gy + 0.1, o);
  c.save(); c.globalAlpha = DESK.screenA; c.shadowColor = DESK.screen; c.shadowBlur = DESK.screenGlow;
  poly(c, [{ x: s0.x, y: s0.y - 13 }, { x: s1.x, y: s1.y - 13 }, { x: s1.x, y: s1.y - 3.5 }, { x: s0.x, y: s0.y - 3.5 }], DESK.screen);
  c.restore();
}
function shadowPatch(c, o, gx, gy, w, d) { // 接地影(浮かない・研究室の静かな影)
  const p00 = iso(gx - 0.06, gy - 0.06, o), p10 = iso(gx + w + 0.1, gy - 0.06, o), p11 = iso(gx + w + 0.1, gy + d + 0.1, o), p01 = iso(gx - 0.06, gy + d + 0.1, o);
  poly(c, [p00, p10, p11, p01], "rgba(60,54,44,.18)");
}
function desk(c, o, gx, gy, w, d) { // 机(灰の天板・細い脚・接地影)
  const legH = 20, topH = 4;
  shadowPatch(c, o, gx, gy, w, d);
  const l1 = iso(gx + 0.1, gy + d - 0.1, o), l2 = iso(gx + w - 0.1, gy + d - 0.1, o), l3 = iso(gx + w - 0.1, gy + 0.1, o);
  c.strokeStyle = DESK.right; c.lineWidth = 2.5;
  for (const l of [l1, l2, l3]) { c.beginPath(); c.moveTo(l.x, l.y); c.lineTo(l.x, l.y - legH); c.stroke(); }
  // 天板=薄い箱(側面が見える厚み)
  const p00 = iso(gx, gy, o), p10 = iso(gx + w, gy, o), p11 = iso(gx + w, gy + d, o), p01 = iso(gx, gy + d, o);
  const up = (p, h) => ({ x: p.x, y: p.y - h });
  poly(c, [up(p01, legH + topH), up(p11, legH + topH), up(p11, legH), up(p01, legH)], DESK.left);
  poly(c, [up(p10, legH + topH), up(p11, legH + topH), up(p11, legH), up(p10, legH)], DESK.right);
  poly(c, [up(p00, legH + topH), up(p10, legH + topH), up(p11, legH + topH), up(p01, legH + topH)], DESK.top, DESK.line, 1);
}
function drawDesks(c, o, tier) {
  if (tier >= 4) { // サーバーラック(左奥の壁際・静かなLED)
    for (const gy0 of [1.6, 2.8]) {
      shadowPatch(c, o, 0.3, gy0, 0.55, 0.9);
      const b = isoBox(c, o, 0.3, gy0, 0.55, 0.9, 74, DESK.rack);
      for (let i = 0; i < 4; i++) { // SE面のLED(小さく・点滅させない=§5.7)
        const p = iso(0.85, gy0 + 0.18 + i * 0.18, o);
        c.fillStyle = i % 3 === 0 ? DESK.led2 : DESK.led1; c.globalAlpha = 0.9;
        c.fillRect(p.x - 1, p.y - 58 + i * 3, 2, 2); c.globalAlpha = 1;
      }
    }
  }
  // 中核の机(T1から存在・T3で解析卓へ拡幅)
  const w = tier >= 3 ? 2.3 : 1.5;
  desk(c, o, 2.0, 2.0, w, 0.8);
  if (tier >= 3) { monitor(c, o, 2.15, 2.02, 0.7); monitor(c, o, 2.95, 2.02, 0.95, 0.8); monitor(c, o, 4.0, 2.02, 0.55); } // 多面モニタ(中央が主)
  else monitor(c, o, 2.35, 2.02, 0.8);
  if (tier >= 2) { // 3台の島(直交の机2)
    desk(c, o, 2.0, 3.15, 1.4, 0.8); monitor(c, o, 2.3, 3.17, 0.75);
    desk(c, o, 4.0, 2.9, 0.8, 1.4); // 直交配置
    const b = isoBox(c, o, 4.5, 3.0, 0.1, 0.8, 15, DESK.mon); // 横向きモニタ(NE面)
    const s0 = iso(4.5, 3.08, o), s1 = iso(4.5, 3.72, o);
    c.save(); c.globalAlpha = DESK.screenA; c.shadowColor = DESK.screen; c.shadowBlur = DESK.screenGlow;
    poly(c, [{ x: s0.x, y: s0.y - 13 }, { x: s1.x, y: s1.y - 13 }, { x: s1.x, y: s1.y - 3.5 }, { x: s0.x, y: s0.y - 3.5 }], DESK.screen);
    c.restore();
  }
  // 丸椅子(T1=1脚 → T2+=2脚。生活の気配は最小限)
  const stool = (sx, sy) => { shadowPatch(c, o, sx, sy, 0.32, 0.32); isoBox(c, o, sx, sy, 0.32, 0.32, 12, deskCol); };
  stool(2.6, 3.0 - (tier >= 2 ? 0 : 0.6));
  if (tier >= 2) stool(3.4, 2.55);
}

// ---------------- 設備: 実験用水槽(合成=トランスミュートの場) ----------------
// tier成長: T1 小さなガラス水槽 → T2 培養槽+配管 → T3 錬成槽(深紅の光が差す) → T4 複数槽の実験区画。
// 錬成槽の深紅(#8E1826=賢者の石)は部屋で唯一の暖色=錬金の場の徴(それでも抑制・光は槽の中だけ)。
const AQUA = {
  base: { top: "#d3cfc6", left: "#a8a498", right: "#98948a", line: "rgba(90,86,78,.45)" },
  glassL: "rgba(168,205,218,.30)", glassR: "rgba(148,190,205,.36)", glassT: "rgba(225,240,245,.28)",
  edge: "rgba(210,235,242,.75)", water: "rgba(95,168,201,.38)", waterTop: "rgba(150,205,228,.5)",
  pipe: "#9aa0a5", crimson: "#8E1826", crimsonGlow: "rgba(142,24,38,.34)",
};
function glassTank(c, o, gx, gy, w, d, h, crimson) {
  shadowPatch(c, o, gx, gy, w, d);
  isoBox(c, o, gx, gy, w, d, 5, AQUA.base); // 台座
  const wl = 5 + (h - 5) * 0.62; // 水面の高さ
  isoBox(c, o, gx + 0.04, gy + 0.04, w - 0.08, d - 0.08, wl, { top: AQUA.waterTop, left: AQUA.water, right: AQUA.water, line: "rgba(0,0,0,0)" }); // 水
  if (crimson) { // 錬成槽: 槽の中に深紅の光(部屋で唯一の暖色・槽内だけ)
    const m = iso(gx + w / 2, gy + d / 2, o);
    const g = c.createRadialGradient(m.x, m.y - wl * 0.55, 2, m.x, m.y - wl * 0.55, 26);
    g.addColorStop(0, AQUA.crimsonGlow); g.addColorStop(1, "rgba(142,24,38,0)");
    c.fillStyle = g; c.beginPath(); c.ellipse(m.x, m.y - wl * 0.55, 26, 20, 0, 0, 7); c.fill();
    c.fillStyle = AQUA.crimson; c.globalAlpha = 0.85;
    c.beginPath(); c.arc(m.x, m.y - wl * 0.55, 2.2, 0, 7); c.fill(); c.globalAlpha = 1; // 芯=賢者の石
  }
  const b = isoBox(c, o, gx, gy, w, d, h, { top: AQUA.glassT, left: AQUA.glassL, right: AQUA.glassR, line: AQUA.edge }); // ガラス
  c.strokeStyle = AQUA.edge; c.lineWidth = 1; // 縦の稜線(ガラスの角)
  c.beginPath(); c.moveTo(b.p11.x, b.p11.y); c.lineTo(b.p11.x, b.p11.y - h); c.stroke();
}
function pipeTo(c, o, gx, gy, topH, wallGy) { // 槽上部から奥の壁へ伸びる配管
  const a = iso(gx, gy, o), t = { x: a.x, y: a.y - topH }, w = iso(gx, wallGy, o);
  c.strokeStyle = AQUA.pipe; c.lineWidth = 2.5; c.lineCap = "round";
  c.beginPath(); c.moveTo(t.x, t.y); c.lineTo(t.x, t.y - 10); c.lineTo(w.x, w.y - topH - 10 - (gy - wallGy) * 0); c.stroke();
}
function drawAqua(c, o, tier) {
  glassTank(c, o, 7.6, 1.25, 0.85, 0.85, 36, tier >= 3); // 主槽(T3+で錬成槽)
  if (tier >= 2) { glassTank(c, o, 8.75, 1.2, 0.62, 0.62, 52, false); pipeTo(c, o, 9.05, 1.5, 52, 0.15); } // 培養槽+配管
  if (tier >= 4) { glassTank(c, o, 6.55, 1.35, 0.6, 0.6, 30, false); pipeTo(c, o, 8.0, 1.55, 36, 0.15); } // 実験区画(3槽+配管)
}

// ---------------- 設備: ロケット(クリア目標=rocket.done) ----------------
// tier成長: T1 部品置き場 → T2 骨組み → T3 機体 → T4 完成(発射可能)。白い機体+琥珀の先端=清潔な白の中の小さな目標色。
const RKT = {
  hull: { top: "#e6e3dc", left: "#c5c1b8", right: "#b2aea4", line: "rgba(90,86,78,.4)" },
  scaffold: "#9aa0a5", tip: "#C9A227", fin: "#b2aea4", pad: { top: "#c9c5bb", left: "#a8a498", right: "#98948a", line: "rgba(90,86,78,.45)" },
};
function drawRocket(c, o, tier, pos) {
  const gx = pos ? pos.gx : 9.3, gy = pos ? pos.gy : 4.3; // 右手前の区画(発射台)。posはtierストリップ用の上書き
  shadowPatch(c, o, gx - 0.25, gy - 0.25, 1.5, 1.5);
  isoBox(c, o, gx - 0.25, gy - 0.25, 1.5, 1.5, 6, RKT.pad); // 発射台(円形の代わりの低い台)
  const m = iso(gx + 0.5, gy + 0.5, o), base = m.y - 6;
  if (tier === 1) { // 部品置き場: ノーズコーンと外板が置いてある
    isoBox(c, o, gx - 0.05, gy + 0.15, 0.5, 0.5, 14, RKT.hull);
    isoBox(c, o, gx + 0.62, gy + 0.5, 0.62, 0.35, 8, RKT.hull);
    c.fillStyle = RKT.tip; const t = iso(gx + 0.45, gy - 0.02, o); // ノーズコーン(転がしてある)
    c.beginPath(); c.moveTo(t.x, t.y - 3); c.lineTo(t.x + 14, t.y - 8); c.lineTo(t.x + 2, t.y - 15); c.closePath(); c.fill();
    return;
  }
  const H = 118; // 塔の高さ
  if (tier === 2) { // 骨組み: 細い柱4本+横桟
    c.strokeStyle = RKT.scaffold; c.lineWidth = 2;
    const corners = [iso(gx + 0.14, gy + 0.14, o), iso(gx + 0.86, gy + 0.14, o), iso(gx + 0.86, gy + 0.86, o), iso(gx + 0.14, gy + 0.86, o)];
    for (const p of corners) { c.beginPath(); c.moveTo(p.x, p.y - 6); c.lineTo(p.x, p.y - 6 - H * 0.72); c.stroke(); }
    for (let i = 1; i <= 3; i++) { const y = 6 + (H * 0.72) * i / 3;
      c.beginPath(); c.moveTo(corners[0].x, corners[0].y - y); c.lineTo(corners[1].x, corners[1].y - y); c.lineTo(corners[2].x, corners[2].y - y); c.lineTo(corners[3].x, corners[3].y - y); c.closePath(); c.stroke(); }
    return;
  }
  // T3/T4: 白い機体(八角柱の代わりに縦長のisoBox+丸みは省略=遠景の塔)
  isoBox(c, o, gx + 0.2, gy + 0.2, 0.6, 0.6, H, RKT.hull);
  c.strokeStyle = "rgba(120,116,106,.35)"; c.lineWidth = 1; // 機体の継ぎ目
  for (const yy of [H * 0.35, H * 0.7]) { const a = iso(gx + 0.2, gy + 0.8, o), b = iso(gx + 0.8, gy + 0.8, o);
    c.beginPath(); c.moveTo(a.x, a.y - yy - 6); c.lineTo(b.x, b.y - yy - 6); c.stroke(); }
  if (tier >= 4) { // 完成: 琥珀の先端+フィン+窓
    const t = iso(gx + 0.5, gy + 0.5, o);
    c.fillStyle = RKT.tip;
    c.beginPath(); c.moveTo(t.x - 11, t.y - 6 - H + 2); c.lineTo(t.x + 11, t.y - 6 - H + 2); c.lineTo(t.x, t.y - 6 - H - 26); c.closePath(); c.fill();
    c.fillStyle = RKT.fin; // フィン(左右)
    const fL = iso(gx + 0.14, gy + 0.86, o), fR = iso(gx + 0.86, gy + 0.86, o);
    c.beginPath(); c.moveTo(fL.x, fL.y - 6); c.lineTo(fL.x - 12, fL.y + 2); c.lineTo(fL.x, fL.y - 34); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(fR.x, fR.y - 6); c.lineTo(fR.x + 12, fR.y + 2); c.lineTo(fR.x, fR.y - 34); c.closePath(); c.fill();
    c.fillStyle = "#9fc4d4"; c.beginPath(); c.arc(t.x, t.y - 6 - H * 0.78, 3.2, 0, 7); c.fill(); // 小窓
  } else { // T3: 未完の頂部(骨組みが少し残る)
    const t = iso(gx + 0.5, gy + 0.5, o);
    c.strokeStyle = RKT.scaffold; c.lineWidth = 2;
    c.beginPath(); c.moveTo(t.x - 8, t.y - 6 - H); c.lineTo(t.x - 8, t.y - 6 - H - 14); c.moveTo(t.x + 8, t.y - 6 - H); c.lineTo(t.x + 8, t.y - 6 - H - 14); c.stroke();
  }
}

// ---------------- 設備: 標本棚/記録(特性図鑑・Lore・鉱石標本) ----------------
// tier成長: T1 棚1つ → T2 標本瓶の列 → T3 資料棚+星図 → T4 記録の間。左壁沿い・静かな収蔵の気配。
const SHELF = {
  frame: { top: "#cfccc4", left: "#aaa69b", right: "#9a968c", line: "rgba(90,86,78,.45)" },
  board: "#b8b4a9", jar: "rgba(168,205,218,.55)", jarLid: "#9aa0a5",
  chart: "#2c3440", star: "#dfe8f0", chartLine: "rgba(160,190,215,.35)",
};
function shelfUnit(c, o, gx, gy, tiers) { // 左壁沿いの棚(NE面がこちらを向く)
  shadowPatch(c, o, gx, gy, 0.5, 1.1);
  const H = 66;
  isoBox(c, o, gx, gy, 0.5, 1.1, H, SHELF.frame);
  // 棚板(NE面に3段)と標本瓶
  for (let i = 1; i <= 3; i++) {
    const y = H * i / 3.6;
    const a = iso(gx + 0.5, gy + 0.06, o), b = iso(gx + 0.5, gy + 1.04, o);
    c.strokeStyle = SHELF.board; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(a.x, a.y - y); c.lineTo(b.x, b.y - y); c.stroke();
    if (tiers >= 2) for (let j = 0; j < 3 + (i % 2); j++) { // 標本瓶(小さな円筒)
      const p = iso(gx + 0.5, gy + 0.18 + j * 0.24, o);
      c.fillStyle = SHELF.jar; c.fillRect(p.x - 2.2, p.y - y - 8, 4.4, 8);
      c.fillStyle = SHELF.jarLid; c.fillRect(p.x - 2.2, p.y - y - 9.5, 4.4, 1.8);
    }
  }
}
function drawShelf(c, o, tier) {
  shelfUnit(c, o, 0.3, 4.6, tier);
  if (tier >= 4) shelfUnit(c, o, 0.3, 6.0, tier); // 記録の間=棚が並ぶ
  if (tier >= 3) { // 星図(左奥の壁に掛かる・静かな紺)
    const a = iso(0, 5.0, o), b = iso(0, 6.6, o);
    const w = { x: b.x - a.x, y: b.y - a.y };
    c.save();
    c.fillStyle = SHELF.chart;
    c.beginPath(); c.moveTo(a.x + 2, a.y - 72); c.lineTo(b.x + 2, b.y - 72); c.lineTo(b.x + 2, b.y - 30); c.lineTo(a.x + 2, a.y - 30); c.closePath(); c.fill();
    c.strokeStyle = SHELF.chartLine; c.lineWidth = 1; // 星座線(2本・説明しない)
    c.beginPath(); c.moveTo(a.x + 8, a.y - 62); c.lineTo(a.x + w.x * 0.4, a.y + w.y * 0.4 - 48); c.lineTo(a.x + w.x * 0.75, a.y + w.y * 0.75 - 58); c.stroke();
    c.fillStyle = SHELF.star;
    for (const [fx, fy] of [[0.12, -60], [0.4, -46], [0.75, -56], [0.55, -38], [0.88, -44], [0.25, -35]]) {
      c.beginPath(); c.arc(a.x + w.x * fx, a.y + w.y * fx + fy, 1.1, 0, 7); c.fill();
    }
    c.restore();
  }
}

// ---------------- 部屋 ----------------
function drawRoom(c, W, H, o, opts) {
  opts = opts || {};
  c.clearRect(0, 0, W, H);
  const bg = c.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#191d20"); bg.addColorStop(1, "#0e0c0b");
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const cols = opts.cols || LAB.cols, rows = opts.rows || LAB.rows;
  const A = iso(0, 0, o), B = iso(cols, 0, o), D = iso(0, rows, o);
  if (!opts.noWall) {
    poly(c, [{ x: A.x, y: A.y - LAB.wallH }, { x: B.x, y: B.y - LAB.wallH }, B, A], LAB.wall);
    poly(c, [{ x: A.x, y: A.y - LAB.wallH }, { x: D.x, y: D.y - LAB.wallH }, D, A], LAB.wallDk);
    c.strokeStyle = LAB.wallBase; c.lineWidth = 2;
    c.beginPath(); c.moveTo(D.x, D.y); c.lineTo(A.x, A.y); c.lineTo(B.x, B.y); c.stroke();
    c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(D.x, D.y - LAB.wallH); c.lineTo(A.x, A.y - LAB.wallH); c.lineTo(B.x, B.y - LAB.wallH); c.stroke();
  }
  for (let s = 0; s <= cols + rows - 2; s++) // 奥→手前(painter's)
    for (let gx = 0; gx < cols; gx++) { const gy = s - gx; if (gy < 0 || gy >= rows) continue;
      const p0 = iso(gx, gy, o), p1 = iso(gx + 1, gy, o), p2 = iso(gx + 1, gy + 1, o), p3 = iso(gx, gy + 1, o);
      poly(c, [p0, p1, p2, p3], (gx + gy) % 2 === 0 ? LAB.tile : LAB.tileAlt, LAB.seam, 1);
    }
  const C2 = iso(cols, rows, o);
  c.strokeStyle = LAB.tileEdge; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(B.x, B.y); c.lineTo(C2.x, C2.y); c.lineTo(D.x, D.y); c.stroke();
  // 設備(奥→手前の順で描く)
  if (opts.aqua) drawAqua(c, o, opts.aqua);
  if (opts.desks) drawDesks(c, o, opts.desks);
  if (opts.shelf) drawShelf(c, o, opts.shelf);
  if (opts.rocket) drawRocket(c, o, opts.rocket, opts.rocketPos);
  if (!opts.noLight) {
    const M = iso(cols / 2, rows / 2, o);
    const g = c.createRadialGradient(M.x, M.y, 10, M.x, M.y, 190);
    g.addColorStop(0, LAB.light); g.addColorStop(1, "rgba(210,225,235,0)");
    c.fillStyle = g; c.beginPath(); c.ellipse(M.x, M.y, 210, 105, 0, 0, 7); c.fill();
  }
  if (!opts.noVig) {
    const v = c.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${LAB.vig})`);
    c.fillStyle = v; c.fillRect(0, 0, W, H);
  }
}

// ---------------- メイン(最大tier)+tier成長ストリップ ----------------
const cv = document.getElementById("lab"), ctx = cv.getContext("2d");
const ROOM_OPTS = { desks: 4, aqua: 4, shelf: 4, rocket: 4 };
drawRoom(ctx, cv.width, cv.height, { x: LAB.originX, y: LAB.originY }, ROOM_OPTS);
// fps実測(設備込みフル再描画 / 事前描画+1blit)
const N = 300;
let t0 = performance.now();
for (let i = 0; i < N; i++) drawRoom(ctx, cv.width, cv.height, { x: LAB.originX, y: LAB.originY }, ROOM_OPTS);
const fullMs = (performance.now() - t0) / N;
const off = document.createElement("canvas"); off.width = cv.width; off.height = cv.height;
drawRoom(off.getContext("2d"), cv.width, cv.height, { x: LAB.originX, y: LAB.originY }, ROOM_OPTS);
t0 = performance.now();
for (let i = 0; i < N; i++) ctx.drawImage(off, 0, 0);
const blitMs = (performance.now() - t0) / N;
drawRoom(ctx, cv.width, cv.height, { x: LAB.originX, y: LAB.originY }, ROOM_OPTS);
const msg = `fps実測(設備込み・${N}平均): フル再描画=${(1000 / fullMs).toFixed(0)}fps / 事前描画+1blit=${(1000 / blitMs).toFixed(0)}fps`;
console.log("[HQLAB] " + msg);
ctx.fillStyle = "#c9b8a2"; ctx.font = "12px system-ui"; ctx.fillText(msg, 16, 604);

// tier成長ストリップ(設備ごと): 小部屋(6×5タイル)で T1→T4 を並べる
function addStrip(title, key, caps, opt) {
  opt = opt || {};
  const wrap = document.getElementById("strips");
  const h2 = document.createElement("h2"); h2.textContent = title; wrap.appendChild(h2);
  const row = document.createElement("div"); row.className = "strip"; wrap.appendChild(row);
  for (let t = 1; t <= 4; t++) {
    const fig = document.createElement("figure");
    const c2 = document.createElement("canvas"); c2.width = 240; c2.height = 220;
    const o2 = { x: 120 + (opt.shiftX || 0), y: 60 + (opt.shiftY || 0) };
    const opts = Object.assign({ cols: 6, rows: 5, noVig: true, noLight: true }, opt.extra || {}); opts[key] = t;
    drawRoom(c2.getContext("2d"), 240, 220, o2, opts);
    const cap = document.createElement("figcaption"); cap.textContent = caps[t - 1];
    fig.appendChild(c2); fig.appendChild(cap); row.appendChild(fig);
  }
}
addStrip("パソコンデスク群(研究) — tier成長", "desks", ["T1 机1+端末1", "T2 3台の島", "T3 多面モニタの解析卓", "T4 サーバーラック併設"]);
addStrip("実験用水槽(合成の場) — tier成長", "aqua", ["T1 小さなガラス水槽", "T2 培養槽+配管", "T3 錬成槽(深紅の光)", "T4 複数槽の実験区画"], { shiftX: -220 });
addStrip("標本棚/記録(特性図鑑・Lore) — tier成長", "shelf", ["T1 棚1つ", "T2 標本瓶の列", "T3 資料棚+星図", "T4 記録の間"], { shiftX: 60, extra: { noWall: false } });
addStrip("ロケット(クリア目標) — tier成長", "rocket", ["T1 部品置き場", "T2 骨組み", "T3 機体", "T4 完成(発射可能)"], { shiftY: 30, extra: { rocketPos: { gx: 2.2, gy: 2.2 } } });
</script>
