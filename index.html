<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トカゲコロニー 〜蛇を倒して、最強のコロニーを作れ！〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=M+PLUS+Rounded+1c:wght@700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div id="brand">
    <div class="logo"><svg class="icon"><use href="#i-lizard"/></svg></div>
    <h1>トカゲコロニー<small>LIZARD COLONY</small></h1>
  </div>
  <div class="res" data-tip="コイン — トカゲが毎秒生産。購入/繁殖/設備に使う"><span class="ricon coin">G</span><b id="ui-coins">0</b><small id="ui-cps">+0/秒</small></div>
  <div class="res" data-tip="コオロギ — 餌。与えるとXPになり成長する"><span class="ricon cricket"><svg class="icon"><use href="#i-cricket"/></svg></span><b id="ui-crickets">0</b></div>
  <div class="res" data-tip="ジェム — 即時孵化・即回復・レア卵に使う希少通貨"><span class="ricon gem"><svg class="icon"><use href="#i-gem"/></svg></span><b id="ui-gems">0</b></div>
  <nav>
    <button id="btn-hq"><svg class="icon"><use href="#i-hq"/></svg> 本部</button>
    <button id="btn-dex"><svg class="icon"><use href="#i-dex"/></svg> 図鑑</button>
    <button id="btn-missions"><svg class="icon"><use href="#i-mission"/></svg> ミッション<span id="mission-badge" class="badge hidden">!</span></button>
    <button id="btn-stats"><svg class="icon"><use href="#i-stats"/></svg> 統計</button>
    <button id="btn-settings"><svg class="icon"><use href="#i-settings"/></svg> 設定</button>
  </nav>
</header>

<div id="stage-bar"></div>

<main>
  <aside id="left">
    <div class="card">
      <h3>ショップ / 行動</h3>
      <button id="btn-buy10" class="act"><span class="bicon"><svg class="icon"><use href="#i-cricket"/></svg></span><span class="lbl">コオロギ ×10<small>トカゲの餌</small></span><span class="price">100G</span></button>
      <button id="btn-buy100" class="act"><span class="bicon"><svg class="icon"><use href="#i-cricket"/></svg></span><span class="lbl">コオロギ ×100<small>まとめ買い</small></span><span class="price">1,000G</span></button>
      <button id="btn-autosupply" class="act hidden"><span class="bicon"><svg class="icon"><use href="#i-auto"/></svg></span><span class="lbl">自動補給: OFF<small>R100で解禁</small></span></button>
      <button id="btn-feedall" class="act cta"><span class="bicon"><svg class="icon"><use href="#i-feed"/></svg></span><span class="lbl">一括餌やり<small>全員に1匹ずつ</small></span></button>
      <button id="btn-breed" class="act cta"><span class="bicon"><svg class="icon"><use href="#i-breed"/></svg></span><span class="lbl">繁殖する<small>アダルト2匹で卵を作る</small></span></button>
      <button id="btn-fac" class="act"><span class="bicon"><svg class="icon"><use href="#i-build"/></svg></span><span class="lbl">設備<small>コロニーを強化</small></span></button>
      <button id="btn-allies" class="act"><span class="bicon"><svg class="icon"><use href="#i-paw"/></svg></span><span class="lbl">味方<small>特別な仲間たち</small></span></button>
      <button id="btn-nest" class="act"><span class="bicon"><svg class="icon"><use href="#i-nestweb"/></svg></span><span class="lbl">巣ネットワーク<small>放置で勝手に育つ</small></span><span id="nest-badge" class="badge hidden">!</span></button>
      <button id="btn-merchant" class="act hidden"><span class="bicon"><svg class="icon"><use href="#i-merchant"/></svg></span><span class="lbl">放浪商人<small>期間限定ショップ!</small></span></button>
    </div>
    <div class="card">
      <h3><svg class="icon"><use href="#i-egg"/></svg> 卵スロット</h3>
      <div id="egg-slots"></div>
    </div>
  </aside>

  <section id="center">
    <div id="frame"><canvas id="game" width="1280" height="720"></canvas></div>
    <div id="raid-banner" class="hidden"></div>
    <div id="detail" class="hidden"></div>
  </section>

  <aside id="right">
    <div class="card" id="raid-card">
      <h3><svg class="icon"><use href="#i-snake"/></svg> 襲撃予告</h3>
      <div id="raid-timer">--:--</div>
      <div id="next-boss" class="hidden"></div>
      <button id="btn-raid-now" class="danger"><svg class="icon"><use href="#i-snake"/></svg> 今すぐ襲来!</button>
    </div>
    <div class="card">
      <h3><svg class="icon"><use href="#i-shelter"/></svg> コロニー</h3>
      <div class="rowline"><span><svg class="icon"><use href="#i-hq"/></svg> HQ Lv</span> <b id="ui-rank">1</b></div>
      <div class="bar"><div id="rank-bar"></div></div>
      <div class="rowline">トカゲ数 <b id="ui-pop">0/10</b></div>
      <div class="rowline clickable" id="row-stage" tabindex="0" role="button" title="タップで惑星マップ"><span><svg class="icon"><use href="#i-planet"/></svg> 惑星 <span class="planet-dot"></span></span> <b id="ui-stage">乾燥地帯</b> <span class="chev">▸</span></div>
      <div class="rowline">撃退数 <b id="ui-wins">0</b></div>
      <div class="sep"></div>
      <div class="rowline" data-tip="餌やり/孵化/繁殖で蓄積 — 味方Lvや研究の材料"><span><svg class="icon"><use href="#i-bio"/></svg> 生態データ</span> <b id="ui-res-bio">0</b></div>
      <div class="rowline" data-tip="餌場が毎秒生産 — 自動給餌が消費"><span><svg class="icon"><use href="#i-food"/></svg> 食料供給</span> <b id="ui-res-food">0</b></div>
      <div class="rowline" data-tip="惑星開発Lvが毎秒生産 — 研究の材料"><span><svg class="icon"><use href="#i-energy"/></svg> エネルギー</span> <b id="ui-res-energy">0</b></div>
      <div class="rowline" data-tip="ボス撃破や生態データ変換で獲得 — HQ研究に使う"><span><svg class="icon"><use href="#i-science"/></svg> 研究力</span> <b id="ui-res-science">0</b></div>
      <div class="sep"></div>
      <div class="rowline" data-tip="バガーの侵食(全惑星共通) — 毎日ログインで-40"><span><svg class="icon"><use href="#i-erosion"/></svg> 侵食率</span> <b id="ui-invasion">0%</b></div>
      <div class="rowline clickable" id="row-title" tabindex="0" role="button" title="タップで称号変更"><span><svg class="icon"><use href="#i-medal"/></svg> 称号</span> <b id="ui-title">-</b> <span class="chev">▸</span></div>
    </div>
    <div class="card">
      <h3><svg class="icon"><use href="#i-hint"/></svg> ヒント</h3>
      <div class="hint-text" id="ui-hint">トカゲをクリックすると詳細が見られます。餌をあげて育てよう!</div>
    </div>
  </aside>
</main>

<div id="modal" class="hidden">
  <div id="modal-box">
    <header><h2 id="modal-title"></h2><button id="modal-close">×</button></header>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/motion.js"></script>
<script src="js/ui/hero/hero.js"></script>
<script src="js/ui/hero/nest-reveal.js"></script>
<script src="js/ui/hero/boss.js"></script>
<script src="js/ui/hero/meteorite.js"></script>
<script src="js/ui/hero/rocket.js"></script>
<script src="js/ui/hero/legend.js"></script>
<script src="js/ui/screens/main.js"></script>
<script src="js/ui/screens/breeding.js"></script>
<script src="js/ui/screens/equipment.js"></script>
<script src="js/ui/screens/planet-map.js"></script>
<script src="js/ui/screens/nest.js"></script>
<script src="js/ui/screens/hq.js"></script>
<script src="js/ui/screens/dex.js"></script>
<script src="js/ui/screens/meta.js"></script>
<script src="js/ui/boot.js"></script>
</body>
</html>
