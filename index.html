<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トカゲコロニー｜遺伝子パチンコ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232c2010'/%3E%3Cg stroke='%237bd986' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 13c3 0 4.5-3 8-3 2.5 0 4 .8 5.5 2.2L21 14l-3 1c-1.6 1.6-3.4 2.5-6 2.5-3.5 0-5-3-8-4.5z' fill='%237bd986'/%3E%3Cpath d='M8 17.5 7 20M13 18l1 2.5M19.5 12.5c.8-1.6.8-3.4 0-5' fill='none'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css?v=c7f55915">
<link rel="stylesheet" href="style.css?v=895abd9e">
<link rel="stylesheet" href="secondary.css?v=1af99e8b">
<link rel="stylesheet" href="pachinko.css?v=171563d1">
</head>
<body class="cabinet-ui">

<header id="topbar">
  <h1 class="visually-hidden">トカゲコロニー</h1>
  <div class="wallet" aria-label="保有資源">
    <div class="res" data-tip="コイン" aria-label="コイン"><span class="ricon coin"><svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg></span><b id="ui-coins">0</b><small id="ui-cps">+0/秒</small></div>
    <div class="res" data-tip="コオロギ" aria-label="コオロギ"><span class="ricon cricket"><svg class="icon" aria-hidden="true"><use href="#i-cricket"/></svg></span><b id="ui-crickets-top">0</b></div>
    <div class="res" data-tip="ジェム" aria-label="ジェム"><span class="ricon gem"><svg class="icon" aria-hidden="true"><use href="#i-gem"/></svg></span><b id="ui-gems">0</b></div>
    <div class="res" data-tip="アメジスト" aria-label="アメジスト"><span class="ricon amethyst"><svg class="icon" aria-hidden="true"><use href="#i-amethyst"/></svg></span><b id="ui-amethyst">0</b></div>
    <div class="res" data-tip="賢者の石" aria-label="賢者の石"><span class="ricon stone"><svg class="icon" aria-hidden="true"><use href="#i-stone"/></svg></span><b id="ui-stones">0</b></div>
  </div>
  <div id="hq-bar" title="本部レベルと進行度">
    <div id="rank-bar"></div>
    <span id="hq-bar-label">HQ Lv<b id="ui-rank">1</b></span>
  </div>
  <details id="game-menu">
    <summary aria-label="ゲームメニュー" title="ゲームメニュー"><span class="menu-lines" aria-hidden="true"></span></summary>
    <nav aria-label="ゲームメニュー">
      <button id="btn-map"><svg class="icon" aria-hidden="true"><use href="#i-planet"/></svg>マップ<span id="map-badge" class="badge hidden">!</span></button>
      <button id="btn-hq"><svg class="icon" aria-hidden="true"><use href="#i-hq"/></svg>本部<span id="hq-badge" class="badge hidden">!</span></button>
      <button id="btn-dex"><svg class="icon" aria-hidden="true"><use href="#i-dex"/></svg>図鑑<span id="dex-badge" class="badge hidden">!</span></button>
      <button id="btn-missions"><svg class="icon" aria-hidden="true"><use href="#i-mission"/></svg>ミッション<span id="mission-badge" class="badge hidden">!</span></button>
      <button id="btn-stats"><svg class="icon" aria-hidden="true"><use href="#i-stats"/></svg>統計<span id="stats-badge" class="badge hidden">!</span></button>
      <button id="btn-settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>設定</button>
    </nav>
  </details>
</header>

<main class="colony-page" aria-label="飼育槽と遺伝子パチンコ">
  <section class="colony-live" aria-label="ライブ飼育槽">
    <header class="instrument-head">
      <div class="instrument-name">
        <svg class="icon" aria-hidden="true"><use href="#i-planet"/></svg>
        <h2 id="pachi-stage-name">飼育槽</h2>
      </div>
      <div class="colony-meter">
        <button id="residents-toggle" type="button" aria-controls="resident-list" aria-expanded="true" title="飼育中の個体を選ぶ" aria-label="飼育中の個体を選ぶ"><svg class="icon" aria-hidden="true"><use href="#i-lizardLogo"/></svg><b id="pachi-population"></b></button>
        <span title="卵と卵スロット" aria-label="卵と卵スロット"><svg class="icon" aria-hidden="true"><use href="#i-egg"/></svg><b id="pachi-egg-count"></b></span>
      </div>
    </header>
    <div id="center">
      <div id="frame" tabindex="-1" aria-label="トカゲの飼育槽と防衛">
        <canvas id="game" width="1280" height="720" aria-label="飼育槽。トカゲを選んで個体情報を表示"></canvas>
        <button id="habitat-fullscreen" type="button" aria-label="飼育槽を全画面表示" title="飼育槽を全画面表示" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        </button>
        <div id="toasts"></div>
      </div>
      <div id="detail" class="hidden"></div>
    </div>
    <div class="habitat-deck">
      <div id="left" role="group" aria-label="飼育操作">
        <button id="btn-cricket" class="deck-button" type="button" title="コオロギを購入。長押しで連続購入">
          <svg class="icon" aria-hidden="true"><use href="#i-cricket"/></svg><span>餌を買う<small id="cricket-lot-lbl"></small></span>
        </button>
        <button id="btn-fac" class="deck-button" type="button" title="飼育設備"><svg class="icon" aria-hidden="true"><use href="#i-build"/></svg>設備</button>
        <button id="btn-breed-menu" class="deck-button" type="button" title="繁殖ペアを選ぶ"><svg class="icon" aria-hidden="true"><use href="#i-breed"/></svg>繁殖</button>
      </div>
      <div id="pachi-raid-card" class="raid-meter" aria-label="襲来予告">
        <svg class="icon" aria-hidden="true"><use href="#i-snake"/></svg>
        <div class="raid-readout"><span id="pachi-raid-name"></span><strong id="pachi-raid-timer">--:--</strong></div>
        <button id="pachi-raid-action" type="button">呼ぶ</button>
        <span id="pachi-guard"></span>
      </div>
    </div>
    <div id="resident-list" role="group" aria-label="飼育中の個体"></div>
  </section>

  <section id="pachi-dashboard" class="pachi-cabinet" aria-labelledby="pachi-heading">
    <header class="instrument-head">
      <div class="instrument-name"><svg class="icon" aria-hidden="true"><use href="#i-energy"/></svg><h2 id="pachi-heading">遺伝子パチンコ</h2></div>
      <span id="pachi-mode" class="pachi-mode">待機中</span>
    </header>
    <div class="pachi-machine">
      <canvas id="crank-roulette-canvas" role="img" aria-label="外周の発射レール、回転分岐、折り返し通路、入賞口を備えたパチンコ盤"></canvas>
    </div>
    <div class="machine-deck">
      <div class="crank-station">
        <span class="crank-label" aria-hidden="true">給餌・発射</span>
        <div id="crank-dock" role="group" aria-label="給餌・発射操作"></div>
      </div>
      <dl class="pachi-combo"><div><dt>着地</dt><dd id="pachi-total">0</dd></div><div><dt>連続入賞</dt><dd id="pachi-streak">0</dd></div></dl>
      <div id="slit-device" title="四重スリット実験装置" aria-label="四重スリット実験装置"><canvas id="slit-canvas"></canvas></div>
    </div>
    <div class="pachi-result" id="pachi-result" role="status"><strong id="pachi-result-title"></strong></div>
  </section>
</main>

<!-- 本部=研究施設ページ(hq_lab.md)。飼育槽<main>と切替(topbarは常に残す=資源が見える)。1画面固定・スクロールなし -->
<section id="hqlab" class="hidden">
  <header id="hqlab-head">
    <button id="hqlab-back">← 飼育槽へ戻る</button>
    <h2><svg class="icon"><use href="#i-hq"/></svg> 本部 — 研究施設</h2>
    <span id="hqlab-lv"></span>
  </header>
  <!-- P3-2(2026-08-11 Ric承認): 本部指令帯。実データのみ・2行上限・クリック=宇宙港(詳細への導線) -->
  <div id="hq-directive" title="宇宙港を開く"></div>
  <div id="hqlab-wrap"><canvas id="hqlab-canvas" width="1000" height="620"></canvas></div>
</section>

<!-- V6-P2-1: 巣ネットワーク=独立ページ(本部#hqlabの様式を踏襲)。機能は閲覧専用のまま=表示層と導線のみ -->
<section id="nestpage" class="hidden">
  <header id="nestpage-head">
    <button id="nestpage-back">← 飼育槽へ戻る</button>
    <h2>巣ネットワーク</h2>
    <span id="nestpage-sub">全惑星共通の遺伝子ネットワーク — 閲覧専用</span>
  </header>
  <div id="nestpage-row"><div id="nestpage-body"></div></div>
</section>

<div id="modal" class="hidden">
  <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button id="modal-close" type="button" aria-label="閉じる">×</button></header>
    <div id="modal-body"></div>
  </div>
</div>
