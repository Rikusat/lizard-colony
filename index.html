<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トカゲコロニー 〜蛇を倒して、最強のコロニーを作れ！〜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232c2010'/%3E%3Cg stroke='%237bd986' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 13c3 0 4.5-3 8-3 2.5 0 4 .8 5.5 2.2L21 14l-3 1c-1.6 1.6-3.4 2.5-6 2.5-3.5 0-5-3-8-4.5z' fill='%237bd986'/%3E%3Cpath d='M8 17.5 7 20M13 18l1 2.5M19.5 12.5c.8-1.6.8-3.4 0-5' fill='none'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=M+PLUS+Rounded+1c:wght@700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="tokens.css?v=2b0f44e7">
<link rel="stylesheet" href="style.css?v=d5742704">
</head>
<body>

<header id="topbar">
  <div id="brand">
    <div class="logo"><svg class="icon"><use href="#i-lizardLogo"/></svg></div>
    <h1>トカゲコロニー<small>LIZARD COLONY</small></h1>
  </div>
  <div class="res" data-tip="コイン — トカゲが毎秒生産。購入/繁殖/設備に使う"><span class="ricon coin">G</span><b id="ui-coins">0</b><small id="ui-cps">+0/秒</small></div>
  <div class="res" data-tip="コオロギ — 餌の在庫(全コロニー共通)。給餌で消費・左メニューで購入"><span class="ricon cricket"><svg class="icon"><use href="#i-cricket"/></svg></span><b id="ui-crickets-top">0</b></div>
  <div class="res" data-tip="ジェム — 即時孵化・即回復・レア卵に使う希少通貨"><span class="ricon gem"><svg class="icon"><use href="#i-gem"/></svg></span><b id="ui-gems">0</b></div>
  <div class="res" data-tip="賢者の石 — 四重スリット実験装置でごく稀に得られる最上位の希少物質（保有中・用途は今後）"><span class="ricon stone"><svg class="icon"><use href="#i-stone"/></svg></span><b id="ui-stones">0</b></div>
  <nav>
    <button id="btn-map"><svg class="icon"><use href="#i-planet"/></svg> マップ<span id="map-badge" class="badge hidden">!</span></button>
    <button id="btn-hq"><svg class="icon"><use href="#i-hq"/></svg> 本部<span id="hq-badge" class="badge hidden">!</span></button>
    <button id="btn-dex"><svg class="icon"><use href="#i-dex"/></svg> 図鑑<span id="dex-badge" class="badge hidden">!</span></button>
    <button id="btn-missions"><svg class="icon"><use href="#i-mission"/></svg> ミッション<span id="mission-badge" class="badge hidden">!</span></button>
    <button id="btn-stats"><svg class="icon"><use href="#i-stats"/></svg> 統計<span id="stats-badge" class="badge hidden">!</span></button>
    <button id="btn-settings"><svg class="icon"><use href="#i-settings"/></svg> 設定</button>
  </nav>
</header>

<!-- 3.10.4: HQレベル=ヘッダー直下のプログレスバー(惑星アクセント色・太め・数値レス) -->
<div id="hq-bar" title="HQレベル — 全惑星の成果で伸びる恒久バフ">
  <div id="rank-bar"></div>
  <span id="hq-bar-label"><svg class="icon"><use href="#i-hq"/></svg> HQ Lv<b id="ui-rank">1</b></span>
</div>

<main>
  <!-- 3.13(再): C3全画面化をやめ2カラムへ復帰(左=操作卓)。空白より意味のある列(Ric判断)。
       操作卓は「コオロギ購入・設備」のみ(遺伝子ルーレットはボス討伐後の報酬モーダル=左に常設しない)。
       カードの見やすさ(アイコン+名称+数値)は維持 -->
  <aside id="left">
    <div class="card">
      <h3>操作卓</h3>
      <button id="btn-cricket" class="ft-card" title="コオロギ購入(まとめ買い / 長押しで連続)">
        <svg class="icon"><use href="#i-cricket"/></svg>
        <span class="ft-txt"><b>コオロギ購入</b><small id="cricket-lot-lbl">まとめ買い</small></span>
      </button>
      <button id="btn-fac" class="ft-card" title="設備 — コロニーを強化">
        <svg class="icon"><use href="#i-build"/></svg>
        <span class="ft-txt"><b>設備</b><small>コロニーを強化</small></span>
      </button>
    </div>
    <!-- 四重スリット実験的瞬間遺伝決定装置(roulette.md §9): 左メニュー下部の極小窓・線のみ・
         クランク稼働で作動(クールダウン~10s)・全通過=賢者の石(滅多に起きない奇跡)・失敗球は痕跡として張り付く -->
    <div id="slit-device" title="四重スリット実験装置 — クランク稼働時にごく稀に作動。全ての切れ目を通れば賢者の石">
      <canvas id="slit-canvas"></canvas>
    </div>
  </aside>

  <section id="center">
    <div id="frame">
      <canvas id="game" width="1280" height="720"></canvas>
      <!-- 3.10.3: 襲撃予告=飼育槽右上のコンパクト半透明HUD(生き物の動きを隠さない) -->
      <div id="raid-hud">
        <div class="rh-line"><svg class="icon"><use href="#i-snake"/></svg><span id="raid-timer">--:--</span></div>
        <div id="next-boss" class="hidden"></div>
        <button id="btn-raid-now" class="danger" title="今すぐ襲来（報酬狙いの前倒し）"><svg class="icon"><use href="#i-snake"/></svg> 今すぐ襲来</button>
      </div>
      <!-- 3.11: トーストは飼育槽上部中央から下へスライドイン(スマホ通知の作法) -->
      <div id="toasts"></div>
    </div>
    <div id="raid-banner" class="hidden"></div>
    <div id="detail" class="hidden"></div>
  </section>
</main>

<!-- 本部=研究施設ページ(hq_lab.md)。飼育槽<main>と切替(topbarは常に残す=資源が見える)。1画面固定・スクロールなし -->
<section id="hqlab" class="hidden">
  <header id="hqlab-head">
    <button id="hqlab-back">← 飼育槽へ戻る</button>
    <h2><svg class="icon"><use href="#i-hq"/></svg> 本部 — 研究施設</h2>
    <span id="hqlab-lv"></span>
  </header>
  <div id="hqlab-wrap"><canvas id="hqlab-canvas" width="1000" height="620"></canvas></div>
</section>

<div id="modal" class="hidden">
  <div id="modal-box">
    <header><h2 id="modal-title"></h2><button id="modal-close">×</button></header>
    <div id="modal-body"></div>
  </div>
</div>
