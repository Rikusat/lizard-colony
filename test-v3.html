<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3 UI テスト(開発用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=M+PLUS+Rounded+1c:wght@700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">

<style>
/* ==== ボタン造形ラボ(選定用モック・本体未反映) ==== */
#btn-lab-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.blab-col h4 { font-family: var(--font-display); color: var(--gold); font-size: 14px; margin-bottom: 4px; }
.blab-col p { font-size: 11px; color: var(--sub); line-height: 1.6; margin-bottom: 12px; min-height: 48px; }
.blab-col .grp { font-size: 10px; color: var(--sub); letter-spacing: 2px; margin: 10px 0 4px; }
.blab { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 10px 12px; margin-bottom: 8px; font-size: 14px; color: var(--text); cursor: pointer; }
.blab .bic { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.blab .bic .icon { width: 20px; height: 20px; }
.blab .lb { flex: 1; line-height: 1.2; }
.blab .lb small { display: block; font-size: 10px; color: var(--sub); }
.blab .pr { font-size: 12px; font-weight: bold; color: var(--gold); white-space: nowrap; }

/* ---- 案A: 彫り込みの据え物(立体・彫刻) ---- */
.blab.a {
  border-radius: 12px;
  background:
    linear-gradient(178deg, #5a4526, #3a2c16 45%, #2a1f10);
  border: 1px solid #6d5636;
  border-top-color: #8a7146;
  border-bottom: 4px solid #171008;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -6px 10px rgba(0,0,0,.35), var(--elev-2);
}
.blab.a .bic {
  border-radius: 50%;
  background: radial-gradient(circle at 38% 30%, #241a0e, #171008);
  box-shadow: inset 0 2px 5px rgba(0,0,0,.9), inset 0 -1px 0 rgba(255,255,255,.14);
  color: var(--amber-400);
}
.blab.a .lb { text-shadow: 0 1px 0 rgba(0,0,0,.8); }
.blab.a .pr { background: rgba(0,0,0,.45); border-radius: 6px; padding: 3px 8px; box-shadow: inset 0 1px 3px rgba(0,0,0,.8); }
.blab.a.cta {
  background: linear-gradient(178deg, #74c47e, #3f9e4b 45%, #2c7a37);
  border-color: #8fdc9a; border-top-color: #b9f0c0; border-bottom-color: #123a1a;
  color: var(--on-life);
}
.blab.a.cta .bic { background: radial-gradient(circle at 38% 30%, #1d4a25, #10300f); color: var(--life-400); }
.blab.a.cta .lb small { color: #0F2E14; opacity: .7; }
.blab.a.shop {
  background: linear-gradient(178deg, #d9b34a, #a8821e 45%, #7c5f12);
  border-color: #f0d276; border-top-color: #ffe9a8; border-bottom-color: #3a2a05;
  color: var(--on-amber);
}
.blab.a.shop .bic { background: radial-gradient(circle at 38% 30%, #4a3808, #2e2204); color: var(--amber-400); }
.blab.a.shop .lb small { color: var(--on-amber); opacity: .65; }
.blab.a.shop .pr { color: #ffe9a8; }
.blab-sw.a {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
  background: linear-gradient(178deg, #3a2c16, #241a0e); border: 1px solid #6d5636; border-bottom: 3px solid #171008;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.15); font-size: 12px; color: var(--sub); cursor: pointer;
}
.blab-sw.a .kn { width: 30px; height: 16px; border-radius: 999px; background: #171008;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.9); position: relative; }
.blab-sw.a .kn::after { content: ""; position: absolute; top: 1px; left: 15px; width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #7bd986, #3e9e49); box-shadow: 0 0 8px var(--life-glow); }
.blab-sw.a.on { color: var(--life-400); }

/* ---- 案B: 操作卓モジュール(メカ・計器) ---- */
.blab.b {
  border-radius: 6px; position: relative;
  background: linear-gradient(90deg, #241a0e 0, #241a0e 6px, transparent 6px), linear-gradient(#443216, #2c2010);
  border: 1px solid #554020;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.12), inset -1px -1px 0 rgba(0,0,0,.5), var(--elev-1);
}
.blab.b::before, .blab.b::after {
  content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #a88d54, #4a3818); box-shadow: inset 0 -1px 1px rgba(0,0,0,.7);
  right: 5px;
}
.blab.b::before { top: 5px; }
.blab.b::after { bottom: 5px; }
.blab.b .bic {
  border-radius: 4px; background: #171008; color: var(--sub);
  box-shadow: inset 0 1px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.07);
  border-left: 3px solid var(--ink-600);
}
.blab.b .pr { font-family: var(--font-retro); background: #10130a; border: 1px solid #2c3316; border-radius: 3px; padding: 3px 7px; color: #b9e06a; }
.blab.b.cta { border-color: var(--life-600); box-shadow: inset 1px 1px 0 rgba(255,255,255,.12), inset -1px -1px 0 rgba(0,0,0,.5), 0 0 10px rgba(123,217,134,.12), var(--elev-1); }
.blab.b.cta .bic { color: var(--life-400); border-left-color: var(--life-500); box-shadow: inset 0 1px 4px rgba(0,0,0,.9), 0 0 8px rgba(123,217,134,.25); }
.blab.b.cta .lb b { color: var(--life-400); }
.blab.b.shop .bic { color: var(--amber-400); border-left-color: var(--amber-500); }
.blab.b.shop .lb b { color: var(--amber-400); }
.blab-sw.b {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 4px;
  background: linear-gradient(#2c2010, #201709); border: 1px solid #554020; font-size: 12px; color: var(--sub); cursor: pointer;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.1);
}
.blab-sw.b .kn { width: 34px; height: 14px; border-radius: 3px; background: #10130a; position: relative;
  box-shadow: inset 0 1px 4px rgba(0,0,0,.9); }
.blab-sw.b .kn::after { content: ""; position: absolute; top: 2px; left: 20px; width: 12px; height: 10px; border-radius: 2px;
  background: linear-gradient(#8fdc9a, #3e9e49); box-shadow: 0 0 7px var(--life-glow); }
.blab-sw.b .lamp { width: 6px; height: 6px; border-radius: 50%; background: var(--life-400); box-shadow: 0 0 6px var(--life-glow); }

/* ---- 案C: 上質クラフト(革・手仕事) ---- */
.blab.c {
  border-radius: 16px;
  background:
    radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.07), transparent 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.05) 0 3px, transparent 3px 6px),
    linear-gradient(#4a3820, #33251190);
  background-color: #3a2c16;
  border: 2px solid #5d4930;
  outline: 1px dashed rgba(216,195,165,.35);
  outline-offset: -6px;
  box-shadow: 0 3px 0 #1d150a, var(--elev-1);
}
.blab.c .bic {
  border-radius: 12px; transform: rotate(-3deg);
  background: linear-gradient(#5a4526, #3a2c16); border: 1px solid #7c6340;
  box-shadow: 0 2px 0 #1d150a; color: var(--sand-200);
}
.blab.c .pr { background: #2a1f10; border: 1px dashed rgba(216,195,165,.4); border-radius: 999px; padding: 3px 9px; }
.blab.c.cta {
  background-color: #2f5a34;
  background-image: radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.12), transparent 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.06) 0 3px, transparent 3px 6px),
    linear-gradient(#57a862, #3c7d4590);
  border-color: #7fd98a; outline-color: rgba(15,46,20,.5);
  color: var(--on-life);
}
.blab.c.cta .bic { background: linear-gradient(#2c6a35, #1d4a25); border-color: #7fd98a; color: #d8f5dc; transform: rotate(3deg); }
.blab.c.cta .lb small { color: var(--on-life); opacity: .7; }
.blab.c.shop {
  background-color: #8a6c1e;
  background-image: radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.14), transparent 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.06) 0 3px, transparent 3px 6px),
    linear-gradient(#d9b34a, #a8821e90);
  border-color: #f0d276; outline-color: rgba(36,21,5,.45); color: var(--on-amber);
}
.blab.c.shop .bic { background: linear-gradient(#7c5f12, #4a3808); border-color: #f0d276; color: #ffe9a8; }
.blab.c.shop .lb small { color: var(--on-amber); opacity: .65; }
.blab.c.shop .pr { color: #ffe9a8; border-color: rgba(255,233,168,.5); }
.blab-sw.c {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
  background: linear-gradient(#4a3820, #332511); border: 2px solid #5d4930;
  box-shadow: 0 2px 0 #1d150a; font-size: 12px; color: var(--sub); cursor: pointer;
}
.blab-sw.c .kn { width: 32px; height: 16px; border-radius: 999px; background: #241a0e; border: 1px dashed rgba(216,195,165,.35); position: relative; }
.blab-sw.c .kn::after { content: ""; position: absolute; top: 0; left: 15px; width: 15px; height: 15px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe9a8, #c9a227); box-shadow: 0 1px 0 #1d150a; }
</style>

</head>
<body>
<!-- index.html と同じDOM構造をそのまま複製 -->
<header id="topbar">
  <div id="brand"><div class="logo"><svg class="icon"><use href="#i-lizard"/></svg></div><h1>トカゲコロニー<small>LIZARD COLONY</small></h1></div>
  <div class="res" data-tip="コイン — トカゲが毎秒生産。購入/繁殖/設備に使う"><span class="ricon coin">G</span><b id="ui-coins">0</b><small id="ui-cps">+0/秒</small></div>
  <div class="res"><span class="ricon cricket"><svg class="icon"><use href="#i-cricket"/></svg></span><b id="ui-crickets">0</b></div>
  <div class="res"><span class="ricon gem"><svg class="icon"><use href="#i-gem"/></svg></span><b id="ui-gems">0</b></div>
  <nav>
    <button id="btn-hq"> 本部</button><button id="btn-dex"> 図鑑</button>
    <button id="btn-missions"> ミッション<span id="mission-badge" class="badge hidden">!</span></button>
    <button id="btn-stats"> 統計</button><button id="btn-settings"> 設定</button>
  </nav>
</header>
<div id="stage-bar"></div>
<main>
  <aside id="left">
    <div class="card"><h3>操作卓</h3>
      <div class="btn-grp">行動</div>
      <button id="btn-buy10" class="act"><span class="bicon"></span><span class="lbl">コオロギ ×10<small>トカゲの餌</small></span><span class="price">100G</span></button>
      <button id="btn-buy100" class="act"><span class="bicon"></span><span class="lbl">コオロギ ×100<small>まとめ買い</small></span><span class="price">1,000G</span></button>
      <button id="btn-autosupply" class="act hidden"><span class="bicon"></span><span class="lbl">自動補給: OFF<small>R100で解禁</small></span></button>
      <button id="btn-breed" class="act cta"><span class="bicon"><svg class="icon"><use href="#i-breed"/></svg></span><span class="lbl">繁殖する<small>アダルト2匹で卵を作る</small></span></button>
      <div class="btn-grp gap">施設・仲間へ</div>
      <button id="btn-fac" class="act"><span class="bicon"></span><span class="lbl">設備<small>コロニーを強化</small></span></button>
      <button id="btn-allies" class="act"><span class="bicon"></span><span class="lbl">味方<small>特別な仲間たち</small></span></button>
      <button id="btn-nest" class="act"><span class="bicon"></span><span class="lbl">巣・探索<small>探索隊とツリー</small></span><span id="nest-badge" class="badge hidden">!</span></button>
      <button id="btn-merchant" class="act hidden"><span class="bicon"></span><span class="lbl">放浪商人<small>期間限定ショップ!</small></span></button>
    </div>
    <div class="card"><h3> 卵スロット</h3><div id="egg-slots"></div></div>
  </aside>
  <section id="center">
    <div id="frame"><canvas id="game" width="1280" height="720"></canvas></div>
    <div id="raid-banner" class="hidden"></div>
    <div id="detail" class="hidden"></div>
  </section>
  <aside id="right">
    <div class="card" id="raid-card"><h3> 襲撃予告</h3><div id="raid-timer">--:--</div><div id="next-boss" class="hidden"></div><button id="btn-raid-now" class="danger"> 今すぐ襲来!</button></div>
    <div class="card"><h3> コロニー</h3>
      <div class="rowline">ランク <b id="ui-rank">1</b></div><div class="bar"><div id="rank-bar"></div></div>
      <div class="rowline">トカゲ数 <b id="ui-pop">0/10</b></div>
      <div class="rowline clickable" id="row-stage"><span>ステージ <span class="planet-dot"></span></span> <b id="ui-stage">乾燥地帯</b> <span class="chev">▸</span></div>
      <div class="rowline">撃退数 <b id="ui-wins">0</b></div>
      <div class="rowline"><span><svg class="icon"><use href="#i-bio"/></svg> 生態データ</span> <b id="ui-res-bio">0</b></div>
      <div class="rowline"><span><svg class="icon"><use href="#i-food"/></svg> 食料供給</span> <b id="ui-res-food">0</b></div>
      <div class="rowline"><span><svg class="icon"><use href="#i-energy"/></svg> エネルギー</span> <b id="ui-res-energy">0</b></div>
      <div class="rowline"><span><svg class="icon"><use href="#i-science"/></svg> 研究力</span> <b id="ui-res-science">0</b></div>
      <div class="rowline" data-tip="バガーの侵食(全惑星共通) — 毎日ログインで-40"><span><svg class="icon"><use href="#i-erosion"/></svg> 侵食率</span> <b id="ui-invasion">0%</b></div>
      <div class="rowline clickable" id="row-title"> <b id="ui-title">-</b> <span class="chev">▸</span></div>
    </div>
    <div class="card"><h3> ヒント</h3><div class="hint-text" id="ui-hint">...</div></div>
  </aside>
</main>
<div id="modal" class="hidden"><div id="modal-box"><header><h2 id="modal-title"></h2><button id="modal-close">×</button></header><div id="modal-body"></div></div></div>
<div id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script>
// 豊かなV3状態を構築(セーブには触れない)
globalThis._noStart = true;
</script>
<script src="js/ui/core.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/motion.js"></script>
<script src="js/ui/hero/hero.js"></script>
<script src="js/ui/hero/nest-reveal.js"></script>
<script src="js/ui/hero/boss.js"></script>
<script src="js/ui/hero/meteorite.js"></script>
<script src="js/ui/hero/rocket.js"></script>
<script src="js/ui/hero/legend.js"></script>
<script src="js/ui/screens/main.js"></script>
<script src="js/ui/screens/feeder-skins.js"></script>
<script src="js/ui/screens/feeder.js"></script>
<script src="js/ui/screens/breeding.js"></script>
<script src="js/ui/screens/equipment.js"></script>
<script src="js/ui/screens/planet-map.js"></script>
<script src="js/ui/screens/nest.js"></script>
<script src="js/ui/screens/hq.js"></script>
<script src="js/ui/screens/dex.js"></script>
<script src="js/ui/screens/meta.js"></script>
<script src="js/ui/boot.js"></script>
<script>
(function () {
  const s = Game.state;
  s.rank = 106; s.coins = 5e8; s.gems = 300; s.crickets = 2e6;
  s.stageSel = 9; // 洞窟
  // 複数コロニーを構築
  Game.world = Game.toWorld();
  for (const st of Game.world.stages) {
    st.pioneered = st.stageId >= 8; // 8,9,10 は開拓済み
    st.lastTickAt = Date.now();
    if (st.pioneered) {
      st.lizards = [];
      const n = st.stageId === 9 ? 60 : 20;
      for (let i = 0; i < n; i++) {
        const sp = SPECIES[i % SPECIES.length];
        const lz = Game.makeLizard(sp.id, MORPHS[i % 4].id, { hue: sp.hue, sat: sp.sat, light: sp.light, pattern: PATTERNS[i % 4] }, i % 6 === 0 ? "baby" : "adult");
        lz.level = 8; Game.ensureRuntime(lz); st.lizards.push(lz);
      }
      st.boss.wins = 40;
      st.nest = { lv: 4, pins: [] };
    }
  }
  Game.world.currentStageId = 9;
  Game.applyWorld(Game.world);
  const s2 = Game.state; // applyWorldでstateが差し替わるため再取得
  s2.res = { bio: 800, food: 120, energy: 300, science: 60 };
  s2.erosion = 42; s2.devLv = 6;
  s2.facilities.water = 12; s2.facilities.heat = 10; s2.facilities.feeder = 6;
  s2.facilities.breedfac = 8; s2.facilities.observatory = 5;
  s2.facilities.fence = 6; s2.facilities.shelter = 5; s2.facilities.watchtower = 4; s2.facilities.trap = 7;
  // V4.1: 巣ネットワークを進めておく(累計値から自動解放)+鉱石所持
  s2.stats.bred = 600; s2.stats.hatched = 480; s2.stats.raidsWon = 400;
  Game.checkNestWeb(true);
  s2.rare = { amethyst: 3, iridium: 45, amber: 22, meteorite: 2, orichalcum: 4, titaniumOre: 6 };
  s2.rocket = { stage: 2, invested: 30, done: false };
  Game.save = () => {}; // セーブ無効化
  UI.update();
  // #nest / #stages / #hq でモーダルを開いた状態を撮る
  const h = location.hash;
  if (h === "#nest") UI.openNest();
  else if (h === "#stages") UI.openStages();
  else if (h === "#hq") UI.openHQ();
  else if (h === "#pioneer") UI.confirmSwitch(7);
  else if (h === "#map") UI.openMap();
  else if (h === "#fac") UI.openFacilities();
  else if (h === "#dexgrid") { UI.dexTab = "dex"; UI.openDex(); }
  else if (h === "#hero-nest" || h === "#hero-surprise" || h === "#hero-skip") {
    const ns = buildNestWeb().filter(n => n.id !== "core").slice(0, 2);
    UI.heroNestReveal(h === "#hero-nest" ? ns : [ns[0]], h === "#hero-surprise");
    if (h === "#hero-skip") Hero.dismiss(true); // スキップ直後=残り香ゼロの検証
    else { clearTimeout(Hero._timer); Hero._timer = null; } // 撮影用に停止
  }
  else if (h === "#icons") { // 全アイコン一覧(§9確認用)
    UI.openModal("SVGアイコン一覧(" + Object.keys(ICONS).length + "種)", (body) => {
      body.innerHTML = '<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px;font-size:11px;text-align:center">'
        + Object.keys(ICONS).map((id) =>
          `<div style="padding:8px;background:var(--card2);border-radius:8px"><span style="font-size:26px;color:var(--gold)">${Icon.svg(id)}</span><div style="color:var(--sub);margin-top:4px">${id}</div></div>`).join("")
        + "</div>";
    });
  }
  else if (h === "#boss-death") { // 撃破の死に様(決定的に中間フレームを構築)
    Game.state.nextRaid = { typeId: "monitor", tier: 5, elite: true, boss: false };
    Game.startRaid();
    Hero.dismiss(true);
    const r = Game.raid;
    Game.raid = null;
    r.snake.arrived = true; r.snake.x = 850; r.snake.hp = 0;
    r.dyingT = 0.52; // 崩壊の中間
    Game.corpse = r;
    Game.tickCorpse = () => {}; // 撮影用に凍結
    Game.rollNextRaid();
  }
  else if (h === "#boss-size-cur" || h === "#boss-size-a" || h === "#boss-size-b") {
    // cur=現行1.75 / a=1.40 / b=1.25 // Phase2: サイズ案比較
    if (h.endsWith("-a")) { CFG.bossScaleBoss = 1.25; CFG.bossScaleTier = 0.03; } // T5=1.40
    else if (h.endsWith("-b")) { CFG.bossScaleBoss = 1.20; CFG.bossScaleTier = 0.01; } // T5=1.25
    Game.state.nextRaid = { typeId: "snake", tier: 5, elite: false, boss: true };
    Game.startRaid();
    Hero.dismiss(true);
    Game.raid.snake.hp = Game.raid.snake.maxHp = 9e9;
    Game.raid.timeLeft = 9999;
    Game.raid.snake.arrived = true;
    Game.raid.snake.x = 850; Game.raid.cutinT = 0; Game.raid.stunT = 0;
  }
  else if (h.startsWith("#boss-live") || h === "#boss-approach" || h === "#boss-enrage") {
    if (h.endsWith("-strong")) document.documentElement.style.setProperty("--dread", "1"); // 中案比較用 // Phase3: ボス戦の見た目確認
    Game.state.nextRaid = { typeId: "monitor", tier: 5, elite: true, boss: false };
    Game.startRaid();
    Hero.dismiss(true); // カットインは飛ばして戦闘状態を見る
    Game.raid.snake.hp = Game.raid.snake.maxHp = 9e9; // 撮影用: 即撃破を防ぐ
    Game.raid.timeLeft = 9999;
    if (h === "#boss-enrage") {
      Game.raid.snake.arrived = true;
      Game.raid.snake.x = 850; Game.raid.cutinT = 0; Game.raid.stunT = 0;
      Game.raid.snake.maxHp = 9e9; Game.raid.snake.hp = 1.7e9; // 19%=Enrage圏(即死しない)
    } else if (h.startsWith("#boss-live")) {
      Game.raid.snake.arrived = true;
      Game.raid.snake.x = 850; Game.raid.cutinT = 0; Game.raid.stunT = 0;
    } else {
      Game.raid.cutinT = 0; Game.raid.snake.x = 1150; Game.raid.stunT = 9999; // 進入途中で保持
    }
  }
  else if (h === "#btn-lab") { // Phase 2.1: ボタン造形3案の比較(選定用)
    const iv = (i) => `<svg class="icon"><use href="#i-${i}"/></svg>`;
    const col = (cls, name, desc) => `
      <div class="blab-col">
        <h4>${name}</h4><p>${desc}</p>
        <div class="grp">主行動(CTA)</div>
        <button class="blab ${cls} cta"><span class="bic">${iv("breed")}</span><span class="lb"><b>繁殖する</b><small>アダルト2匹で卵を作る</small></span></button>
        <div class="grp">ショップ</div>
        <button class="blab ${cls} shop"><span class="bic">${iv("cricket")}</span><span class="lb"><b>コオロギ ×1,000</b><small>トカゲの餌</small></span><span class="pr">10.0KG</span></button>
        <div class="grp">画面遷移</div>
        <button class="blab ${cls}"><span class="bic">${iv("build")}</span><span class="lb"><b>設備</b><small>コロニーを強化</small></span></button>
        <div class="grp">トグル</div>
        <button class="blab-sw ${cls} on">${cls === "b" ? '<span class="lamp"></span>' : ""}オート<span class="kn"></span></button>
      </div>`;
    UI.openModal("ボタン造形ラボ — 3案比較(選定用モック)", (body) => {
      body.innerHTML = `<div id="btn-lab-grid">
        ${col("a", "案A: 彫り込みの据え物", "強い立体。上面ハイライト+深い底エッジ+彫り込んだ丸ソケットにアイコン。押すと沈む据え置き機構の趣")}
        ${col("b", "案B: 操作卓モジュール", "真鍮ネジ+機械のエッジ+左端のインジケータ。価格はドット字の計器窓。テラリウム脇の飼育制御盤")}
        ${col("c", "案C: 上質クラフト", "革・木の風合い+ステッチ(破線)+わずかに傾いだアイコンチップ。手仕事の温かさと厚み")}
      </div>`;
    });
  }
  else if (h === "#stage2") { // 摩天楼スラム(ネオヴェルデ)へ移動した状態
    Game.selectStage(2);
    UI._crankSkinId = null;
    UI.updateFeeder();
  }
  else if (h === "#stage10") { // 遺跡惑星(オリジン)へ移動した状態
    Game.selectStage(10);
    UI._crankSkinId = null;
    UI.updateFeeder();
  }
  else if (h === "#skin-switch-diag") { // 惑星移動でスキンが切り替わる実証
    const face = () => document.getElementById("fd-crank").innerHTML;
    const kind = () => face().includes("cp-bronze") ? "羅針盤" : face().includes("fd-brass") ? "真鍮" : "?";
    const out = [];
    out.push("現在(ID" + Game.currentStage().id + ")=" + kind());
    Game.selectStage(10); UI.updateFeeder();
    out.push("ID10へ移動=" + kind());
    Game.selectStage(1); UI.updateFeeder();
    out.push("ID1へ移動=" + kind());
    const el = document.createElement("div");
    el.id = "diag-out";
    el.style.cssText = "position:fixed;top:4px;left:4px;z-index:999;background:#043;color:#cfc;padding:6px 10px;font-size:13px";
    el.textContent = "SKIN-SWITCH: " + out.join(" → ");
    document.body.appendChild(el);
  }
  else if (h.startsWith("#skin-compass")) { // 羅針盤スキンの強制適用(割り当て確定前の判定用)
    CrankSkins.byPlanet[Game.currentStage().id] = "compass";
    UI._crankSkinId = null;
    const d = Game.ensureDial();
    if (h.includes("auto")) d.auto = true;
    if (h.includes("min")) d.min = true;
    UI.updateFeeder();
    if (h.includes("zoom")) { // 判定用クローズアップ(撮影専用)
      const st = document.createElement("style");
      st.textContent = "#feeder-dial{transform:scale(3.4);transform-origin:100% 100%;}";
      document.head.appendChild(st);
    }
    if (h.includes("hold")) document.getElementById("fd-crank").classList.add("holding");
  }
  else if (h === "#skin-test") { // Phase0: スキン差し替えの器の動作証明(ハーネス限定)
    CrankSkins.skins._test = {
      id: "_test", dialClass: "skin-default",
      face: () => CrankSkins.skins.default.face().replace('class="fd-rim"', 'class="fd-rim" style="stroke:var(--info-500)"'),
    };
    CrankSkins.byPlanet[Game.currentStage().id] = "_test";
    UI._crankSkinId = null; // 再適用を促す
    UI.updateFeeder();
  }
  else if (h === "#dial-diag") { // v2.1骨格: 3点の数値検証
    (async () => {
      const out = [];
      const d = Game.ensureDial();
      // ① レバー: クリック位置でレートが変わるか(上/中/下をディスパッチ)
      const lever = document.getElementById("fd-lever");
      const r0 = lever.getBoundingClientRect();
      for (const [name, frac] of [["上", 0.15], ["中", 0.5], ["下", 0.85]]) {
        lever.dispatchEvent(new PointerEvent("pointerdown", { clientY: r0.top + r0.height * frac, bubbles: true }));
        out.push(`レバー${name}→rate${d.rate}`);
      }
      // ② タップ=1掴み
      Game.state.crickets = 100000;
      const c0 = Game.state.crickets;
      document.getElementById("fd-crank").click();
      out.push(`タップ: コオロギ${c0}→${Game.state.crickets}`);
      // ③ 長押し連続 と オート高 の同速(2秒ずつ実測)
      const crank = document.getElementById("fd-crank");
      let feedsHold = 0;
      const orig = Game.feedAll.bind(Game);
      Game.feedAll = (s) => { feedsHold++; return orig(s); };
      crank.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
      await new Promise((r) => setTimeout(r, 2000 + CFG.holdDelay * 1000));
      crank.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
      Game.feedAll = orig;
      let feedsAuto = 0;
      const orig2 = Game.feedAll.bind(Game);
      Game.feedAll = (s) => { feedsAuto++; return orig2(s); };
      d.auto = true; d.rate = 2;
      for (let i = 0; i < 200; i++) Game.dialTick(0.01); // 2秒ぶん
      Game.feedAll = orig2;
      d.auto = false;
      out.push(`同速検証(2秒間): 長押し${feedsHold}回 / オート高${feedsAuto}回 (間隔=CFG.dialRates[2]=${CFG.dialRates[2]}s)`);
      const el = document.createElement("div");
      el.id = "diag-out";
      el.style.cssText = "position:fixed;top:4px;left:4px;z-index:999;background:#043;color:#cfc;padding:6px 10px;font-size:12px;white-space:pre";
      el.textContent = out.join(" | ");
      document.body.appendChild(el);
    })();
  }
  else if (h === "#eggs") { // Phase0検証: 予兆sparkつき卵スロット
    Game.state.eggs.push(
      { speciesId: "komodo", morphId: "legendary", hue: 80, sat: 18, light: 33, pattern: "none", t: 120, total: 120, lucky: true },
      { speciesId: "futoago", morphId: "albino", hue: 28, sat: 60, light: 50, pattern: "none", t: 60, total: 60 },
      { speciesId: "kanahebi", morphId: "normal", hue: 35, sat: 55, light: 45, pattern: "none", t: 30, total: 30 });
    UI.updateEggSlots();
  }
  else if (h === "#allies-owned") { // Phase0検証: 加入済み味方行のアイコン
    for (const a of ALLIES) Game.state.allies[a.id] = { lv: 2 };
    UI.openAllies();
  }
  else if (h === "#dial-auto" || h === "#dial-gold" || h === "#dial-min") { // オート/Gold駆動状態の確認
    const d = Game.ensureDial();
    d.auto = true;
    if (h === "#dial-gold") { d.supply = true; Game.state.crickets = 0; }
    if (location.search.includes("min") || h === "#dial-min") d.min = true;
    UI.updateFeeder();
  }
  else if (h === "#click-crank") { // Phase1回帰: クランク実クリックで給餌されるか
    setTimeout(() => {
      const before = { crickets: Game.state.crickets, xp: Game.state.lizards.reduce((a, l) => a + l.xp, 0) };
      document.getElementById("fd-crank").click();
      const after = { crickets: Game.state.crickets, xp: Game.state.lizards.reduce((a, l) => a + l.xp, 0) };
      const d = document.createElement("div");
      d.id = "diag-out";
      d.style.cssText = "position:fixed;top:4px;left:4px;z-index:999;background:#043;color:#cfc;padding:6px 10px;font-size:13px";
      d.textContent = `CRANK: crickets ${before.crickets}→${after.crickets} / totalXP ${before.xp}→${after.xp}`;
      document.body.appendChild(d);
    }, 800);
  }
  else if (h === "#click-nest-btn" || h === "#click-burrow") { // Phase0再現: 実イベント発火
    const errBox = document.createElement("div");
    errBox.style.cssText = "position:fixed;top:4px;left:4px;z-index:999;background:#800;color:#fff;padding:4px 8px;font-size:12px;max-width:600px";
    window.addEventListener("error", (e) => { errBox.textContent = "JSエラー: " + e.message; document.body.appendChild(errBox); });
    setTimeout(() => {
      if (h === "#click-nest-btn") {
        document.getElementById("btn-nest").click();
      } else {
        const cv = document.getElementById("game");
        const r = cv.getBoundingClientRect();
        cv.dispatchEvent(new PointerEvent("pointerdown", {
          clientX: r.left + 480 * r.width / W,
          clientY: r.top + 668 * r.height / H,
          bubbles: true,
        }));
      }
    }, 800);
  }
  else if (h === "#detail") { // 個体詳細パネル(QA用)
    const lz = Game.state.lizards.find(l => l.stage === "adult");
    lz.injuredT = 30; lz.founder = true; // 全行を出す
    Game.selectedId = lz.id;
    UI.renderDetail(true);
  }
  else if (h === "#missions") UI.openMissions();
  else if (h === "#settings") UI.openSettings();
  else if (h === "#stats") UI.openStats();
  else if (h === "#allies") UI.openAllies();
  else if (h === "#titles") UI.openTitles();
  else if (h === "#fx-rank") { setTimeout(() => UI.rankUpFx(), 600); }
  else if (h.startsWith("#accent-")) { // 惑星アクセントの強制適用(一覧確認用)
    const pid = parseInt(h.slice(8), 10) || 1;
    document.documentElement.style.setProperty("--planet-accent", UI.planetAccent(pid));
    UI._accentId = pid; // updateによる上書きを防ぐ
    UI.applyPlanetAccent = () => {};
    document.getElementById("ui-stage").textContent = stageById(pid).pname + " / " + stageById(pid).name;
  }
  else if (h === "#tip-demo") { // ホバーツールチップの見た目確認(強制表示)
    const st = document.createElement("style");
    st.textContent = "[data-tip].demo::after{opacity:1;transform:translateX(-50%) translateY(0);transition-delay:0s}";
    document.head.appendChild(st);
    document.querySelector("#topbar .res").classList.add("demo");
    document.querySelector('[data-tip*="バガー"]').classList.add("demo");
  }
  else if (h === "#focus-demo") { // フォーカスリングの見た目確認(:focus-visible相当)
    const st = document.createElement("style");
    st.textContent = ".demo-focus{outline:2px solid var(--info-500);outline-offset:2px;border-radius:6px}";
    document.head.appendChild(st);
    document.getElementById("btn-breed").classList.add("demo-focus");
    document.getElementById("row-stage").classList.add("demo-focus");
  }
  else if (h.startsWith("#hero-legend")) {
    const lz = Game.state.lizards.find(l => l.stage === "adult");
    lz.morphId = "legendary";
    UI.heroLegendBirth(lz);
    if (h.endsWith("-skip")) Hero.dismiss(true);
    else { clearTimeout(Hero._timer); Hero._timer = null; }
  }
  else if (h.startsWith("#hero-rocket")) {
    UI.heroRocketLaunch();
    if (h.endsWith("-skip")) Hero.dismiss(true);
    else { clearTimeout(Hero._timer); Hero._timer = null; }
  }
  else if (h === "#hero-warp") {
    UI.confirmSwitch = () => {}; // 演出のみ(切替は発火させない)
    UI.travelTo(5);
    const ov = document.getElementById("travel-overlay");
    ov.onclick = null; // 撮影用に保持
  }
  else if (h.startsWith("#hero-meteor")) {
    const sp = speciesById("futoago"), legend = h.includes("legend");
    UI.heroMeteorite(sp, morphById(legend ? "legendary" : "albino"),
      { hue: sp.hue, sat: sp.sat, light: sp.light });
    if (h.endsWith("-skip")) Hero.dismiss(true);
    else { clearTimeout(Hero._timer); Hero._timer = null; }
  }
  else if (h.startsWith("#hero-boss")) {
    const fake = { type: bossTypeById("monitor"), typeId: "monitor", tier: 4, elite: true, boss: false };
    if (h === "#hero-bossdown") UI.heroBossDown(fake, "Elite ヌシオオトカゲ T4 を撃破! +48.2KG +3 +6");
    else UI.heroBossIn(fake);
    if (h.endsWith("-skip")) Hero.dismiss(true);
    else { clearTimeout(Hero._timer); Hero._timer = null; }
  }
  else if (h === "#lore") { UI.dexTab = "lore"; UI.openDex(); } // 未開拓の大湿原を開拓UIで開く
  window.__ready = true;
})();
</script>
</body>
</html>
