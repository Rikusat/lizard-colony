<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>b3 loading</title>
<!-- V6-P2-2 B3 実寸シュートページ(開発用・2026-08-11)。
     **実コード経路そのまま**(UI.buildNest+layoutStage=DOM+canvas)を、参照コンテンツ領域と同じ
     1460×884 で描画する。tools/qa-nest-shot.mjs がこのページをスクショし参照実測値と比較=B3部分ゲート。
     代表状態=モックの 23/80 解放に合わせ、内側から23ノードを解放済みにする(決定論)。
     周辺UI(ヘッダ/パネル/ヒント)はCSSで隠し、ステージだけを(0,0)-(1460,884)に固定=座標系が参照と一致。 -->
<script>
(function () {
  const mem = {};
  const shim = { getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; }, clear: () => { for (const k in mem) delete mem[k]; } };
  Object.defineProperty(window, "localStorage", { value: shim, configurable: false });
})();
</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; overflow: hidden; }
  #wrapb3 { position: fixed; left: 0; top: 0; width: 1460px; height: 884px; }
  /* B4: 右パネル(#nest-side)も表示=実コード経路のDOMをそのまま計測対象へ */
  #wrapb3 .nest-head, #wrapb3 #nest-hint, #wrapb3 #nest-tip { display: none !important; }
  #wrapb3 #nest-main { position: absolute; inset: 0; display: flex; gap: 12px; }
  #wrapb3 #nest-stage { min-height: 0; border: none; border-radius: 0; }
</style>
</head>
<body>
<div id="wrapb3"></div>
<canvas id="game" width="10" height="10" style="display:none"></canvas>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script>globalThis.UI = globalThis.UI || {};</script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/screens/nest.js"></script>
<script>
UI.toast = UI.toast || (() => {});
Game.newGame();
Game.ensureNestWeb();
// 代表状態: 内側から23ノード解放(モック 23/80 と同水準・決定論)
const ns = buildNestWeb().filter((n) => n.id !== "core");
ns.sort((a, b) => a.ring - b.ring || a.angle - b.angle).slice(0, 23).forEach((n) => { Game.state.nestWeb.nodes[n.id] = { t: 1 }; });
// B4: レア資源の代表値(モック水準の桁・決定論)=パネルの数値表示が計測対象に載る
Game.state.rare = { amethyst: 450, iridium: 120, amber: 35, meteorite: 5, orichalcum: 78, titaniumOre: 12 };
UI.buildNest(document.getElementById("wrapb3"));
// ★スタイル適用前のrAFで初回描画が走るとステージ寸法が未確定のままcanvasを描く(実測でRが1.5倍化)。
//   load後に必ず再レイアウトしてから ready を立てる=スクショは確定寸法のみを撮る。
window.addEventListener("load", () => {
  // v2: 素材の読了/失敗が確定してから ready(スクショが素材有無どちらかの確定状態だけを撮る)
  const settled = () => {
    if (/[?&]noassets=1/.test(location.search)) return true;
    const keys = ["nest-core"].concat(Object.values(NEST_RING_ASSETS)); // v2-V2: リング素材も確定待ち
    return keys.every((k) => (UI._nestAssets[k] && UI._nestAssets[k].complete) || UI._nestAssetFailed[k]);
  };
  const tick = () => {
    if (!settled()) { setTimeout(tick, 50); return; }
    UI._nestLayout && UI._nestLayout();
    requestAnimationFrame(() => { document.title = "b3 ready"; });
  };
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
