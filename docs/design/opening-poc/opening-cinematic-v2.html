<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>トカゲコロニー — オープニング試作 v2 (Director's Cut)</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#04060a;cursor:pointer}
  #ui{position:fixed;left:0;right:0;bottom:14px;display:flex;gap:10px;justify-content:center;
    font-size:11px;color:rgba(224,214,198,.42);letter-spacing:.08em;pointer-events:none}
  #ui b{pointer-events:auto;cursor:pointer;font-weight:500;padding:4px 12px;
    border:1px solid rgba(224,214,198,.18);border-radius:2px;transition:color .2s,border-color .2s}
  #ui b:hover{color:rgba(242,211,160,.9);border-color:rgba(242,211,160,.4)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="ui"><b id="replay">もう一度</b><b id="skip">スキップ</b></div>
<script>
"use strict";
/* ==================================================================
   トカゲコロニー オープニング v2
   方針: ムービーのトカゲはゲーム内の魂と別描写でよい(Ric裁定)。
         鱗・縦長瞳孔・爪・リムライトの高精細描写を主役に据える。
   構成: ①故郷の終わり ②脱出 ③航行 ④実験の反復 ⑤生命へ ⑥題
   素のCanvas 2D / 依存ゼロ / reduced-motion対応
   ================================================================== */
const cv=document.getElementById('c'), x=cv.getContext('2d');
const W=1280,H=720;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const VOID='#04060a', CRIM='#c23b4a', CRIM_D='#7a1220',
      AMB='#d9a441', AMB_L='#f2d3a0', LIFE='#6fa86a';

const cl=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>{t=cl(t,0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(a,b){let h=(a*374761393+b*668265263)^(a<<7);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295;}
function glow(c,b){x.shadowColor=c;x.shadowBlur=b;}
function g0(){x.shadowBlur=0;}
function sky(c0,c1,c2){const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,c0);g.addColorStop(.55,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);}

/* ---- 幾何ヘルパ ---- */
function qc(p0,p1,p2,n){const a=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;
  a.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0], u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}return a;}
function ribbon(pts,ws){                       // 中心線+半幅 → 閉パス
  const L=[],R=[];
  for(let i=0;i<pts.length;i++){
    const pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let dx=pb[0]-pa[0],dy=pb[1]-pa[1];const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
    const w=ws[Math.min(i,ws.length-1)];
    L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]); R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);
  }
  x.beginPath();x.moveTo(L[0][0],L[0][1]);
  for(let i=1;i<L.length;i++)x.lineTo(L[i][0],L[i][1]);
  for(let i=R.length-1;i>=0;i--)x.lineTo(R[i][0],R[i][1]);
  x.closePath();
}
function widths(n,a,b,peak){const o=[];for(let i=0;i<n;i++){const t=i/(n-1);
  const w=peak?a+(b-a)*Math.sin(t*Math.PI):a+(b-a)*t;o.push(w);}return o;}

/* ==================================================================
   トカゲ(ムービー用・高精細)
   s = 胴長。原点=胴の中心。dir=1で右向き。
   ================================================================== */
function lizardArt(cx,cy,s,dir,o){
  o=o||{};
  const tone=o.tone||['#3a2a18','#8a6a34','#d8b25f'];   // 背・側・腹
  const eyeC=o.eye||AMB_L, headUp=o.headUp||0, rim=o.rim||'rgba(242,211,160,.55)';
  const seed=o.seed||1;
  x.save();x.translate(cx,cy);x.scale(dir*s,s);

  /* --- 奥側の脚(暗い) --- */
  x.fillStyle=tone[0];
  [[-.30,.16,-.46,.34,-.28,.44],[.32,.18,.44,.34,.30,.44]].forEach(([ax,ay,bx,by,fx,fy])=>{
    ribbon([[ax,ay],[bx,by],[fx,fy]],[.075,.055,.04]);x.fill();
  });

  /* --- 尾 --- */
  const tail=qc([-.48,.02],[-1.35,.20],[-2.25,-.16],16);
  ribbon(tail,widths(17,.215,.012));
  let tg=x.createLinearGradient(0,-.3,0,.35);
  tg.addColorStop(0,tone[0]);tg.addColorStop(.6,tone[1]);tg.addColorStop(1,tone[2]);
  x.fillStyle=tg;x.fill();

  /* --- 胴 --- */
  const torso=qc([-.52,.0],[0,-.06],[.54,-.05],12);
  ribbon(torso,widths(13,.19,.29,true));
  const bg=x.createLinearGradient(0,-.32,0,.34);
  bg.addColorStop(0,tone[0]);bg.addColorStop(.45,tone[1]);bg.addColorStop(1,tone[2]);
  x.fillStyle=bg;x.fill();

  /* --- 鱗と斑(胴+尾にクリップ) --- */
  x.save();
  ribbon(torso,widths(13,.19,.29,true));x.clip();
  for(let r=0;r<7;r++)for(let c=0;c<16;c++){
    const px=-.5+c*.066+ (r%2)*.033, py=-.26+r*.085;
    const d=hash(seed*7+r,c);
    x.fillStyle=`rgba(0,0,0,${.05+d*.09})`;
    x.beginPath();x.ellipse(px,py,.028,.020,0,0,6.29);x.fill();
  }
  for(let i=0;i<5;i++){                                  // 横帯
    const bx=-.42+i*.24;
    x.fillStyle=`rgba(30,18,8,${.30+hash(seed,i)*.16})`;
    x.beginPath();x.ellipse(bx,-.10,.055,.19,0,0,6.29);x.fill();
  }
  x.restore();

  /* --- 背稜 --- */
  x.fillStyle=tone[0];
  for(let i=0;i<14;i++){
    const t=i/13, p=[lerp(-.5,.5,t), lerp(-.16,-.22,Math.sin(t*Math.PI))-.06];
    const h=.030+.022*Math.sin(t*Math.PI);
    x.beginPath();x.moveTo(p[0]-.022,p[1]);x.lineTo(p[0],p[1]-h);x.lineTo(p[0]+.022,p[1]);x.closePath();x.fill();
  }

  /* --- 手前の脚 --- */
  x.fillStyle=tone[1];
  [[-.26,.18,-.42,.36,-.22,.46],[.36,.20,.50,.36,.34,.46]].forEach(([ax,ay,bx,by,fx,fy])=>{
    ribbon([[ax,ay],[bx,by],[fx,fy]],[.085,.062,.045]);x.fill();
    x.strokeStyle=tone[0];x.lineWidth=.016;x.lineCap='round';   // 指と爪
    for(let d=0;d<4;d++){const a=-.5+d*.35;
      x.beginPath();x.moveTo(fx,fy);
      x.lineTo(fx+Math.cos(a)*.10+.02, fy+Math.abs(Math.sin(a))*.03+.03);x.stroke();}
  });

  /* --- 首と頭(headUpで持ち上がる) --- */
  x.save();
  x.translate(.50,-.05);x.rotate(-headUp*0.5);
  const neck=qc([0,0],[.16,-.03],[.30,-.06],6);
  ribbon(neck,widths(7,.185,.155));
  x.fillStyle=bg;x.fill();
  /* 頭: 楔形 */
  x.beginPath();
  x.moveTo(.28,-.20); x.quadraticCurveTo(.62,-.20,.76,-.055);
  x.quadraticCurveTo(.62,.10,.30,.135); x.quadraticCurveTo(.20,-.03,.28,-.20);
  x.closePath();
  const hg=x.createLinearGradient(0,-.2,0,.14);
  hg.addColorStop(0,tone[0]);hg.addColorStop(.5,tone[1]);hg.addColorStop(1,tone[2]);
  x.fillStyle=hg;x.fill();
  /* 顎線・鼻孔・耳孔 */
  x.strokeStyle=`rgba(20,12,6,.55)`;x.lineWidth=.013;
  x.beginPath();x.moveTo(.30,.075);x.quadraticCurveTo(.55,.085,.74,-.045);x.stroke();
  x.fillStyle='rgba(16,10,4,.8)';
  x.beginPath();x.ellipse(.70,-.075,.017,.012,0,0,6.29);x.fill();
  x.beginPath();x.ellipse(.30,-.045,.030,.038,0,0,6.29);x.fill();
  /* 頭の鱗 */
  x.save();
  x.beginPath();x.moveTo(.28,-.20);x.quadraticCurveTo(.62,-.20,.76,-.055);
  x.quadraticCurveTo(.62,.10,.30,.135);x.quadraticCurveTo(.20,-.03,.28,-.20);x.clip();
  for(let r=0;r<4;r++)for(let c=0;c<7;c++){
    x.fillStyle=`rgba(0,0,0,${.05+hash(r+seed,c)*.08})`;
    x.beginPath();x.ellipse(.30+c*.065,-.15+r*.07,.023,.017,0,0,6.29);x.fill();}
  x.restore();
  /* 眼 */
  const er=.062;
  x.fillStyle='#120b05';x.beginPath();x.ellipse(.455,-.075,er*1.28,er*1.16,0,0,6.29);x.fill();
  const ig=x.createRadialGradient(.455,-.075,er*.15,.455,-.075,er);
  ig.addColorStop(0,eyeC);ig.addColorStop(.65,'#a4761f');ig.addColorStop(1,'#4a3110');
  x.fillStyle=ig;x.beginPath();x.arc(.455,-.075,er,0,6.29);x.fill();
  x.fillStyle='#0a0603';                                    // 縦長瞳孔
  x.beginPath();x.ellipse(.455,-.075,er*.20,er*.78,0,0,6.29);x.fill();
  if(o.reflect){x.fillStyle=o.reflect;x.globalAlpha=.85;      // 眼に映るもの
    x.beginPath();x.ellipse(.478,-.055,er*.26,er*.30,0,0,6.29);x.fill();x.globalAlpha=1;}
  x.fillStyle='rgba(255,255,255,.85)';
  x.beginPath();x.arc(.432,-.098,er*.17,0,6.29);x.fill();
  x.strokeStyle=tone[0];x.lineWidth=.018;                    // 眼窩の隆起
  x.beginPath();x.arc(.455,-.075,er*1.34,3.5,5.9);x.stroke();
  x.restore();

  /* --- リムライト --- */
  x.save();
  ribbon(torso,widths(13,.19,.29,true));
  x.strokeStyle=rim;x.lineWidth=.028;x.globalAlpha=.9;
  x.setLineDash([]);x.stroke();
  ribbon(tail,widths(17,.215,.012));x.lineWidth=.020;x.stroke();
  x.restore();
  x.restore();
}

/* 顔のクローズアップ(眼が主役) */
function headArt(cx,cy,s,dir,o){
  o=o||{};
  const tone=o.tone||['#3a2a18','#8a6a34','#d8b25f'];
  x.save();x.translate(cx,cy);x.scale(dir*s,s);
  /* 頭 */
  x.beginPath();
  x.moveTo(-.55,-.42);x.quadraticCurveTo(.35,-.52,.92,-.10);
  x.quadraticCurveTo(.40,.30,-.50,.40);x.quadraticCurveTo(-.78,-.02,-.55,-.42);
  x.closePath();
  const hg=x.createLinearGradient(0,-.5,0,.42);
  hg.addColorStop(0,tone[0]);hg.addColorStop(.5,tone[1]);hg.addColorStop(1,tone[2]);
  x.fillStyle=hg;x.fill();
  /* 鱗 */
  x.save();
  x.beginPath();x.moveTo(-.55,-.42);x.quadraticCurveTo(.35,-.52,.92,-.10);
  x.quadraticCurveTo(.40,.30,-.50,.40);x.quadraticCurveTo(-.78,-.02,-.55,-.42);x.clip();
  for(let r=0;r<9;r++)for(let c=0;c<13;c++){
    const px=-.72+c*.13+(r%2)*.065, py=-.46+r*.10;
    const d=hash(r*3+1,c);
    x.fillStyle=`rgba(0,0,0,${.05+d*.10})`;
    x.beginPath();x.ellipse(px,py,.048,.034,0,0,6.29);x.fill();
    x.strokeStyle=`rgba(255,220,170,${.03+d*.05})`;x.lineWidth=.008;
    x.beginPath();x.ellipse(px,py,.048,.034,0,3.4,6.0);x.stroke();
  }
  x.restore();
  /* 顎線・鼻孔 */
  x.strokeStyle='rgba(18,10,4,.6)';x.lineWidth=.022;
  x.beginPath();x.moveTo(-.50,.22);x.quadraticCurveTo(.30,.20,.88,-.09);x.stroke();
  x.fillStyle='rgba(14,8,3,.85)';
  x.beginPath();x.ellipse(.80,-.15,.035,.025,0,0,6.29);x.fill();
  /* 眼(主役) */
  const ex=.12,ey=-.12,er=.235;
  x.fillStyle='#0e0804';x.beginPath();x.ellipse(ex,ey,er*1.30,er*1.14,0,0,6.29);x.fill();
  const ig=x.createRadialGradient(ex-er*.2,ey-er*.2,er*.1,ex,ey,er);
  ig.addColorStop(0,o.eye||'#f6dfae');ig.addColorStop(.55,'#b4801f');ig.addColorStop(1,'#402a0c');
  x.fillStyle=ig;x.beginPath();x.arc(ex,ey,er,0,6.29);x.fill();
  x.strokeStyle='rgba(70,44,12,.55)';x.lineWidth=.010;      // 虹彩の筋
  for(let i=0;i<26;i++){const a=i/26*6.2832;
    x.beginPath();x.moveTo(ex+Math.cos(a)*er*.30,ey+Math.sin(a)*er*.30);
    x.lineTo(ex+Math.cos(a)*er*.96,ey+Math.sin(a)*er*.96);x.stroke();}
  x.fillStyle='#080502';                                    // 縦長瞳孔
  x.beginPath();x.ellipse(ex,ey,er*(o.pupil||.19),er*.80,0,0,6.29);x.fill();
  if(o.reflect){                                            // 眼に映る光景
    x.save();x.globalAlpha=.9;x.fillStyle=o.reflect;
    x.beginPath();x.ellipse(ex+er*.34,ey-er*.18,er*.30,er*.36,-.3,0,6.29);x.fill();
    if(o.reflect2){x.fillStyle=o.reflect2;
      x.beginPath();x.ellipse(ex-er*.30,ey+er*.24,er*.16,er*.20,.2,0,6.29);x.fill();}
    x.restore();
  }
  x.fillStyle='rgba(255,255,255,.9)';
  x.beginPath();x.arc(ex-er*.34,ey-er*.36,er*.15,0,6.29);x.fill();
  /* 瞼の隆起 */
  x.strokeStyle=tone[0];x.lineWidth=.055;
  x.beginPath();x.arc(ex,ey,er*1.36,3.35,5.95);x.stroke();
  x.strokeStyle='rgba(242,211,160,.35)';x.lineWidth=.022;
  x.beginPath();x.arc(ex,ey,er*1.40,3.5,4.6);x.stroke();
  x.restore();
}

/* ---- 背景部品 ---- */
function ridge(y,amp,seed,col,step){
  x.fillStyle=col;x.beginPath();x.moveTo(-20,H+20);x.lineTo(-20,y);
  for(let i=-20;i<=W+20;i+=(step||26)){
    const n=hash(seed,Math.floor(i/(step||26)))-.5,n2=hash(seed+9,Math.floor(i/((step||26)*4)))-.5;
    x.lineTo(i,y+n*amp+n2*amp*2.4);}
  x.lineTo(W+20,H+20);x.closePath();x.fill();
}
function erosion(cx,cy,len,br,t,alpha){
  x.save();x.globalAlpha=alpha;x.strokeStyle=CRIM;x.lineCap='round';glow(CRIM,14);
  for(let b=0;b<br;b++){
    const a0=-1.5708+(b/br-.5)*2.4+hash(b,3)*.5;let px=cx,py=cy,a=a0;
    x.lineWidth=3.2;x.beginPath();x.moveTo(px,py);
    const seg=Math.floor(len*cl(t,0,1));
    for(let i=0;i<seg;i++){a+=(hash(b,i)-.5)*.75;px+=Math.cos(a)*11;py+=Math.sin(a)*11;x.lineTo(px,py);}
    x.stroke();}
  g0();x.restore();
}
const STARS=Array.from({length:150},(_,i)=>({x:hash(i,1)*W,y:hash(i,2)*H,r:hash(i,3)*1.5+.3,p:hash(i,4)*6.28}));
function stars(t,alpha,drift){
  x.save();x.globalAlpha=alpha;
  STARS.forEach(s=>{const tw=.55+.45*Math.sin(t*2.2+s.p);
    x.fillStyle=`rgba(226,232,240,${tw})`;
    let sx=(s.x-drift*(.35+s.r*.5))%W;if(sx<0)sx+=W;
    x.beginPath();x.arc(sx,s.y,s.r,0,6.29);x.fill();});
  x.restore();
}
function rocket(cx,cy,s,flame,ang){
  x.save();x.translate(cx,cy);x.rotate(ang||0);
  if(flame>0){const fl=s*(2.2+flame*3.4);
    const g=x.createLinearGradient(0,s*1.1,0,s*1.1+fl);
    g.addColorStop(0,'rgba(242,211,160,.95)');g.addColorStop(.35,'rgba(217,164,65,.6)');
    g.addColorStop(1,'rgba(194,59,74,0)');
    x.fillStyle=g;x.beginPath();x.moveTo(-s*.42,s*1.05);
    x.quadraticCurveTo(0,s*1.1+fl*1.15,s*.42,s*1.05);x.closePath();x.fill();}
  x.fillStyle='#0a0e14';
  x.beginPath();x.moveTo(0,-s*1.85);x.quadraticCurveTo(s*.62,-s*.2,s*.5,s*1.05);
  x.lineTo(-s*.5,s*1.05);x.quadraticCurveTo(-s*.62,-s*.2,0,-s*1.85);x.closePath();x.fill();
  x.fillStyle='#161d26';
  x.beginPath();x.moveTo(s*.5,s*.45);x.lineTo(s*1.02,s*1.15);x.lineTo(s*.5,s*1.05);x.closePath();x.fill();
  x.beginPath();x.moveTo(-s*.5,s*.45);x.lineTo(-s*1.02,s*1.15);x.lineTo(-s*.5,s*1.05);x.closePath();x.fill();
  glow(AMB,10);x.fillStyle=AMB_L;x.beginPath();x.arc(0,-s*.55,s*.19,0,6.29);x.fill();g0();
  x.strokeStyle='rgba(210,56,74,.5)';x.lineWidth=s*.07;
  x.beginPath();x.moveTo(-s*.52,s*.15);x.lineTo(s*.52,s*.15);x.stroke();
  x.restore();
}
function flask(cx,cy,s,fill,lit){
  x.save();x.translate(cx,cy);
  x.strokeStyle='rgba(190,196,205,.55)';x.lineWidth=Math.max(1.2,s*.055);
  x.beginPath();x.moveTo(-s*.16,-s);x.lineTo(-s*.16,-s*.3);x.lineTo(-s*.62,s*.62);
  x.quadraticCurveTo(-s*.66,s*.9,-s*.3,s*.9);x.lineTo(s*.3,s*.9);
  x.quadraticCurveTo(s*.66,s*.9,s*.62,s*.62);x.lineTo(s*.16,-s*.3);x.lineTo(s*.16,-s);x.stroke();
  if(fill>0){const top=s*.9-fill*s*1.2;
    if(lit)glow(lit,s*.9);
    x.fillStyle=lit?lit:'rgba(70,86,96,.75)';
    x.beginPath();x.moveTo(-s*.6,Math.max(top,s*.6));x.lineTo(-s*.62,s*.62);
    x.quadraticCurveTo(-s*.66,s*.9,-s*.3,s*.9);x.lineTo(s*.3,s*.9);
    x.quadraticCurveTo(s*.66,s*.9,s*.62,s*.62);x.lineTo(s*.6,Math.max(top,s*.6));
    x.closePath();x.fill();g0();}
  x.restore();
}
function egg(cx,cy,s,crack,light){
  x.save();x.translate(cx,cy);
  if(light>0)glow(AMB_L,44*light);
  const g=x.createLinearGradient(0,-s,0,s);
  g.addColorStop(0,'#2a2f38');g.addColorStop(1,'#171b22');
  x.fillStyle=g;x.beginPath();x.ellipse(0,0,s*.72,s,0,0,6.29);x.fill();g0();
  x.strokeStyle=`rgba(242,211,160,${.25+.75*light})`;x.lineWidth=s*.055;
  if(crack>0){const pts=[[0,-s*.9],[s*.2,-s*.5],[-s*.12,-s*.15],[s*.22,s*.25],[-s*.05,s*.7]];
    x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
    const n=Math.floor(cl(crack,0,1)*(pts.length-1))+1;
    for(let i=1;i<n;i++)x.lineTo(pts[i][0],pts[i][1]);x.stroke();}
  x.restore();
}

/* ---- 仕上げ ---- */
function grade(t){
  const v=x.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.86);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.62)');
  x.fillStyle=v;x.fillRect(0,0,W,H);
  x.globalAlpha=.045;
  for(let i=0;i<400;i++){const gi=Math.floor(t*12)+i;
    x.fillStyle=hash(gi,7)>.5?'#fff':'#000';
    x.fillRect(hash(gi,1)*W,hash(gi,2)*H,1.6,1.6);}
  x.globalAlpha=1;
  x.fillStyle=VOID;x.fillRect(0,0,W,58);x.fillRect(0,H-58,W,58);
}
function caption(txt,alpha,y){
  if(alpha<=0)return;
  x.save();x.globalAlpha=alpha;x.textAlign='center';
  x.font='500 19px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  x.fillStyle='rgba(232,224,210,.92)';x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=14;
  x.fillText(txt,W/2,y||H-96);x.restore();
}
function cam(sc,dx,dy){x.translate(W/2+(dx||0),H/2+(dy||0));x.scale(sc,sc);x.translate(-W/2,-H/2);}

/* ==================================================================
   ①  0.0–2.6  故郷の終わり — 見上げるトカゲ(主役)
   ================================================================== */
function b1(t,a){
  x.save();x.globalAlpha=a;
  cam(1+t*.018,0,0);
  const pulse=Math.sin(t*3.1)*.5+.5;
  sky('#12141c','#1e1520','#0a0b10');
  x.fillStyle=`rgba(160,30,44,${.06+.12*pulse*cl(t/1.2,0,1)})`;x.fillRect(0,0,W,H);
  stars(t,.3*(1-cl(t/1.6,0,1)),0);
  erosion(W*.70,50,26,7,cl((t-.1)/1.6,0,1),.55*cl(t/.8,0,1));
  erosion(W*.30,50,20,5,cl((t-.45)/1.6,0,1),.4*cl(t/1.1,0,1));
  ridge(H*.58,16,3,'#161d27');
  ridge(H*.71,22,11,'#0d1219');
  /* 地の裂け目 */
  x.save();x.globalAlpha=cl((t-.8)/1.0,0,1);
  x.strokeStyle=CRIM;x.lineWidth=3;glow(CRIM,16);
  x.beginPath();x.moveTo(W*.05,H*.87);
  [[.2,.84],[.35,.89],[.52,.83],[.68,.90],[.85,.85],[1,.88]].forEach(([px,py])=>x.lineTo(W*px,H*py));
  x.stroke();g0();x.restore();
  /* 群れ(中景) */
  [[.14,.795,44,1],[.30,.815,36,1],[.83,.80,40,-1]].forEach(([px,py,s,d],i)=>{
    lizardArt(W*px,H*py,s,d,{seed:i+2,rim:'rgba(194,59,74,.5)',
      tone:['#2a1e12','#5c4526','#8f7040'],headUp:.5});
  });
  /* 主役: 手前で空を見上げる */
  const up=ease(cl((t-.5)/1.1,0,1));
  lizardArt(W*.58,H*.885,118,1,{
    seed:1,headUp:up*1.0,eye:AMB_L,reflect:`rgba(194,59,74,${.5+.4*pulse})`,
    rim:`rgba(210,70,80,${.35+.35*pulse})`,tone:['#3a2a18','#8a6a34','#d8b25f']});
  ridge(H*.985,8,21,VOID,18);
  caption('その星は、内側から蝕まれた。',cl((t-.55)/.6,0,1)*cl((2.5-t)/.45,0,1));
  x.restore();
}

/* ==================================================================
   ②  2.5–4.6  脱出 — 眼に映る炎 → ロケット
   ================================================================== */
function b2(t,a){
  x.save();x.globalAlpha=a;
  if(t<1.0){                                   /* 眼のクローズアップ */
    sky('#0a0d14','#1a1219','#08090e');
    x.fillStyle='rgba(160,30,44,.10)';x.fillRect(0,0,W,H);
    cam(1.04+t*.05,0,0);
    const fl=.5+.5*Math.sin(t*9);
    headArt(W*.46,H*.52,330,1,{
      eye:'#f8e3b4',pupil:.16,
      reflect:`rgba(242,211,160,${.6+.3*fl})`, reflect2:'rgba(194,59,74,.7)',
      tone:['#3a2a18','#8a6a34','#d8b25f']});
    x.save();x.globalAlpha=.35+.25*fl;         /* 炎の照り返し */
    const g=x.createRadialGradient(W*.72,H*.62,0,W*.72,H*.62,H*.55);
    g.addColorStop(0,'rgba(242,211,160,.5)');g.addColorStop(1,'rgba(242,211,160,0)');
    x.fillStyle=g;x.fillRect(0,0,W,H);x.restore();
    caption('残された科学だけを積んで、',cl((t-.35)/.4,0,1)*cl((1.0-t)/.25,0,1));
  }else{                                       /* 発射 */
    const lt=t-1.0, lift=ease(cl(lt/1.0,0,1));
    sky('#0c1018','#1c1420','#0a0b10');
    x.fillStyle=`rgba(160,30,44,${.10*(1-lift*.6)})`;x.fillRect(0,0,W,H);
    stars(t,.25+.45*lift,0);
    const gy=H*.80+lift*H*.30;
    erosion(W*.8,52,18,5,1,.28*(1-lift));
    ridge(gy-H*.10,16,3,'#161d27');ridge(gy,22,11,'#0d1219');
    const rx=W*.55, ry=lerp(gy-56,-H*.5,lift*lift), sh=lerp(1,.6,lift);
    if(lift>0&&lift<1){x.save();x.globalAlpha=.5*(1-lift);
      for(let i=0;i<8;i++){const p=i/8;
        x.fillStyle=`rgba(120,108,96,${.5-p*.5})`;
        x.beginPath();x.arc(rx+Math.sin(i*2.1)*(28+p*70),ry+92+p*180,22+p*54,0,6.29);x.fill();}
      x.restore();}
    rocket(rx,ry,46*sh,.4+.6*ease(cl(lt/.5,0,1)),Math.sin(t*1.4)*.03);
    /* 見送る群れ(手前・逆光) */
    [[.18,52,1],[.30,42,1],[.80,46,-1]].forEach(([px,s,d],i)=>{
      lizardArt(W*px,gy+H*.045,s,d,{seed:i+5,headUp:.9,
        tone:['#14100a','#241a10','#3a2a18'],rim:`rgba(242,211,160,${.45+.35*lift})`});
    });
    ridge(H*.985,8,21,VOID,18);
    caption('彼らは星を出た。',cl((lt-.25)/.4,0,1)*cl((1.15-lt)/.35,0,1));
  }
  x.restore();
}

/* ==================================================================
   ③  4.5–6.3  航行 — 窓辺のトカゲ
   ================================================================== */
function b3(t,a){
  x.save();x.globalAlpha=a;
  x.fillStyle='#070a10';x.fillRect(0,0,W,H);
  cam(1+t*.012,0,0);
  /* 舷窓 */
  const wx=W*.60,wy=H*.44,wr=228;
  x.save();
  x.beginPath();x.arc(wx,wy,wr,0,6.29);x.clip();
  sky('#060910','#080d16','#05070c');
  stars(t,.95,t*40);
  const worlds=[[.35,.30,22,'#2a3b4a'],[.72,.62,15,'#3b3038'],[.55,.78,11,'#31404a']];
  worlds.forEach(([px,py,r,c],i)=>{
    const dx=((px*W-t*26*(1+i%3*.4))%(W+200));const fx=dx<-100?dx+W+200:dx;
    x.fillStyle=c;x.beginPath();x.arc(fx,py*H,r,0,6.29);x.fill();
    x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.arc(fx+r*.34,py*H-r*.18,r*.92,0,6.29);x.fill();});
  /* 目指す緑の一点 */
  const tgt=ease(cl((t-.35)/1.1,0,1));
  glow(LIFE,26+tgt*44);
  const g=x.createRadialGradient(wx+70,wy-40,0,wx+70,wy-40,60+tgt*80);
  g.addColorStop(0,'rgba(196,238,184,.95)');g.addColorStop(.35,'rgba(111,168,106,.5)');
  g.addColorStop(1,'rgba(111,168,106,0)');
  x.fillStyle=g;x.beginPath();x.arc(wx+70,wy-40,60+tgt*80,0,6.29);x.fill();g0();
  x.restore();
  /* 窓枠 */
  x.strokeStyle='#1b232e';x.lineWidth=26;x.beginPath();x.arc(wx,wy,wr,0,6.29);x.stroke();
  x.strokeStyle='rgba(217,164,65,.35)';x.lineWidth=2.5;x.beginPath();x.arc(wx,wy,wr-14,0,6.29);x.stroke();
  for(let i=0;i<8;i++){const ang=i/8*6.2832+.4;
    x.fillStyle='#2b3542';x.beginPath();
    x.arc(wx+Math.cos(ang)*(wr+2),wy+Math.sin(ang)*(wr+2),7,0,6.29);x.fill();}
  /* 船内 */
  x.fillStyle='rgba(6,9,14,.92)';x.fillRect(0,H*.72,W,H*.28);
  x.fillStyle='#0b111a';x.fillRect(0,0,W*.13,H);x.fillRect(W*.93,0,W*.07,H);
  /* 窓辺のトカゲ(主役・逆光) */
  lizardArt(W*.30,H*.80,132,1,{seed:3,headUp:.55,
    eye:'#cfe6c6',reflect:'rgba(150,220,150,.75)',
    tone:['#1a1610','#2e2418','#4a3a24'],rim:'rgba(190,225,190,.55)'});
  /* 手前の小さな仲間 */
  lizardArt(W*.86,H*.86,64,-1,{seed:9,headUp:.35,
    tone:['#151109','#241c10','#3a2c18'],rim:'rgba(190,225,190,.35)'});
  caption('遠い星に、まだ緑があると信じて。',cl((t-.5)/.55,0,1)*cl((1.75-t)/.4,0,1));
  x.restore();
}

/* ==================================================================
   ④  6.2–8.6  実験の反復 — 中核
   ================================================================== */
function b4(t,a){
  x.save();x.globalAlpha=a;
  sky('#080a10','#0c1017','#05070b');
  cam(1.02+t*.010,0,0);
  x.fillStyle='#0b0f16';x.fillRect(0,H*.70,W,H*.30);
  x.strokeStyle='rgba(140,152,168,.09)';x.lineWidth=1;
  for(let i=0;i<13;i++){x.beginPath();x.moveTo(W*.03+i*W*.077,H*.26);x.lineTo(W*.03+i*W*.077,H*.70);x.stroke();}
  x.fillStyle='#0a0d13';x.fillRect(W*.01,H*.30,W*.12,H*.40);x.fillRect(W*.87,H*.34,W*.12,H*.36);
  /* フラスコ列 */
  const N=8, base=H*.615, fs=30;
  let heroX=0;
  for(let i=0;i<N;i++){
    const fx=W*(.30+i*.055);
    const cyc=(t*2.6+i*.37)%1;
    const fail=cyc<.42?Math.sin(cyc/.42*Math.PI):0;
    const isHero=(i===3);if(isHero)heroX=fx;
    const held=isHero?ease(cl((t-1.45)/.55,0,1)):0;
    const lv=Math.max(fail*.8,held);
    flask(fx,base,fs,.42+.2*lv,lv>.05?`rgba(194,59,74,${.35+.6*lv})`:null);
  }
  /* 試行カウンタ */
  const cnt=Math.floor(ease(cl(t/1.55,0,1))*847), stop=t>1.5;
  x.save();x.textAlign='center';
  x.font='600 13px ui-monospace,Consolas,monospace';
  x.fillStyle='rgba(217,164,65,.42)';x.fillText('試行回数 / TRIALS',W*.5,H*.225);
  x.font='700 50px ui-monospace,Consolas,monospace';
  x.fillStyle=stop?'rgba(242,211,160,.96)':'rgba(226,214,196,.8)';
  if(stop)glow(AMB,18);
  x.fillText(String(stop?847:cnt).padStart(3,'0'),W*.5,H*.30);g0();x.restore();
  /* 失敗の明滅 */
  const fl=Math.max(0,Math.sin(t*13.5))*(t<1.45?.055:0);
  x.fillStyle=`rgba(194,59,74,${fl})`;x.fillRect(0,0,W,H);
  /* 成功の芯 */
  const win=ease(cl((t-1.55)/.6,0,1));
  if(win>0){glow(CRIM,60*win);
    const g=x.createRadialGradient(heroX,base,0,heroX,base,250*win);
    g.addColorStop(0,`rgba(242,211,160,${.5*win})`);g.addColorStop(.35,`rgba(194,59,74,${.28*win})`);
    g.addColorStop(1,'rgba(194,59,74,0)');
    x.fillStyle=g;x.beginPath();x.arc(heroX,base,250*win,0,6.29);x.fill();g0();}
  /* 研究するトカゲ(主役・下から深紅に照らされる) */
  lizardArt(W*.17,H*.90,112,1,{seed:4,headUp:.30,
    eye:'#f0cf9a',reflect:`rgba(194,59,74,${.45+.45*win})`,
    tone:['#241a12','#4e3a22','#7d5f36'],rim:`rgba(194,59,74,${.45+.4*win})`});
  lizardArt(W*.72,H*.92,92,-1,{seed:6,headUp:.42,
    eye:'#f0cf9a',reflect:`rgba(194,59,74,${.35+.4*win})`,
    tone:['#1e150e','#42311c','#6b502e'],rim:`rgba(194,59,74,${.35+.35*win})`});
  caption('生命をつなぐために、彼らは科学を注いだ。',cl((t-.3)/.5,0,1)*cl((1.45-t)/.35,0,1));
  caption('八百四十七回目。ようやく、ひとつが灯った。',cl((t-1.6)/.45,0,1)*cl((2.4-t)/.4,0,1));
  x.restore();
}

/* ==================================================================
   ⑤  8.5–10.2  生命へ
   ================================================================== */
function b5(t,a){
  x.save();x.globalAlpha=a;
  const open=ease(cl(t/1.3,0,1));
  sky(`rgb(${(10+16*open)|0},${(14+28*open)|0},${(22+24*open)|0})`,
      `rgb(${(16+24*open)|0},${(22+38*open)|0},${(26+24*open)|0})`,'#080b10');
  cam(1.06-t*.020,0,0);
  stars(t,.4*(1-open),0);
  x.save();x.globalAlpha=open;
  const g=x.createLinearGradient(0,H*.40,0,H*.80);
  g.addColorStop(0,'rgba(111,168,106,.18)');g.addColorStop(1,'rgba(111,168,106,0)');
  x.fillStyle=g;x.fillRect(0,H*.40,W,H*.40);x.restore();
  ridge(H*.68,14,5,`rgba(24,38,32,${.6+.4*open})`);
  ridge(H*.79,20,17,'#0c1310');
  /* 孵化 */
  const ct=cl((t-.2)/.7,0,1), lit=ease(cl((t-.68)/.5,0,1));
  egg(W*.44,H*.72,58,ct,lit);
  if(lit>0){x.save();x.globalAlpha=lit*.85;glow(AMB_L,50);
    x.strokeStyle=`rgba(242,211,160,${.45*lit})`;x.lineWidth=2;
    for(let i=0;i<10;i++){const a2=i/10*6.2832+t*.4;
      x.beginPath();x.moveTo(W*.44+Math.cos(a2)*44,H*.72+Math.sin(a2)*44);
      x.lineTo(W*.44+Math.cos(a2)*(78+130*lit),H*.72+Math.sin(a2)*(78+130*lit));x.stroke();}
    g0();x.restore();}
  /* 仔(小さく精緻に) */
  const rise=ease(cl((t-.9)/.55,0,1));
  if(rise>0){x.save();x.globalAlpha=rise;
    lizardArt(W*.505,H*.735+lerp(14,0,rise),46,1,{seed:11,headUp:.7,
      eye:'#f6e6bc',tone:['#26361f','#4e7a3e','#8fc06a'],rim:'rgba(242,211,160,.7)'});
    x.restore();}
  /* 見守る親 */
  lizardArt(W*.80,H*.86,104,-1,{seed:12,headUp:.28,
    eye:'#f0d9a4',reflect:'rgba(242,211,160,.6)',
    tone:['#243019','#4a5e2c','#7e9a4c'],rim:'rgba(242,211,160,.45)'});
  ridge(H*.985,8,21,VOID,18);
  caption('その灯が、次の生命を照らす。',cl((t-.8)/.5,0,1)*cl((1.7-t)/.4,0,1));
  x.restore();
}

/* ==================================================================
   ⑥ 10.1–11.6  題
   ================================================================== */
function b6(t,a){
  x.save();x.globalAlpha=a;
  sky('#0a0e15','#0d131c','#05070c');
  stars(t,.5,0);
  const g=x.createRadialGradient(W/2,H*.52,0,W/2,H*.52,H*.6);
  g.addColorStop(0,'rgba(217,164,65,.10)');g.addColorStop(1,'rgba(217,164,65,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  ridge(H*.86,16,5,'#0b1310');
  const ap=ease(cl(t/.75,0,1));
  x.save();x.globalAlpha=ap;x.textAlign='center';glow(AMB,26*ap);
  x.font='700 66px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  x.fillStyle='#f2d3a0';x.letterSpacing='14px';
  x.fillText('トカゲコロニー',W/2,H*.47);
  g0();x.letterSpacing='0px';
  x.font='500 17px ui-monospace,Consolas,monospace';
  x.fillStyle='rgba(217,164,65,.55)';x.letterSpacing='9px';
  x.fillText('LIZARD  COLONY',W/2,H*.545);x.letterSpacing='0px';
  x.strokeStyle=`rgba(217,164,65,${.4*ap})`;x.lineWidth=1;
  x.beginPath();x.moveTo(W*.36,H*.505);x.lineTo(W*.64,H*.505);x.stroke();
  x.restore();
  lizardArt(W*.5,H*.80,86,1,{seed:13,headUp:.35,
    eye:'#f6e6bc',tone:['#20281a','#3e5030','#6e8a52'],rim:'rgba(242,211,160,.5)'});
  x.restore();
}

/* ---- timeline ---- */
const BEATS=[
  {f:b1,s:0.00,e:2.60},{f:b2,s:2.50,e:4.60},{f:b3,s:4.50,e:6.30},
  {f:b4,s:6.20,e:8.60},{f:b5,s:8.50,e:10.20},{f:b6,s:10.10,e:11.60},
];
const FADE=0.24, TOTAL=11.6;
let T0=null, ended=false;

function frame(now){
  if(T0===null)T0=now;
  let t=(now-T0)/1000;
  if(RM)t=TOTAL-0.5;
  if(t>TOTAL){t=TOTAL;ended=true;}
  x.setTransform(1,0,0,1,0,0);
  x.fillStyle=VOID;x.fillRect(0,0,W,H);
  BEATS.forEach(b=>{
    if(t<b.s-FADE||t>b.e+FADE)return;
    let a=1;
    if(t<b.s)a=ease((t-(b.s-FADE))/FADE);
    else if(t>b.e)a=1-ease((t-b.e)/FADE);
    if(a>0){x.save();b.f(t-b.s,a);x.restore();}
  });
  x.setTransform(1,0,0,1,0,0);
  grade(t);
  if(t<0.4){x.fillStyle=`rgba(4,6,10,${1-ease(t/0.4)})`;x.fillRect(0,0,W,H);}
  if(!RM)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('replay').onclick=()=>{T0=null;ended=false;};
document.getElementById('skip').onclick=()=>{T0=performance.now()-(TOTAL-1.4)*1000;};
cv.onclick=()=>{if(!ended)T0=performance.now()-(TOTAL-1.4)*1000;};
</script>
