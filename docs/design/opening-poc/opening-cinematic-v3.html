<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>トカゲコロニー — オープニング試作 v3 (Flat 2D / Lore)</title>
<style>
  html,body{margin:0;height:100%;background:#080a0e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#080a0e;cursor:pointer;
    image-rendering:auto}
  #ui{position:fixed;left:0;right:0;bottom:12px;display:flex;gap:10px;justify-content:center;
    font-size:11px;color:rgba(224,214,198,.4);letter-spacing:.08em;pointer-events:none}
  #ui b{pointer-events:auto;cursor:pointer;font-weight:500;padding:4px 12px;
    border:1px solid rgba(224,214,198,.16);transition:color .2s,border-color .2s}
  #ui b:hover{color:#f2d3a0;border-color:rgba(242,211,160,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="ui"><b id="replay">もう一度</b><b id="skip">スキップ</b></div>
<script>
"use strict";
/* ==================================================================
   トカゲコロニー オープニング v3 — フラット2D / 世界観の凝縮
   規律: 面はベタ塗り・輪郭は硬い・陰影は直線で割る。
         放射グラデーションと光彩ぼかしは原則使わない(立体化の元)。
   構成: 8カットでLoreを説明する
     ①故郷の崩壊 ②脱出 ③十の星 ④純血=二種 ⑤四重スリット
     ⑥虹と石 ⑦コロニー ⑧題
   ================================================================== */
const cv=document.getElementById('c'), x=cv.getContext('2d');
const W=1280,H=720;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- 限定パレット(フラット) ---- */
const INK='#0b0d12', INK2='#141922', PAPER='#e8dfcd',
      CRIM='#c8384a', CRIM_D='#7e1526', AMB='#e0a83c', AMB_D='#9a6c1c',
      LIFE='#6fae62', LIFE_D='#3d6b3a', SKY='#2e4a63', SKY_D='#1a2c3e',
      ASH='#6a6f78', BONE='#c9c1ae';

const cl=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>{t=cl(t,0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(a,b){let h=(a*374761393+b*668265263)^(a<<7);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295;}
function poly(pts,col){x.fillStyle=col;x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();x.fill();}
function band(y0,y1,col){x.fillStyle=col;x.fillRect(0,y0,W,y1-y0);}
/* ぎざぎざの地平(直線分割) */
function jag(y,amp,seed,col,step){
  x.fillStyle=col;x.beginPath();x.moveTo(-10,H+10);x.lineTo(-10,y);
  const st=step||64;
  for(let i=-10;i<=W+10;i+=st){
    const n=hash(seed,Math.floor(i/st));
    x.lineTo(i,y-n*amp);x.lineTo(i+st*.5,y-hash(seed+3,Math.floor(i/st))*amp*.6);
  }
  x.lineTo(W+10,H+10);x.closePath();x.fill();
}

/* ==================================================================
   フラットなトカゲ(2Dポリゴン・2階調・硬い輪郭)
   s=胴長。原点=胴中心。dir=1で右向き。
   ================================================================== */
const LZ_BODY=[
  [-2.16,-0.02],[-1.34,-0.16],[-0.72,-0.24],[-0.10,-0.30],[0.44,-0.27],
  [0.66,-0.36],[0.98,-0.33],[1.26,-0.18],[1.36,-0.03],[1.06,0.07],
  [0.72,0.05],[0.50,0.16],[0.16,0.26],[-0.28,0.24],[-0.72,0.28],
  [-1.30,0.14],[-1.72,0.10]
];
function flatLizard(cx,cy,s,dir,col,colD,o){
  o=o||{};
  x.save();x.translate(cx,cy);x.scale(dir*s,s);
  if(o.headUp){x.rotate(-o.headUp*0.06);}
  /* 脚(角ばった四角) */
  poly([[-0.62,0.16],[-0.40,0.16],[-0.30,0.50],[-0.52,0.50]],colD);
  poly([[0.30,0.14],[0.52,0.14],[0.60,0.50],[0.38,0.50]],colD);
  poly([[-0.56,0.50],[-0.22,0.50],[-0.20,0.58],[-0.58,0.58]],colD);   // 足
  poly([[0.34,0.50],[0.68,0.50],[0.70,0.58],[0.32,0.58]],colD);
  /* 胴 */
  poly(LZ_BODY,col);
  /* 影の側(直線で割る) */
  x.save();
  x.beginPath();x.moveTo(LZ_BODY[0][0],LZ_BODY[0][1]);
  for(let i=1;i<LZ_BODY.length;i++)x.lineTo(LZ_BODY[i][0],LZ_BODY[i][1]);
  x.closePath();x.clip();
  poly([[-2.4,-0.5],[1.6,-0.5],[1.6,-0.10],[-2.4,0.06]],colD);
  x.restore();
  /* 背稜(三角の列) */
  for(let i=0;i<9;i++){
    const t=i/8, px=lerp(-1.5,0.9,t), py=lerp(-0.13,-0.31,Math.sin(t*Math.PI)*.9);
    poly([[px-0.07,py],[px,py-0.13],[px+0.07,py]],colD);
  }
  /* 帯模様(直線) */
  x.save();
  x.beginPath();x.moveTo(LZ_BODY[0][0],LZ_BODY[0][1]);
  for(let i=1;i<LZ_BODY.length;i++)x.lineTo(LZ_BODY[i][0],LZ_BODY[i][1]);
  x.closePath();x.clip();
  for(let i=0;i<4;i++){const bx=-0.9+i*0.52;
    poly([[bx,-0.4],[bx+0.13,-0.4],[bx+0.05,0.4],[bx-0.08,0.4]],colD);}
  x.restore();
  /* 眼(角ばった一点) */
  poly([[1.00,-0.20],[1.14,-0.20],[1.14,-0.09],[1.00,-0.09]],INK);
  if(o.eye!==false)poly([[1.03,-0.18],[1.09,-0.18],[1.09,-0.13],[1.03,-0.13]],o.eye||PAPER);
  /* 特性の徴(任意) */
  if(o.mark){poly([[0.10,-0.34],[0.30,-0.34],[0.30,-0.20],[0.10,-0.20]],o.mark);}
  x.restore();
}

/* 惑星の幾何(四重スリットの語彙を流用) */
function ringShape(cx,cy,r,sides,col,lw,rot,starF){
  x.save();x.translate(cx,cy);x.rotate(rot||0);
  x.strokeStyle=col;x.lineWidth=lw||3;x.lineJoin='miter';
  x.beginPath();
  if(!sides){x.arc(0,0,r,0,6.2832);}
  else{
    const n=starF?sides*2:sides;
    for(let i=0;i<n;i++){
      const a=i/n*6.2832-1.5708;
      const rr=starF&&i%2?r*starF:r;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath();
  }
  x.stroke();x.restore();
}
/* 10惑星の識別(色 + 幾何) */
const PLANETS=[
  {n:'アリド',   c:'#c9a06a', s:0,  f:0},
  {n:'ネオヴェルデ',c:'#3fb6c8', s:4,  f:0},
  {n:'シルヴァ', c:'#6fae62', s:12, f:.9},
  {n:'パルス',   c:'#b98a3c', s:3,  f:0},
  {n:'イグニス', c:'#d4562f', s:5,  f:.52},
  {n:'ユンガ',   c:'#3f8f5e', s:10, f:.86},
  {n:'メアリス', c:'#5fb9a8', s:8,  f:0},
  {n:'グラキス', c:'#9fc4de', s:6,  f:0},
  {n:'ヴォルタ', c:'#8a97a4', s:14, f:.78},
  {n:'オリジン', c:'#d8b45f', s:7,  f:.55},
];

function caption(txt,alpha,y,size){
  if(alpha<=0)return;
  x.save();x.globalAlpha=alpha;x.textAlign='center';
  x.font=`600 ${size||22}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
  x.fillStyle=PAPER;
  x.fillText(txt,W/2,y||H-92);
  x.restore();
}
function frameBars(){x.fillStyle=INK;x.fillRect(0,0,W,54);x.fillRect(0,H-54,W,54);}
function grain(t){
  x.globalAlpha=.05;
  for(let i=0;i<340;i++){const gi=Math.floor(t*11)+i;
    x.fillStyle=hash(gi,7)>.5?'#fff':'#000';
    x.fillRect(hash(gi,1)*W,hash(gi,2)*H,2,2);}
  x.globalAlpha=1;
}

/* ==================================================================
   ① 0.0–1.5  故郷の崩壊
   ================================================================== */
function b1(t,a){
  x.save();x.globalAlpha=a;
  band(0,H*.62,'#3a1520'); band(H*.62,H,'#1a0d12');
  /* 崩れる空 = 深紅の帯 */
  for(let i=0;i<5;i++){
    const yy=H*.10+i*H*.085, w=W*(.5+hash(i,1)*.5)*cl(t*1.4,0,1);
    poly([[0,yy],[w,yy-14],[w,yy+18],[0,yy+30]],i%2?CRIM:CRIM_D);
  }
  jag(H*.66,52,3,'#241018',96);
  jag(H*.76,40,9,INK2,72);
  /* バガーの脈(直線の折れ) */
  x.save();x.globalAlpha=cl(t/.7,0,1);
  x.strokeStyle=CRIM;x.lineWidth=5;x.lineCap='butt';
  for(let b=0;b<6;b++){
    let px=W*(.1+b*.16), py=H*.68, a2=-1.5708+(hash(b,2)-.5)*1.4;
    x.beginPath();x.moveTo(px,py);
    for(let i=0;i<7;i++){a2+=(hash(b,i)-.5)*1.1;px+=Math.cos(a2)*34;py+=Math.sin(a2)*34;x.lineTo(px,py);}
    x.stroke();
  }
  x.restore();
  /* 逃げる影 */
  const run=ease(cl(t/1.3,0,1));
  [[.30,.86,52],[.46,.90,40],[.62,.865,46],[.76,.895,34]].forEach(([px,py,s],i)=>{
    flatLizard(W*px-run*W*.10,H*py,s,-1,INK,INK,{eye:CRIM});
  });
  frameBars();
  caption('故郷は、内側から喰われた。',cl((t-.25)/.4,0,1)*cl((1.45-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ② 1.4–2.7  脱出
   ================================================================== */
function b2(t,a){
  x.save();x.globalAlpha=a;
  band(0,H*.70,SKY_D); band(H*.70,H,INK);
  /* 星(四角) */
  for(let i=0;i<40;i++){x.fillStyle=BONE;
    x.globalAlpha=a*(.3+hash(i,5)*.5);
    x.fillRect(hash(i,1)*W,hash(i,2)*H*.7,2,2);}
  x.globalAlpha=a;
  jag(H*.74,44,3,'#20232c',86);
  /* ロケット(フラットな多角形) */
  const up=ease(cl(t/1.0,0,1));
  const rx=W*.52, ry=lerp(H*.66,-H*.18,up*up), s=lerp(1,.7,up);
  x.save();x.translate(rx,ry);x.scale(s,s);
  poly([[0,-120],[34,-30],[34,66],[-34,66],[-34,-30]],BONE);        // 機体
  poly([[0,-120],[34,-30],[6,-30],[6,-120]],'#8d8677');             // 影側
  poly([[34,30],[78,80],[34,66]],CRIM);                             // 翼
  poly([[-34,30],[-78,80],[-34,66]],CRIM_D);
  poly([[-14,-58],[14,-58],[14,-34],[-14,-34]],SKY);                // 窓
  /* 炎(角ばった三角) */
  const fl=1+.35*Math.sin(t*22);
  poly([[-26,66],[26,66],[10,66+70*fl],[0,66+40*fl],[-12,66+86*fl]],AMB);
  poly([[-14,66],[14,66],[4,66+42*fl],[-6,66+56*fl]],PAPER);
  x.restore();
  /* 見送る影 */
  [[.18,58],[.30,44],[.82,50]].forEach(([px,s2])=>{
    flatLizard(W*px,H*.80,s2,1,INK,INK,{headUp:1,eye:AMB});
  });
  frameBars();
  caption('積んだのは、科学だけだった。',cl((t-.2)/.4,0,1)*cl((1.2-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ③ 2.6–4.3  十の星
   ================================================================== */
function b3(t,a){
  x.save();x.globalAlpha=a;
  band(0,H,'#0a0f16');
  for(let i=0;i<50;i++){x.fillStyle=BONE;x.globalAlpha=a*(.25+hash(i,5)*.45);
    x.fillRect(hash(i,1)*W,hash(i,2)*H,2,2);}
  x.globalAlpha=a;
  /* 10惑星が順に現れる(2列) */
  PLANETS.forEach((p,i)=>{
    const ap=ease(cl((t-.10-i*.085)/.34,0,1));
    if(ap<=0)return;
    const col=i%5, row=Math.floor(i/5);
    const px=W*.16+col*W*.17, py=H*.40+row*H*.24;
    x.save();x.globalAlpha=a*ap;
    x.fillStyle=p.c;x.beginPath();x.arc(px,py,34,0,6.2832);x.fill();
    x.fillStyle='rgba(0,0,0,.32)';                       // 影側(直線で割る)
    x.beginPath();x.arc(px,py,34,-0.6,2.54);x.closePath();x.fill();
    ringShape(px,py,52,p.s,p.c,2.5,t*.5+i,p.f);
    x.font='500 12px "Hiragino Kaku Gothic ProN",sans-serif';
    x.textAlign='center';x.fillStyle='rgba(232,223,205,.72)';
    x.fillText(p.n,px,py+74);
    x.restore();
  });
  /* 航路 */
  x.save();x.globalAlpha=a*cl((t-.9)/.5,0,1);
  x.strokeStyle=AMB;x.lineWidth=2;x.setLineDash([10,9]);x.lineDashOffset=-t*40;
  x.beginPath();x.moveTo(W*.10,H*.30);
  x.lineTo(W*.50,H*.26);x.lineTo(W*.90,H*.34);x.stroke();x.setLineDash([]);x.restore();
  frameBars();
  caption('十の星を巡る旅が、始まった。',cl((t-.7)/.4,0,1)*cl((1.65-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ④ 4.2–5.5  純血 = 星ごとに二種
   ================================================================== */
function b4(t,a){
  x.save();x.globalAlpha=a;
  band(0,H*.58,'#173042'); band(H*.58,H,'#0d1a24');
  jag(H*.62,36,7,'#0d1a24',88);
  /* 星の記号 */
  x.save();x.globalAlpha=a*.55;
  ringShape(W*.5,H*.30,86,4,'#3fb6c8',3,t*.4);
  x.restore();
  /* 二種が向き合う */
  const step=ease(cl(t/.7,0,1));
  flatLizard(lerp(W*.20,W*.36,step),H*.72,86,1,'#d8b25f','#8a6a34',{eye:INK});
  flatLizard(lerp(W*.80,W*.64,step),H*.72,86,-1,'#7fc0a8','#3d7060',{eye:INK});
  /* 交わらない線 */
  x.save();x.globalAlpha=a*cl((t-.55)/.4,0,1);
  x.strokeStyle=CRIM;x.lineWidth=3;x.setLineDash([12,8]);
  x.beginPath();x.moveTo(W*.5,H*.34);x.lineTo(W*.5,H*.86);x.stroke();x.setLineDash([]);
  x.restore();
  frameBars();
  caption('星ごとに、二種だけが生きる。',cl((t-.3)/.4,0,1)*cl((1.25-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ⑤ 5.4–7.0  四重スリットと賢者の石
   ================================================================== */
function b5(t,a){
  x.save();x.globalAlpha=a;
  band(0,H,'#0a0c12');
  /* 四重の環(実装の骨格に対応: 4基が別速度で回る) */
  const cx=W*.5, cy=H*.46;
  const R=[210,166,122,78], SP=[.28,-.42,.61,-.85], SD=[7,4,3,0], SF=[.55,0,0,0];
  R.forEach((r,i)=>{
    const ap=ease(cl((t-i*.13)/.4,0,1));
    if(ap<=0)return;
    x.save();x.globalAlpha=a*ap;
    ringShape(cx,cy,r,SD[i],i===0?AMB:BONE,3,t*SP[i],SF[i]);
    x.restore();
  });
  /* 球が中心へ落ちる */
  const drop=ease(cl((t-.55)/.65,0,1));
  if(drop>0){
    const by=lerp(cy-260,cy,drop);
    x.fillStyle=PAPER;x.fillRect(cx-5,by-5,10,10);
  }
  /* 石の生成(フラットな菱形) */
  const born=ease(cl((t-1.15)/.4,0,1));
  if(born>0){
    x.save();x.globalAlpha=a*born;
    const s=26*born;
    poly([[cx,cy-s],[cx+s*.7,cy],[cx,cy+s],[cx-s*.7,cy]],CRIM);
    poly([[cx,cy-s],[cx+s*.7,cy],[cx,cy],[cx-s*.7,cy]],'#e05a68');
    /* 放射(直線) */
    x.strokeStyle=CRIM;x.lineWidth=2;
    for(let i=0;i<8;i++){const ang=i/8*6.2832+t*.3;
      x.beginPath();x.moveTo(cx+Math.cos(ang)*40,cy+Math.sin(ang)*40);
      x.lineTo(cx+Math.cos(ang)*(56+30*born),cy+Math.sin(ang)*(56+30*born));x.stroke();}
    x.restore();
  }
  /* 見上げる二匹 */
  flatLizard(W*.16,H*.88,68,1,'#4e3a22','#241a12',{headUp:1,eye:CRIM});
  flatLizard(W*.86,H*.88,60,-1,'#42311c','#1e150e',{headUp:1,eye:CRIM});
  frameBars();
  caption('賢者の石は、四重の壁の先にある。',cl((t-.25)/.4,0,1)*cl((1.55-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ⑥ 6.9–8.3  虹と、個性
   ================================================================== */
function b6(t,a){
  x.save();x.globalAlpha=a;
  band(0,H*.66,'#1a2430'); band(H*.66,H,'#101820');
  /* 虹 = フラットな帯のアーチ */
  const RB=['#d95f5f','#e0a83c','#e8d75c','#6fae62','#4f9ed0','#6f68c8','#a95fc0'];
  const ra=ease(cl(t/.55,0,1));
  x.save();x.globalAlpha=a*ra;
  RB.forEach((c,i)=>{
    x.strokeStyle=c;x.lineWidth=17;
    x.beginPath();x.arc(W*.5,H*.86,300-i*18,Math.PI*1.06,Math.PI*1.94);x.stroke();
  });
  x.restore();
  /* 石の道(深紅の菱形列) */
  x.save();x.globalAlpha=a*ease(cl((t-.35)/.5,0,1));
  for(let i=0;i<4;i++){const px=W*.5+(i-1.5)*44, py=H*.30, s=11;
    poly([[px,py-s],[px+s*.7,py],[px,py+s],[px-s*.7,py]],CRIM);}
  x.restore();
  /* 特性を宿した個体たち */
  const marks=[CRIM,AMB,LIFE,'#6f68c8'];
  [[.20,72,1],[.40,64,1],[.62,68,-1],[.82,60,-1]].forEach(([px,s,d],i)=>{
    const ap=ease(cl((t-.45-i*.09)/.32,0,1));
    if(ap<=0)return;
    x.save();x.globalAlpha=a*ap;
    flatLizard(W*px,H*.90,s,d,'#c9a06a','#7c5f38',{eye:INK,mark:marks[i]});
    x.restore();
  });
  frameBars();
  caption('虹は生命の祝祭。石は、個性の錬成。',cl((t-.5)/.4,0,1)*cl((1.35-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ⑦ 8.2–9.7  コロニー
   ================================================================== */
function b7(t,a){
  x.save();x.globalAlpha=a;
  band(0,H*.44,'#25384a'); band(H*.44,H*.60,'#3a4a3a'); band(H*.60,H,'#4a3a28');
  /* 都市の稜線(フラットな矩形) */
  for(let i=0;i<14;i++){const bw=W/14, bh=H*(.06+hash(i,1)*.13);
    x.fillStyle='#1b2a38';x.fillRect(i*bw,H*.44-bh,bw-4,bh);
    for(let k=0;k<4;k++){x.fillStyle=hash(i,k)>.5?AMB:'#2c3f52';
      x.fillRect(i*bw+8+k*11,H*.44-bh+10,5,5);}}
  jag(H*.62,26,5,'#33402f',90);
  /* 設備(フラットな図形) */
  x.fillStyle='#2f4a5c';x.beginPath();x.ellipse(W*.24,H*.80,120,30,0,0,6.29);x.fill();   // 水場
  x.fillStyle='#5a4a30';x.beginPath();x.ellipse(W*.72,H*.72,84,22,0,Math.PI,0);x.fill(); // 巣
  poly([[W*.50,H*.50],[W*.56,H*.60],[W*.44,H*.60]],'#8fa8b8');                            // ビーム
  /* たくさんのトカゲ */
  const many=[[.12,.86,44,1],[.22,.90,38,1],[.33,.84,50,-1],[.44,.92,34,1],
              [.55,.86,46,-1],[.66,.90,40,1],[.78,.85,48,-1],[.88,.91,36,-1]];
  many.forEach(([px,py,s,d],i)=>{
    const ap=ease(cl((t-i*.055)/.3,0,1));
    if(ap<=0)return;
    x.save();x.globalAlpha=a*ap;
    const pal=[['#d8b25f','#8a6a34'],['#7fc0a8','#3d7060'],['#c9a06a','#7c5f38'],['#b0705a','#6a3f30']][i%4];
    flatLizard(W*px,H*py,s,d,pal[0],pal[1],{eye:INK,mark:i%3===0?CRIM:null});
    x.restore();
  });
  frameBars();
  caption('あとは、育てて、眺めるだけ。',cl((t-.5)/.4,0,1)*cl((1.45-t)/.3,0,1));
  x.restore();
}

/* ==================================================================
   ⑧ 9.6–11.0  題
   ================================================================== */
function b8(t,a){
  x.save();x.globalAlpha=a;
  band(0,H,'#0b0f14');
  const ap=ease(cl(t/.6,0,1));
  x.save();x.globalAlpha=a*ap;x.textAlign='center';
  x.font='700 68px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  x.fillStyle=AMB;x.letterSpacing='16px';
  x.fillText('トカゲコロニー',W/2,H*.47);
  x.letterSpacing='0px';
  x.font='500 16px ui-monospace,Consolas,monospace';
  x.fillStyle='rgba(224,168,60,.6)';x.letterSpacing='10px';
  x.fillText('LIZARD  COLONY',W/2,H*.545);x.letterSpacing='0px';
  x.fillStyle=AMB;x.fillRect(W*.38,H*.50,W*.24,2);
  x.restore();
  flatLizard(W*.5,H*.75,80,1,'#c9a06a','#7c5f38',{eye:INK});
  frameBars();
  x.restore();
}

/* ---- timeline ---- */
const BEATS=[
  {f:b1,s:0.00,e:1.50},{f:b2,s:1.40,e:2.70},{f:b3,s:2.60,e:4.30},
  {f:b4,s:4.20,e:5.50},{f:b5,s:5.40,e:7.00},{f:b6,s:6.90,e:8.30},
  {f:b7,s:8.20,e:9.70},{f:b8,s:9.60,e:11.00},
];
const FADE=0.16, TOTAL=11.0;
let T0=null, ended=false;

function frame(now){
  if(T0===null)T0=now;
  let t=(now-T0)/1000;
  if(RM)t=TOTAL-0.5;
  if(t>TOTAL){t=TOTAL;ended=true;}
  x.setTransform(1,0,0,1,0,0);
  x.fillStyle=INK;x.fillRect(0,0,W,H);
  BEATS.forEach(b=>{
    if(t<b.s-FADE||t>b.e+FADE)return;
    let al=1;
    if(t<b.s)al=ease((t-(b.s-FADE))/FADE);
    else if(t>b.e)al=1-ease((t-b.e)/FADE);
    if(al>0){x.save();b.f(t-b.s,al);x.restore();}
  });
  x.setTransform(1,0,0,1,0,0);
  grain(t);
  if(t<0.3){x.fillStyle=`rgba(11,13,18,${1-ease(t/0.3)})`;x.fillRect(0,0,W,H);}
  if(!RM)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('replay').onclick=()=>{T0=null;ended=false;};
document.getElementById('skip').onclick=()=>{T0=performance.now()-(TOTAL-1.3)*1000;};
cv.onclick=()=>{if(!ended)T0=performance.now()-(TOTAL-1.3)*1000;};
</script>
